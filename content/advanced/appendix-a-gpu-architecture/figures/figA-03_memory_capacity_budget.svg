<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-3 显存容量预算</title><desc id="fig-desc">展示 GPU Memory 中模型权重、KV Cache、Workspace、Runtime 和 Reserve 的占用关系，并用 required 小于等于 usable 判断是否可运行。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.mid{fill:#475569}.light{fill:#94A3B8}.pale{fill:#CBD5E1}.reserve{fill:#E2E8F0}.h{font-size:18px;font-weight:750}.hd{font-size:16px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.formula{font-size:18px;font-weight:700}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">MEMORY CAPACITY · 03</text><text class="t" x="56" y="84">显存容量预算：不能只算模型权重</text><text class="sub" x="56" y="114">稳定运行需要同时容纳权重、动态状态、工作区、Runtime 和余量</text>
  <g transform="translate(56 186)"><rect class="card" width="1168" height="188" rx="22"/><text class="h" x="24" y="40">GPU Memory · 100%</text>
    <g transform="translate(24 66)"><rect class="dark" width="376" height="88" rx="14"/><text class="hd" x="188" y="38" text-anchor="middle" fill="#FFFFFF">Model Weights</text><text class="hd" x="188" y="66" text-anchor="middle" fill="#CBD5E1">parameters × bytes</text><rect class="mid" x="376" width="292" height="88"/><text class="hd" x="522" y="38" text-anchor="middle" fill="#FFFFFF">KV Cache</text><text class="hd" x="522" y="66" text-anchor="middle" fill="#E2E8F0">grows with active tokens</text><rect class="light" x="668" width="170" height="88"/><text class="hd" x="753" y="52" text-anchor="middle" fill="#FFFFFF">Workspace</text><rect class="pale" x="838" width="122" height="88"/><text class="h" x="899" y="52" text-anchor="middle">Runtime</text><rect class="reserve" x="960" width="160" height="88" rx="14"/><text class="h" x="1040" y="38" text-anchor="middle">Reserve</text><text class="s" x="1040" y="66" text-anchor="middle">不可挤占</text></g>
  </g>
  <g transform="translate(56 414)"><rect class="card" width="522" height="148" rx="20"/><text class="h" x="28" y="42">Required</text><text class="formula" x="28" y="80">Weights + KV + Workspace + Runtime</text><text class="s" x="28" y="116">框架实测通常高于裸公式</text></g><path class="flow" d="M578 488H682"/><path d="M682 488l-9 -6v12z" fill="#334155"/><g transform="translate(688 414)"><rect class="dark" width="536" height="148" rx="20"/><text class="hd" x="268" y="46" text-anchor="middle" fill="#FFFFFF">required ≤ usable ?</text><text class="hd" x="150" y="98" text-anchor="middle" fill="#86EFAC">FITS</text><text class="hd" x="386" y="98" text-anchor="middle" fill="#FDBA74">OVERFLOW</text><path d="M268 62V120" stroke="#64748B" stroke-width="1.5"/></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">稳定运行要给 KV Cache、工作区和运行时留出显式余量。</text>
</svg>
