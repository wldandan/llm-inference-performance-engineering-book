<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-7 进阶硬件地图</title><desc id="fig-desc">用一张简化地图说明 GPU 包含多个 SM，SM 内有 Warp Scheduler、Warps、Tensor Core、Register 和 Shared Memory，并解释 Occupancy 的位置。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">HARDWARE MAP · 07</text><text class="t" x="56" y="84">进阶硬件地图：需要做 Kernel 分析时再深入</text><text class="sub" x="56" y="114">做服务调优，知道这些名词各回答什么问题就够了</text>
  <g transform="translate(56 172)"><rect class="dark" width="210" height="388" rx="22"/><text class="hd" x="105" y="54" text-anchor="middle" fill="#FFFFFF">GPU</text><text class="sd" x="105" y="88" text-anchor="middle" fill="#CBD5E1">多个 SM</text><g transform="translate(30 126)"><rect fill="#334155" width="150" height="58" rx="12"/><text class="hd" x="75" y="36" text-anchor="middle" fill="#FFFFFF">SM 0</text><rect fill="#334155" y="76" width="150" height="58" rx="12"/><text class="hd" x="75" y="112" text-anchor="middle" fill="#FFFFFF">SM 1</text><rect fill="#334155" y="152" width="150" height="58" rx="12"/><text class="hd" x="75" y="188" text-anchor="middle" fill="#FFFFFF">··· SM N</text></g></g>
  <path class="flow" d="M266 366H340"/><path d="M340 366l-9 -6v12z" fill="#334155"/><g transform="translate(346 172)"><rect class="card" width="878" height="388" rx="22"/><text class="h" x="28" y="44">Inside One SM</text>
    <g transform="translate(28 76)"><rect class="dark" width="202" height="112" rx="16"/><text class="hd" x="101" y="44" text-anchor="middle" fill="#FFFFFF">Warp Scheduler</text><text class="sd" x="101" y="76" text-anchor="middle" fill="#CBD5E1">选择可执行 Warp</text></g><path class="flow" d="M230 132H294"/><path d="M294 132l-9 -6v12z" fill="#334155"/>
    <g transform="translate(300 76)"><rect class="card" width="202" height="112" rx="16"/><text class="h" x="101" y="42" text-anchor="middle">Active Warps</text><text class="s" x="101" y="74" text-anchor="middle">通常 32 threads / Warp</text></g><path class="flow" d="M502 132H566"/><path d="M566 132l-9 -6v12z" fill="#334155"/>
    <g transform="translate(572 76)"><rect class="dark" width="250" height="112" rx="16"/><text class="hd" x="125" y="42" text-anchor="middle" fill="#FFFFFF">Execution Units</text><text class="sd" x="125" y="74" text-anchor="middle" fill="#CBD5E1">CUDA Cores · Tensor Cores</text></g>
    <g transform="translate(28 230)"><rect class="card" width="250" height="102" rx="16"/><text class="h" x="125" y="42" text-anchor="middle">Registers</text><text class="s" x="125" y="72" text-anchor="middle">每线程 · 快但稀缺</text></g><g transform="translate(304 230)"><rect class="card" width="250" height="102" rx="16"/><text class="h" x="125" y="42" text-anchor="middle">Shared Memory</text><text class="s" x="125" y="72" text-anchor="middle">线程块内复用</text></g><g transform="translate(580 230)"><rect class="tag" width="242" height="102" rx="16"/><text class="h" x="121" y="40" text-anchor="middle">Occupancy</text><text class="tagt" x="121" y="70" text-anchor="middle">active warps / limit</text></g>
  </g>
  <rect class="tag" x="350" y="586" width="580" height="40" rx="20"/><text class="tagt" x="640" y="612" text-anchor="middle">Occupancy 是线索，不是“越高越快”的性能总分</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">做服务调优只需知道这些指标回答什么，Kernel 级分析时再深入。</text>
</svg>
