<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-2 LLM 工作怎样落到 GPU 资源</title><desc id="fig-desc">把权重与 KV Cache、Attention 与 MLP、数据移动和算子序列分别映射到容量、计算吞吐、显存带宽和 Kernel Launch 四类资源。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.label{font-size:14px;font-weight:700;fill:#64748B}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">WORK TO RESOURCE · 02</text><text class="t" x="56" y="84">LLM 工作怎样落到 GPU 资源</text><text class="sub" x="56" y="114">第 4 章的模型对象和算子，会同时消耗四种预算</text>
  <text class="label" x="60" y="164">MODEL WORK</text><text class="label" x="964" y="164">GPU CONSTRAINT</text>
  <g transform="translate(56 184)"><rect class="card" width="430" height="82" rx="16"/><text class="h" x="24" y="34">Weights + KV Cache</text><text class="s" x="24" y="60">参数常驻 · 活跃上下文持续增长</text></g><path class="flow" d="M486 225H780"/><path d="M780 225l-9 -6v12z" fill="#334155"/><g transform="translate(786 184)"><rect class="dark" width="438" height="82" rx="16"/><text class="hd" x="28" y="35" fill="#FFFFFF">Memory Capacity</text><text class="sd" x="28" y="61" fill="#CBD5E1">权重与运行状态能否同时放下</text></g>
  <g transform="translate(56 286)"><rect class="card" width="430" height="82" rx="16"/><text class="h" x="24" y="34">Attention + MLP + LM Head</text><text class="s" x="24" y="60">矩阵乘、归一化、激活与投影</text></g><path class="flow" d="M486 327H780"/><path d="M780 327l-9 -6v12z" fill="#334155"/><g transform="translate(786 286)"><rect class="dark" width="438" height="82" rx="16"/><text class="hd" x="28" y="35" fill="#FFFFFF">Compute Throughput</text><text class="sd" x="28" y="61" fill="#CBD5E1">计算单元能否及时完成运算</text></g>
  <g transform="translate(56 388)"><rect class="card" width="430" height="82" rx="16"/><text class="h" x="24" y="34">Weights + Activations + K/V</text><text class="s" x="24" y="60">HBM 与片上存储之间的数据移动</text></g><path class="flow" d="M486 429H780"/><path d="M780 429l-9 -6v12z" fill="#334155"/><g transform="translate(786 388)"><rect class="dark" width="438" height="82" rx="16"/><text class="hd" x="28" y="35" fill="#FFFFFF">Memory Bandwidth</text><text class="sd" x="28" y="61" fill="#CBD5E1">计算单元能否及时拿到数据</text></g>
  <g transform="translate(56 490)"><rect class="card" width="430" height="82" rx="16"/><text class="h" x="24" y="34">Operator Sequence</text><text class="s" x="24" y="60">Runtime 按依赖提交一串 GPU Kernel</text></g><path class="flow" d="M486 531H780"/><path d="M780 531l-9 -6v12z" fill="#334155"/><g transform="translate(786 490)"><rect class="dark" width="438" height="82" rx="16"/><text class="hd" x="28" y="35" fill="#FFFFFF">Kernel Launch Overhead</text><text class="sd" x="28" y="61" fill="#CBD5E1">大量短任务的固定提交成本</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">一次模型前向同时消耗容量、算力、带宽和提交预算。</text>
</svg>
