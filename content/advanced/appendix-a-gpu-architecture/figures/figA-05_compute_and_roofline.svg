<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-5 算力与 Roofline 直觉</title><desc id="fig-desc">用 Compute Lower Bound、Bandwidth Lower Bound、Arithmetic Intensity 和 Ridge Point 说明如何选择带宽或算力候选约束。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.axis{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.roof{fill:none;stroke:#0F172A;stroke-width:5;stroke-linecap:round}.dash{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:7 6}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.formula{font-size:18px;font-weight:700}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">ROOFLINE INTUITION · 05</text><text class="t" x="56" y="84">算力与 Roofline 直觉</text><text class="sub" x="56" y="114">比较计算与搬运的时间下界，先选最值得验证的方向</text>
  <g transform="translate(56 176)"><rect class="card" width="366" height="158" rx="20"/><text class="h" x="24" y="42">Compute Lower Bound</text><text class="formula" x="24" y="84">T_compute ≥ FLOPs</text><text class="formula" x="170" y="116">÷ Effective Throughput</text></g>
  <g transform="translate(56 364)"><rect class="card" width="366" height="158" rx="20"/><text class="h" x="24" y="42">Bandwidth Lower Bound</text><text class="formula" x="24" y="84">T_bandwidth ≥ Bytes</text><text class="formula" x="170" y="116">÷ Effective Bandwidth</text></g>
  <g transform="translate(492 166)"><rect class="card" width="732" height="392" rx="22"/><text class="h" x="28" y="42">Conceptual Roofline</text><path class="axis" d="M82 318V84"/><path class="axis" d="M82 318H664"/><text class="s" x="374" y="356" text-anchor="middle">Arithmetic Intensity · FLOPs / Byte</text><text class="s" x="28" y="202" transform="rotate(-90 28 202)" text-anchor="middle">Attainable Throughput</text><path class="roof" d="M118 292L344 118H626"/><path class="dash" d="M344 118V318"/><text class="s" x="344" y="342" text-anchor="middle">Ridge Point</text><rect class="tag" x="104" y="202" width="188" height="42" rx="21"/><text class="tagt" x="198" y="229" text-anchor="middle">Bandwidth Candidate</text><rect class="tag" x="436" y="142" width="184" height="42" rx="21"/><text class="tagt" x="528" y="169" text-anchor="middle">Compute Candidate</text><circle cx="220" cy="246" r="8" fill="#0F172A"/><circle cx="514" cy="118" r="8" fill="#0F172A"/></g>
  <rect class="tag" x="274" y="582" width="732" height="42" rx="21"/><text class="tagt" x="640" y="609" text-anchor="middle">候选约束 = max(T_compute, T_bandwidth) · 之后仍需 Profiling</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Roofline 给出候选上限，真实瓶颈仍需用有效值和 Profiling 验证。</text>
</svg>
