<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-1 GPU 的四类工程约束</title><desc id="fig-desc">以 GPU Inference Workload 为中心，分别连接 Compute Throughput、Memory Capacity、Memory Bandwidth 与 Launch Overhead 四个不同工程问题。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:20px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">GPU MENTAL MODEL · 01</text><text class="t" x="56" y="84">GPU 的四类工程约束</text><text class="sub" x="56" y="114">先问四个不同问题，再决定采集什么证据</text>
  <g transform="translate(478 170)"><rect class="dark" width="324" height="112" rx="24"/><text class="hd" x="162" y="50" text-anchor="middle" fill="#FFFFFF">GPU Inference Workload</text><text class="sd" x="162" y="80" text-anchor="middle" fill="#CBD5E1">Model × Context × Batch × Precision</text></g>
  <path class="flow" d="M530 282L266 356"/><path d="M266 356l-1 -11l10 7z" fill="#334155"/><path class="flow" d="M602 282L506 356"/><path d="M506 356l-4 -10l11 3z" fill="#334155"/><path class="flow" d="M678 282L774 356"/><path d="M774 356l-11 -3l7 -8z" fill="#334155"/><path class="flow" d="M750 282L1014 356"/><path d="M1014 356l-10 -4l8 -7z" fill="#334155"/>
  <g transform="translate(56 362)"><rect class="card" width="252" height="202" rx="20"/><text class="h" x="126" y="48" text-anchor="middle">Compute Throughput</text><text class="s" x="126" y="84" text-anchor="middle">运算能多快完成？</text><rect class="tag" x="56" y="114" width="140" height="38" rx="19"/><text class="tagt" x="126" y="139" text-anchor="middle">FLOPs / TFLOPS</text><text class="s" x="126" y="182" text-anchor="middle">算力预算</text></g>
  <g transform="translate(362 362)"><rect class="card" width="252" height="202" rx="20"/><text class="h" x="126" y="48" text-anchor="middle">Memory Capacity</text><text class="s" x="126" y="84" text-anchor="middle">能否同时放下？</text><rect class="tag" x="76" y="114" width="100" height="38" rx="19"/><text class="tagt" x="126" y="139" text-anchor="middle">GB / GiB</text><text class="s" x="126" y="182" text-anchor="middle">空间预算</text></g>
  <g transform="translate(668 362)"><rect class="card" width="252" height="202" rx="20"/><text class="h" x="126" y="48" text-anchor="middle">Memory Bandwidth</text><text class="s" x="126" y="84" text-anchor="middle">数据能多快搬运？</text><rect class="tag" x="60" y="114" width="132" height="38" rx="19"/><text class="tagt" x="126" y="139" text-anchor="middle">GB/s · TB/s</text><text class="s" x="126" y="182" text-anchor="middle">数据供给预算</text></g>
  <g transform="translate(974 362)"><rect class="card" width="250" height="202" rx="20"/><text class="h" x="125" y="48" text-anchor="middle">Launch Overhead</text><text class="s" x="125" y="84" text-anchor="middle">短任务能否及时提交？</text><rect class="tag" x="66" y="114" width="118" height="38" rx="19"/><text class="tagt" x="125" y="139" text-anchor="middle">μs · ms</text><text class="s" x="125" y="182" text-anchor="middle">固定开销预算</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">四类约束回答四个不同问题，不能用一个利用率数字代替。</text>
</svg>
