<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="appendix-a-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 A-4 显存带宽与数据路径</title><desc id="fig-desc">展示权重与 KV Cache 从 HBM 经 L2 Cache、Shared Memory 或 Register 到计算单元的数据路径，并区分容量与有效带宽。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.6;marker-end:url(#arrow)}.back{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.formula{font-size:18px;font-weight:700}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">MEMORY BANDWIDTH · 04</text><text class="t" x="56" y="84">显存带宽：数据到达计算单元的速度</text><text class="sub" x="56" y="114">放得下只解决容量；搬得快还取决于访问路径、复用和有效带宽</text>
  <g transform="translate(56 208)"><rect class="dark" width="250" height="226" rx="22"/><text class="hd" x="125" y="58" text-anchor="middle" fill="#FFFFFF">HBM</text><text class="sd" x="125" y="94" text-anchor="middle" fill="#CBD5E1">Model Weights</text><text class="sd" x="125" y="124" text-anchor="middle" fill="#CBD5E1">KV Cache</text><text class="sd" x="125" y="154" text-anchor="middle" fill="#CBD5E1">Activations</text><text class="sd" x="125" y="194" text-anchor="middle" fill="#CBD5E1">容量大 · 距离远</text></g>
  <g transform="translate(390 230)"><rect class="card" width="186" height="182" rx="20"/><text class="h" x="93" y="58" text-anchor="middle">L2 Cache</text><text class="s" x="93" y="94" text-anchor="middle">跨 SM 复用</text><text class="s" x="93" y="130" text-anchor="middle">命中可少读 HBM</text></g>
  <g transform="translate(660 230)"><rect class="card" width="230" height="182" rx="20"/><text class="h" x="115" y="54" text-anchor="middle">On-chip Storage</text><text class="s" x="115" y="90" text-anchor="middle">Shared Memory</text><text class="s" x="115" y="120" text-anchor="middle">Registers</text><text class="s" x="115" y="152" text-anchor="middle">容量小 · 距离近</text></g>
  <g transform="translate(974 208)"><rect class="dark" width="250" height="226" rx="22"/><text class="hd" x="125" y="72" text-anchor="middle" fill="#FFFFFF">Compute Units</text><text class="sd" x="125" y="112" text-anchor="middle" fill="#CBD5E1">CUDA Cores</text><text class="sd" x="125" y="142" text-anchor="middle" fill="#CBD5E1">Tensor Cores</text><text class="sd" x="125" y="184" text-anchor="middle" fill="#CBD5E1">消费数据并产生结果</text></g>
  <path class="flow" d="M306 321H384"/><path d="M384 321l-9 -6v12z" fill="#334155"/><path class="flow" d="M576 321H654"/><path d="M654 321l-9 -6v12z" fill="#334155"/><path class="flow" d="M890 321H968"/><path d="M968 321l-9 -6v12z" fill="#334155"/><path class="back" d="M968 370H896"/><path d="M896 370l9 -6v12z" fill="#94A3B8"/><path class="back" d="M654 370H582"/><path d="M582 370l9 -6v12z" fill="#94A3B8"/><path class="back" d="M384 370H312"/><path d="M312 370l9 -6v12z" fill="#94A3B8"/>
  <g transform="translate(294 486)"><rect class="tag" width="692" height="58" rx="29"/><text class="formula" x="346" y="36" text-anchor="middle">T_bandwidth ≥ Bytes moved ÷ Effective bandwidth</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">容量决定放多少，带宽决定数据多快到达计算单元。</text>
</svg>
