  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">BASELINE CONTRACT · 07</text><text class="t" x="56" y="86">Baseline 报告的四块与缺一块的后果</text><text class="sub" x="56" y="116">前三块决定能不能重跑，第四块决定重跑之后能不能重新分析</text>
  <rect class="card" x="72" y="176" width="266" height="206" rx="16"/>
  <text class="mb" x="205" y="214" text-anchor="middle">workload</text>
  <text class="s" x="92" y="252">第 6 章那份描述</text>
  <text class="s" x="92" y="280">含随机种子</text>
  <path class="flow" d="M205 382V416"/>
  <rect class="warnfill" x="72" y="420" width="266" height="128" rx="14"/>
  <text class="b" x="92" y="454">同事卡在哪</text>
  <text class="s" x="92" y="482">缺种子：生成的是另一批请求</text>
  <text class="s" x="92" y="518">长度分布对不上，差异被误读</text>
  <rect class="card" x="360" y="176" width="266" height="206" rx="16"/>
  <text class="mb" x="493" y="214" text-anchor="middle">protocol</text>
  <text class="s" x="380" y="252">Warmup 数量与是否排除</text>
  <text class="s" x="380" y="280">轮次、窗口、在途处理</text>
  <path class="flow" d="M493 382V416"/>
  <rect class="warnfill" x="360" y="420" width="266" height="128" rx="14"/>
  <text class="b" x="380" y="454">同事卡在哪</text>
  <text class="s" x="380" y="482">缺窗口定义：不知道分母怎么算</text>
  <text class="s" x="380" y="518">吞吐差几个百分点，短窗口更大</text>
  <rect class="card" x="648" y="176" width="266" height="206" rx="16"/>
  <text class="mb" x="781" y="214" text-anchor="middle">environment</text>
  <text class="s" x="668" y="252">Python / vLLM 版本</text>
  <text class="s" x="668" y="280">模型名与 revision</text>
  <text class="s" x="668" y="308">GPU、驱动、启动命令</text>
  <path class="flow" d="M781 382V416"/>
  <rect class="warnfill" x="648" y="420" width="266" height="128" rx="14"/>
  <text class="b" x="668" y="454">同事卡在哪</text>
  <text class="s" x="668" y="482">缺 revision：可能拉到另一版权重</text>
  <text class="s" x="668" y="518">整份对比作废</text>
  <rect class="card" x="936" y="176" width="266" height="206" rx="16"/>
  <text class="mb" x="1069" y="214" text-anchor="middle">results</text>
  <text class="s" x="956" y="252">每轮原始记录</text>
  <text class="s" x="956" y="280">统计摘要</text>
  <path class="flow" d="M1069 382V416"/>
  <rect class="warnfill" x="936" y="420" width="266" height="128" rx="14"/>
  <text class="b" x="956" y="454">同事卡在哪</text>
  <text class="s" x="956" y="482">缺原始记录：只能看结论</text>
  <text class="s" x="956" y="518">换分位数算法或分桶都做不到</text>
  <rect class="soft" x="72" y="566" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="596">判断标准只有一句：把这份报告交给一个没参与过实验的同事，他能不能重跑出接近的数字</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">缺任何一块，这份 Baseline 就不该再被引用。</text>
