  <title id="fig-title">图 7-4 Baseline 报告的四块与缺一块的后果</title><desc id="fig-desc">workload、protocol、environment、results 四块各列必填项，每块下方对应“缺了它同事会卡在哪一步”和它带来的后果。</desc>
