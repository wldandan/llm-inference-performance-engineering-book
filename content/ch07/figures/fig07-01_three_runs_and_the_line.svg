</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">DETECTABLE DIFFERENCE · 07</text><text class="t" x="56" y="86">三轮结果与可识别线</text><text class="sub" x="56" y="116">极差是看到的波动，可识别线是由 CV 和轮数推出的判据，两者不是一回事</text>
  <text class="b" x="72" y="186">三轮 TTFT P95</text>
  <path d="M120 250H700" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <circle cx="160" cy="250" r="8" fill="#1D4ED8"/>
  <text class="mb" x="160" y="232" text-anchor="middle">210</text>
  <circle cx="536" cy="250" r="8" fill="#1D4ED8"/>
  <text class="mb" x="536" y="232" text-anchor="middle">235</text>
  <circle cx="280" cy="250" r="8" fill="#1D4ED8"/>
  <text class="mb" x="280" y="232" text-anchor="middle">218</text>
  <path class="bracket" d="M160 272V284"/>
  <path class="bracket" d="M536 272V284"/>
  <path class="bracket" d="M160 284H536"/>
  <text class="s" x="348" y="308" text-anchor="middle">极差 25 ms，均值 221 ms</text>
  <rect class="card" x="72" y="344" width="636" height="190" rx="16"/>
  <text class="s" x="96" y="380">极差带单位，只由两个极端点决定，所以换成不带单位的量</text>
  <text class="b" x="96" y="418">标准差</text>
  <text class="m" x="230" y="418">12.8 ms　除以 n−1</text>
  <text class="b" x="96" y="448">CV</text>
  <text class="m" x="230" y="448">12.8 ÷ 221 ≈ 5.8%</text>
  <text class="b" x="96" y="478">差值波动</text>
  <text class="m" x="230" y="478">CV × √(2/3)，三轮对三轮</text>
  <text class="b" x="96" y="508">可识别线</text>
  <text class="m" x="230" y="508">t × √(2/3) × CV ≈ 2.3 × CV ≈ 13%</text>
  <text class="s" x="96" y="560">除以 n 得 10.4 ms，可识别线随之约 11%，所以口径必须写明</text>
  <text class="b" x="748" y="186">7.8 案例一：两组各跑三轮</text>
  <text class="b" x="748" y="242">基线</text>
  <path d="M860 236H1200" stroke="#CBD5E1" stroke-width="1.4" fill="none"/>
  <circle cx="1030" cy="236" r="5" fill="#334155"/>
  <circle cx="1149" cy="236" r="5" fill="#334155"/>
  <circle cx="1094" cy="236" r="5" fill="#334155"/>
  <path d="M1091 224V248" stroke="#1D4ED8" stroke-width="3" fill="none"/>
  <text class="m" x="1090.775" y="218" text-anchor="middle">均值 224.3</text>
  <text class="b" x="748" y="306">优化后</text>
  <path d="M860 300H1200" stroke="#CBD5E1" stroke-width="1.4" fill="none"/>
  <circle cx="902" cy="300" r="5" fill="#334155"/>
  <circle cx="1106" cy="300" r="5" fill="#334155"/>
  <circle cx="1047" cy="300" r="5" fill="#334155"/>
  <path d="M1019 288V312" stroke="#1D4ED8" stroke-width="3" fill="none"/>
  <text class="m" x="1018.5250000000001" y="282" text-anchor="middle">均值 207.3</text>
  <text class="b" x="748" y="378">差值</text>
  <path d="M860 372H1200" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <rect class="warnfill" x="916.2307692307693" y="360" width="238.0" height="24" rx="4"/>
  <path d="M991 346V398" stroke="#B91C1C" stroke-width="2.4" fill="none"/>
  <text class="mb" x="990.7692307692307" y="418" text-anchor="middle">0</text>
  <circle cx="1035" cy="372" r="6" fill="#1D4ED8"/>
  <text class="m" x="1121.5384615384614" y="418" text-anchor="middle">17 ms ± 45 ms</text>
  <rect class="soft" x="748" y="430" width="460" height="104" rx="14"/>
  <text class="s" x="766" y="460">均值改善 (224.3 − 207.3) ÷ 224.3 ≈ 7.6%</text>
  <text class="s" x="766" y="486">两组合并的可识别线 2.78 × √(2/3) × 20 ms ≈ 45 ms</text>
  <text class="s" x="766" y="512">差值区间跨过 0，结论是分辨不出来</text>
  <text class="s" x="748" y="572">那个 14% 是拿单轮 210 比单轮 180 得来的</text>
  <text class="s" x="748" y="598">而 180 恰好是优化后三轮里最好的一个</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">差值的区间跨过 0，结论是分辨不出来，不是有改善。</text>
</svg>
