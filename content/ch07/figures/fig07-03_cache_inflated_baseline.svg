  <rect class="soft" x="576" y="196" width="40" height="40" rx="6"/>
  <text class="s" x="596" y="222" text-anchor="middle">命中</text>
  <rect class="soft" x="622" y="196" width="40" height="40" rx="6"/>
  <text class="s" x="642" y="222" text-anchor="middle">命中</text>
  <rect class="soft" x="668" y="196" width="40" height="40" rx="6"/>
