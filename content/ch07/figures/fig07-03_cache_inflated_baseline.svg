    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CACHE INFLATED · 07</text><text class="t" x="56" y="86">被缓存抬高的 Baseline</text><text class="sub" x="56" y="116">压测里出现异常漂亮的数字，第一反应应该是怀疑而不是高兴</text>
  <rect class="card" x="72" y="176" width="1136" height="128" rx="16"/>
  <text class="h" x="96" y="214">一千次同一句 prompt</text>
  <text class="s" x="96" y="246">第二个请求开始命中 Prefix Cache</text>
  <rect class="coolfill" x="430" y="196" width="40" height="40" rx="6"/>
  <text class="s" x="450" y="222" text-anchor="middle">算</text>
  <rect class="soft" x="484" y="196" width="40" height="40" rx="6"/>
  <text class="s" x="504" y="222" text-anchor="middle">命中</text>
  <rect class="soft" x="530" y="196" width="40" height="40" rx="6"/>
