  <rect class="coolfill" x="568" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="588" y="370" text-anchor="middle">算</text>
  <rect class="coolfill" x="614" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="634" y="370" text-anchor="middle">算</text>
  <rect class="coolfill" x="660" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="680" y="370" text-anchor="middle">算</text>
  <rect class="coolfill" x="706" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="726" y="370" text-anchor="middle">算</text>
  <text class="s" x="646" y="424" text-anchor="middle">这才是这台机器的 Prefill 能力</text>
  <rect class="goodfill" x="852" y="340" width="332" height="96" rx="14"/>
  <text class="mb" x="876" y="378">TTFT P50 约 180 ms</text>
  <text class="s" x="876" y="410">十五倍的差距</text>
  <text class="b" x="72" y="500">拿 12 ms 当 Baseline 之后会发生什么</text>
  <path class="rule" d="M72 546H820" fill="none"/>
  <text class="s" x="836" y="551">以 12 ms 为基准</text>
  <rect class="soft" x="180" y="552" width="140" height="34" rx="6"/>
  <text class="s" x="250" y="574" text-anchor="middle">优化 A</text>
  <rect class="soft" x="400" y="552" width="140" height="34" rx="6"/>
  <text class="s" x="470" y="574" text-anchor="middle">优化 B</text>
  <rect class="soft" x="620" y="552" width="140" height="34" rx="6"/>
  <text class="s" x="690" y="574" text-anchor="middle">优化 C</text>
  <text class="s" x="72" y="616">任何真实优化都落在这条线下方，全部显得“没有效果”，因为基准已经被抬到了不可能的高度</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">12 ms 测的是缓存能力，不是服务能力。</text>
</svg>
