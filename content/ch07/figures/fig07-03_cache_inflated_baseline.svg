  <rect class="soft" x="714" y="196" width="40" height="40" rx="6"/>
  <text class="s" x="734" y="222" text-anchor="middle">命中</text>
  <text class="s" x="646" y="276" text-anchor="middle">Prefill 几乎不用算</text>
  <rect class="badfill" x="852" y="192" width="332" height="96" rx="14"/>
  <text class="mb" x="876" y="230">TTFT P50 约 12 ms</text>
  <text class="s" x="876" y="262">测的是缓存查找加一次采样</text>
  <rect class="card" x="72" y="324" width="1136" height="128" rx="16"/>
  <text class="h" x="96" y="362">一千句不同 prompt</text>
  <text class="s" x="96" y="394">每一次都要真算</text>
  <rect class="coolfill" x="430" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="450" y="370" text-anchor="middle">算</text>
  <rect class="coolfill" x="476" y="344" width="40" height="40" rx="6"/>
  <text class="s" x="496" y="370" text-anchor="middle">算</text>
  <rect class="coolfill" x="522" y="344" width="40" height="40" rx="6"/>
