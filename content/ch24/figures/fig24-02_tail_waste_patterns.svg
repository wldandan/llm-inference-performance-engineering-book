  <text class="b" x="480" y="620" fill="#1D4ED8">在这批长尾里出现在 1 个任务里</text>
  <rect class="card" x="840" y="512" width="368" height="116" rx="16"/>
  <text class="mb" x="864" y="542" fill="#B91C1C">same_resource</text>
