    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 24 章 · 24.2、24.3</text><text class="t" x="56" y="86">时间是线性的，账单是平方的，达标率是指数的</text><text class="sub" x="56" y="116">没有任何单点优化能抵消这个倍数，所以第一优先级是减少步数</text>
  <rect class="card" x="72" y="176" width="376" height="300" rx="16"/>
  <text class="h" x="96" y="208">时间</text>
  <text class="b" x="96" y="236" fill="#0F766E">按步数线性放大</text>
  <text class="s" x="96" y="460">步数从 5 变 15，任务时间大致三倍</text>
  <rect class="card" x="452" y="176" width="376" height="300" rx="16"/>
  <text class="h" x="476" y="208">累计 token</text>
  <text class="b" x="476" y="236" fill="#B45309">按步数的平方放大</text>
  <text class="s" x="476" y="460">步数翻倍，token 账单变四倍</text>
  <rect class="card" x="832" y="176" width="376" height="300" rx="16"/>
  <text class="h" x="856" y="208">任务级达标率</text>
  <text class="b" x="856" y="236" fill="#B91C1C">按步数指数衰减</text>
  <text class="s" x="856" y="460">单步 95%，15 步只剩 46%</text>
