  <polyline points="880,260 888,267 896,274 905,281 913,287 921,293 929,299 938,305 946,310 954,315 962,319 971,324 979,328 987,332 995,336 1004,339 1012,343 1020,346 1028,349 1036,352 1045,355 1053,358 1061,360 1069,362 1078,365 1086,367 1094,369 1102,371 1111,373 1119,375 1127,376 1135,378 1144,379 1152,381 1160,382" fill="none" stroke="#B91C1C" stroke-width="3"/>
  <path d="M120 252V408H400" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="152.94117647058823" y="430" text-anchor="middle">5</text>
  <text class="s" x="235.2941176470588" y="430" text-anchor="middle">15</text>
  <text class="s" x="400.0" y="430" text-anchor="middle">35</text>
  <text class="s" x="94" y="430">步数</text>
  <path d="M500 252V408H780" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="532.9411764705883" y="430" text-anchor="middle">5</text>
  <text class="s" x="615.2941176470588" y="430" text-anchor="middle">15</text>
  <text class="s" x="780.0" y="430" text-anchor="middle">35</text>
  <text class="s" x="474" y="430">步数</text>
  <path d="M880 252V408H1160" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="912.9411764705883" y="430" text-anchor="middle">5</text>
  <text class="s" x="995.2941176470588" y="430" text-anchor="middle">15</text>
  <text class="s" x="1160.0" y="430" text-anchor="middle">35</text>
  <text class="s" x="854" y="430">步数</text>
  <circle cx="913" cy="287" r="5" fill="#B91C1C"/>
  <text class="b" x="922.9411764705883" y="279.29017375">77%</text>
  <circle cx="938" cy="305" r="5" fill="#B91C1C"/>
  <text class="b" x="947.6470588235294" y="296.5064127189063">66%</text>
  <circle cx="995" cy="336" r="5" fill="#B91C1C"/>
  <text class="b" x="1005.2941176470588" y="327.7265680950785">46%</text>
  <circle cx="1160" cy="382" r="5" fill="#B91C1C"/>
  <text class="b" x="1170.0" y="374.0909920979333">17%</text>
  <rect class="card" x="72" y="496" width="700" height="132" rx="16"/>
  <text class="b" x="96" y="528">24.3 那个 12 步的例子：累计输入不是最后一步的数字</text>
  <text class="s" x="96" y="562">首步 2000，末步 28000，逐步累加 174500 token</text>
  <text class="s" x="96" y="590">梯形式子 步数 × (首步 + 末步) / 2 = 180000，偏高 3.2%</text>
  <text class="bad" x="96" y="616">而把首步乘以步数只得 24000，低估 7.3 倍</text>
  <rect class="warnfill" x="796" y="496" width="412" height="132" rx="16"/>
  <text class="b" x="820" y="528">反过来推更有说服力</text>
  <text class="s" x="820" y="562">要让 15 步任务做到 95%，单步需要 99.66%</text>
  <text class="s" x="820" y="590">而把步数砍到 7 步，同样的单步 95% 就能到 70%</text>
  <text class="b" x="820" y="616">所以第一优先级是减步数，不是让每一步更快</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">单步 95% 达标的系统，八步任务只有三分之二达标，三十五步任务只剩不到两成</text>
</svg>
