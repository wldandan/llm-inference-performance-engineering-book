<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">一步 Decode 的时间构成与实测的差</title><desc id="fig-desc">一条横向堆叠条，按毫秒成比例分成三段：权重搬运 14 ms、kernel 启动 0.5 ms、引擎侧准备 2.5 ms，合计 17 ms。上方括号标出 14 ms 的理论下限，下方括号标出 17 ms 的实测值，比值 1.21。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 15 章 · 15.3、15.6</text><text class="t" x="56" y="86">理论下限 14 ms，实测 17 ms，中间那 3 ms 去哪了</text><text class="sub" x="56" y="116">下限只算权重搬运；差出来的是 kernel 启动加引擎侧准备，两者治法不同</text>
  <rect class="card" x="72" y="176" width="1136" height="244" rx="16"/>
  <text class="b" x="96" y="208">一步 Decode 的时间去哪了（7B、FP16、1000 GB/s）</text>
  <rect class="coolfill" x="120" y="264" width="840.0" height="52" rx="4"/>
  <text class="b" x="540.0" y="292" text-anchor="middle">权重搬运</text>
  <text class="m" x="540.0" y="312" text-anchor="middle">14.0 ms</text>
  <rect class="warnfill" x="960.0" y="264" width="30.0" height="52" rx="4"/>
  <rect class="badfill" x="990.0" y="264" width="150.0" height="52" rx="4"/>
  <text class="b" x="1065.0" y="292" text-anchor="middle">引擎侧准备</text>
  <text class="m" x="1065.0" y="312" text-anchor="middle">2.5 ms</text>
  <path d="M975 316V330" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="969.0" y="340" text-anchor="end">kernel 启动 0.5 ms</text>
  <path d="M120 238V248H960V238" class="bracket"/>
  <text class="b" x="540.0" y="230" text-anchor="middle">理论下限 14 ms（只有权重）</text>
  <path d="M120 384V374H1140V384" class="bracket"/>
  <text class="b" x="630.0" y="406" text-anchor="middle">实测 17 ms</text>
  <text class="cool" x="714.0" y="406">（比值 1.21，带宽受限）</text>
  <rect class="badfill" x="72" y="438" width="552" height="130" rx="14"/>
  <text class="s" x="90" y="468">那 3 ms 是每一步都要付的</text>
  <text class="s" x="90" y="494">3 ms × 500 步 = 1.5 秒，用户等的是这个总和</text>
  <text class="s" x="90" y="520">算每步耗时时看毫秒，算用户等待时看总和</text>
  <text class="s" x="90" y="546">两个视角都要有，但不能互相冒充</text>
  <rect class="warnfill" x="656" y="438" width="552" height="130" rx="14"/>
  <text class="s" x="674" y="468">第 18 章的 CUDA Graph 只治 kernel 启动那 0.5 ms</text>
  <text class="s" x="674" y="494">引擎侧那 2.5 ms 它治不了</text>
  <text class="s" x="674" y="520">比值 1.21 在 1.3 以内，判带宽受限</text>
  <text class="s" x="674" y="546">比值超过 2，先去查这 3 ms 而不是去量化</text>
  <rect class="soft" x="72" y="564" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="594">这张图没画 KV 搬运那一份，因为它随上下文和批量变，不是定值，见图15-4。下限算的是“最好能多快”，不是“会有多快”，所以实测总比它大。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">下限只算权重；差出来的 3 ms 里只有 0.5 ms 是 CUDA Graph 能治的</text>
</svg>
