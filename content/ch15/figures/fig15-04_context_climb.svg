</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 15 章 · 15.7</text><text class="t" x="56" y="86">生成越长，单步越慢，而批量会放大这件事</text><text class="sub" x="56" y="116">权重那一份共用，KV 那一份各自；只有后者随长度和批量一起涨</text>
  <rect class="card" x="72" y="176" width="740" height="380" rx="16"/>
  <path d="M156 214V492H772" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text class="b" x="96" y="202">单步耗时（ms）随已生成长度爬升</text>
  <path class="rule" fill="none" d="M156 448.75555555555553L772 448.75555555555553"/>
  <text class="s" x="766" y="470.75555555555553" text-anchor="end">权重下限 14 ms，不随长度变</text>
  <polyline points="156,449 175,449 194,448 214,448 233,448 252,448 272,448 291,447 310,447 329,447 348,447 368,447 387,446 406,446 426,446 445,446 464,446 483,445 502,445 522,445 541,445 560,445 580,444 599,444 618,444 637,444 656,443 676,443 695,443 714,443 734,443 753,442 772,442" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <text class="b" x="764.0" y="432.27768604444447" text-anchor="end">批量 1</text>
  <polyline points="156,449 175,447 194,446 214,444 233,442 252,441 272,439 291,437 310,436 329,434 348,433 368,431 387,429 406,428 426,426 445,424 464,423 483,421 502,420 522,418 541,416 560,415 580,413 599,412 618,410 637,408 656,407 676,405 695,403 714,402 734,400 753,399 772,397" fill="none" stroke="#0F766E" stroke-width="3"/>
  <text class="b" x="764.0" y="382.93259946666666" text-anchor="end">批量 8</text>
  <polyline points="156,449 175,442 194,436 214,429 233,423 252,416 272,410 291,403 310,397 329,390 348,384 368,377 387,371 406,365 426,358 445,352 464,345 483,339 502,332 522,326 541,319 560,313 580,306 599,300 618,293 637,287 656,280 676,274 695,267 714,261 734,254 753,248 772,241" fill="none" stroke="#B91C1C" stroke-width="3"/>
  <text class="b" x="764.0" y="227.4637312" text-anchor="end">批量 32</text>
  <path d="M156 492V498" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="156.0" y="518" text-anchor="middle">0</text>
  <path d="M310 492V498" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="310.0" y="518" text-anchor="middle">4000</text>
  <path d="M464 492V498" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="464.0" y="518" text-anchor="middle">8000</text>
  <path d="M618 492V498" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="618.0" y="518" text-anchor="middle">12000</text>
  <path d="M772 492V498" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="772.0" y="518" text-anchor="middle">16000</text>
  <text class="s" x="772" y="540" text-anchor="end">已生成长度（token）</text>
  <text class="s" x="144" y="453.75555555555553" text-anchor="end">14</text>
  <text class="s" x="144" y="404.33333333333337" text-anchor="end">30</text>
  <text class="s" x="144" y="342.55555555555554" text-anchor="end">50</text>
  <text class="s" x="144" y="280.77777777777777" text-anchor="end">70</text>
  <text class="s" x="144" y="219.0" text-anchor="end">90</text>
  <circle cx="464" cy="345" r="8" fill="none" stroke="#B91C1C" stroke-width="2.5"/>
  <path d="M464 345L394 299" stroke="#B91C1C" stroke-width="1.6" fill="none"/>
  <text class="bad" x="388.0" y="293.1096433777778" text-anchor="end">批量 32、8000 token</text>
  <text class="bad" x="388.0" y="313.1096433777778" text-anchor="end">KV 31 GiB 已超过权重 13 GiB</text>
  <text class="b" x="96" y="540">批量 1 几乎贴着下限，批量 32 到右端已是下限的近六倍</text>
  <rect class="card" x="836" y="176" width="372" height="380" rx="16"/>
  <text class="b" x="860" y="210">两条曲线，两种机理</text>
  <rect class="goodfill" x="852" y="230" width="340" height="104" rx="14"/>
  <text class="s" x="870" y="260">Prefill 那边：计算量的平方项</text>
  <text class="s" x="870" y="286">输入翻倍，时间涨不到四倍但超过两倍</text>
  <text class="s" x="870" y="312">机理是注意力矩阵的面积</text>
  <rect class="badfill" x="852" y="346" width="340" height="104" rx="14"/>
  <text class="s" x="870" y="376">Decode 这边：KV 读取量的线性增长</text>
  <text class="s" x="870" y="402">而且会被批量放大：32 条各 8000 token</text>
  <text class="s" x="870" y="428">读取量是单条的 32 倍，摊不掉</text>
  <rect class="soft" x="852" y="462" width="340" height="78" rx="14"/>
  <text class="s" x="870" y="492">所以“长上下文让 Decode 变慢”</text>
  <text class="s" x="870" y="518">不是错觉，但和 Prefill 完全不同</text>
  <rect class="soft" x="72" y="572" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="602">权重那一份是每条请求共用的，KV 那一份是每条请求各自的。这一句话同时解释了批量为什么在短上下文下几乎免费、在长上下文下为什么不再免费。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">权重共用、KV 各自：批量 32 到 8000 token 时 KV 读取已超过权重，批量不再免费</text>
</svg>
