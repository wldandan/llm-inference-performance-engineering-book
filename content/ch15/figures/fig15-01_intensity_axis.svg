<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">算术强度数轴上 Prefill 与 Decode 的位置</title><desc id="fig-desc">一根对数刻度的算术强度数轴。A100 的 153 FLOP/byte 分界点把它分成带宽受限与算力受限两段。Decode 批量 1 在 FP16、INT8、INT4 下分别落在 1、2、4，全部在带宽受限那一侧；Prefill 处理 8000 token 时，算上激活读写约 602，在算力受限那一侧。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 15 章 · 15.2</text><text class="t" x="56" y="86">Decode 和 Prefill 在同一根轴的两端</text><text class="sub" x="56" y="116">批量 1 的 Decode 恒等于 1 FLOP/byte，与模型多大无关；卡的分界点在上百</text>
  <rect class="card" x="72" y="176" width="1136" height="248" rx="16"/>
  <path d="M148 300H1140" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text class="b" x="100" y="206">算术强度（FLOP/byte，对数刻度）</text>
  <path d="M431 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="431.4285714285714" y="326" text-anchor="middle">16</text>
  <path d="M573 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="573.1428571428571" y="326" text-anchor="middle">64</text>
  <path d="M715 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="714.8571428571428" y="326" text-anchor="middle">256</text>
  <path d="M857 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="856.5714285714286" y="326" text-anchor="middle">1024</text>
  <path d="M998 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="998.2857142857142" y="326" text-anchor="middle">4096</text>
  <path d="M1140 294V306" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="1140.0" y="326" text-anchor="middle">16384</text>
  <path class="rule" fill="none" d="M662.2377671393651 232L662.2377671393651 288"/>
  <text class="b" x="662.2377671393651" y="226" text-anchor="middle">A100 分界点 153</text>
  <rect x="148" y="276" width="514" height="16" fill="#DBEAFE" stroke="none"/>
  <rect x="662" y="276" width="478" height="16" fill="#D1FAE5" stroke="none"/>
  <text class="cool" x="405.11888356968257" y="266" text-anchor="middle">带宽受限：算力在等数据</text>
  <text class="good" x="901.1188835696826" y="266" text-anchor="middle">算力受限</text>
  <circle cx="148" cy="300" r="6" fill="#1D4ED8"/>
  <circle cx="219" cy="300" r="6" fill="#1D4ED8"/>
  <circle cx="290" cy="300" r="6" fill="#1D4ED8"/>
  <path d="M148 314V328H290V314" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
  <path d="M219 328V342" stroke="#1D4ED8" stroke-width="1.8"/>
  <text class="b" x="142.0" y="364">Decode 批量 1</text>
  <text class="s" x="142.0" y="386">FP16 是 1 · INT8 是 2 · INT4 是 4</text>
  <circle cx="802" cy="300" r="6" fill="#0F766E"/>
  <path d="M802 308V342" stroke="#0F766E" stroke-width="1.8"/>
  <text class="b" x="802.2679085246874" y="364" text-anchor="middle">Prefill 8000 token ≈ 602</text>
  <text class="s" x="802.2679085246874" y="386" text-anchor="middle">算上激活读写，0.5B 模型（第 11.4 节）</text>
  <rect class="coolfill" x="72" y="444" width="552" height="104" rx="14"/>
  <text class="s" x="90" y="474">这个 1 不是巧合，是恒等式</text>
  <text class="s" x="90" y="500">每个参数每 token 约 2 次运算 ÷ 每参数 2 字节 = 1</text>
  <text class="s" x="90" y="526">参数量在分子分母里约掉，所以与模型多大无关</text>
  <rect class="goodfill" x="656" y="444" width="552" height="104" rx="14"/>
  <text class="s" x="674" y="474">量化是把 Decode 往右推，但推不了多远</text>
  <text class="s" x="674" y="500">INT4 之后也才 4，离 153 还差近两个数量级</text>
  <text class="s" x="674" y="526">所以先撑不住的是质量，不是硬件（第 17 章）</text>
  <rect class="soft" x="72" y="564" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="594">Prefill 和 Decode 落在分界点的两侧，相差两到三个数量级。这一根轴就是这两篇分开写的理由：优化方向完全相反。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">批量 1 的 Decode 是 1 FLOP/byte，卡的分界点是 153，差两个数量级，算力在等数据</text>
</svg>
