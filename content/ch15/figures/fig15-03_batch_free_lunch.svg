<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">批量的免费区间与三处边界</title><desc id="fig-desc">左侧两栏共用一根对数刻度的批量横轴，从 1 到 256。批量 1 到 32，上栏吞吐从 71 涨到1982 token/s，下栏单条 TPOT 只从 14.1 ms 涨到 16.1 ms；到批量 256 吞吐八千多，TPOT 也到了 31 ms。批量 153 以下的区域标为绿色，以上标为灰色，表示估算模型在那里失效。右侧列出让免费停止的三处边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 15 章 · 15.4</text><text class="t" x="56" y="86">批量是 Decode 唯一的免费午餐，但免费有边界</text><text class="sub" x="56" y="116">权重只读一遍却服务 B 个 token，所以吞吐涨而单条 TPOT 几乎不变</text>
  <rect class="card" x="72" y="176" width="680" height="396" rx="16"/>
  <text class="b" x="96" y="200">吞吐（token/s）</text>
  <rect x="152" y="206" width="497" height="140" fill="#ECFDF5" stroke="none"/>
  <rect x="649" y="206" width="51" height="140" fill="#F1F5F9" stroke="none"/>
  <path d="M152 206V346H700" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <polyline points="152,345 220,344 289,341 358,337 426,329 494,314 563,289 632,254 700,212" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <text class="m" x="502.5" y="317.7392314546384">1982</text>
  <text class="m" x="160" y="338">71</text>
  <text class="b" x="96" y="374">单条请求的 TPOT（ms）</text>
  <rect x="152" y="380" width="497" height="120" fill="#ECFDF5" stroke="none"/>
  <rect x="649" y="380" width="51" height="120" fill="#F1F5F9" stroke="none"/>
  <path d="M152 380V500H700" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <polyline points="152,453 220,453 289,452 358,452 426,450 494,446 563,439 632,425 700,396" fill="none" stroke="#0F766E" stroke-width="3"/>
  <text class="m" x="160" y="445.10963712">14.1</text>
  <text class="m" x="490.5" y="438.17505450666664">16.1</text>
  <path class="rule" fill="none" d="M649.1310672244467 192L649.1310672244467 506"/>
  <text class="b" x="649.1310672244467" y="186" text-anchor="middle">交叉批量 153</text>
  <text class="s" x="152.0" y="522" text-anchor="middle">1</text>
  <text class="s" x="357.5" y="522" text-anchor="middle">8</text>
  <text class="s" x="494.5" y="522" text-anchor="middle">32</text>
  <text class="s" x="631.5" y="522" text-anchor="middle">128</text>
  <text class="s" x="700.0" y="522" text-anchor="middle">256</text>
  <text class="s" x="96" y="522">批量</text>
  <text class="b" x="96" y="548">批量 1 → 32：吞吐涨 28 倍，单条 TPOT 只从 14.1 涨到 16.1 ms</text>
  <rect class="card" x="776" y="176" width="432" height="396" rx="16"/>
  <text class="b" x="800" y="210">免费到哪里为止：三处边界</text>
  <rect x="800" y="236" width="384" height="88" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
  <text class="b" x="818" y="264">一 KV 显存装不下</text>
  <text class="s" x="818" y="288">每条请求各存一份 KV，批量越大占越多</text>
  <text class="m" x="818" y="310">第 16 章</text>
  <rect x="800" y="336" width="384" height="88" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="b" x="818" y="364">二 滑向算力受限</text>
  <text class="s" x="818" y="388">算术强度 ≈ 批量，越过 153 就真的变慢</text>
  <text class="m" x="818" y="410">15.4</text>
  <rect x="800" y="436" width="384" height="88" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
  <text class="b" x="818" y="464">三 Attention 不摊薄</text>
  <text class="s" x="818" y="488">KV 是各自的，读取量随批量线性涨</text>
  <text class="m" x="818" y="510">15.7</text>
  <text class="s" x="800" y="552">灰色那段是估算模型自己失效的地方：它只算搬运，不算算力</text>
  <rect class="goodfill" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">两栏共用一根横轴，不叠成双纵轴：两者量纲不同，叠在一起会诱导一个没有意义的比较。要看的只有一件事，就是上面那条涨得很陡而下面那条几乎不动。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">带宽受限区间内加批量近乎免费；越过交叉批量 153 之后，再加就真的变慢</text>
</svg>
