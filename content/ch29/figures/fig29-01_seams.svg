<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">九项全绿，评审仍然不通过</title><desc id="fig-desc">左栏是九项上线检查清单，SLO、Baseline、容量核算、门禁、监控、流量治理、冷启动、回滚预案、责任人，九项全部打勾。右栏是五处接缝的核对结果：门禁批量对生产批量、Baseline 框架版本对镜像版本、容量模型的峰值与下限卡数对扩缩容的实例数区间、SLO 阈值对门禁绝对阈值，四处一致；容量模型的上下文长度 12000 对当前 prompt 模板的实际长度 16000，这一处不一致，原因是新版本把检索片段从 Top-5 加到 Top-8，并发上限折算为原来的 75%，容量模型算出的 8 张卡实际要 11 张。底部写明结论是不通过。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 29 章 · 29.1、29.8</text><text class="t" x="56" y="86">评审的价值不在重审每一份材料，在交叉检查那些接缝</text><text class="sub" x="56" y="116">九项清单一项不缺，唯一的问题是两份材料里的上下文长度对不上</text>
  <rect class="goodfill" x="56" y="158" width="460" height="416" rx="16"/>
  <text class="h" x="80" y="190">九项清单</text>
  <text class="b" x="492" y="190" text-anchor="end" fill="#0F766E">全绿</text>
  <text class="b" x="80" y="236" fill="#0F766E">✓</text>
  <text class="s" x="106" y="236">SLO 定义清楚且可测</text>
  <text class="b" x="80" y="274" fill="#0F766E">✓</text>
  <text class="s" x="106" y="274">性能证据是在待发布的那套环境上量的</text>
  <text class="b" x="80" y="312" fill="#0F766E">✓</text>
  <text class="s" x="106" y="312">容量核算过，且和实际配置一致</text>
  <text class="b" x="80" y="350" fill="#0F766E">✓</text>
  <text class="s" x="106" y="350">门禁通过，或有记录在案的豁免</text>
  <text class="b" x="80" y="388" fill="#0F766E">✓</text>
  <text class="s" x="106" y="388">监控就绪</text>
  <text class="b" x="80" y="426" fill="#0F766E">✓</text>
  <text class="s" x="106" y="426">流量治理配置齐全</text>
  <text class="b" x="80" y="464" fill="#0F766E">✓</text>
  <text class="s" x="106" y="464">冷启动时间已知</text>
  <text class="b" x="80" y="502" fill="#0F766E">✓</text>
  <text class="s" x="106" y="502">回滚预案明确且演练过</text>
  <text class="b" x="80" y="540" fill="#0F766E">✓</text>
  <text class="s" x="106" y="540">有人对结果负责</text>
  <rect class="card" x="540" y="158" width="684" height="416" rx="16"/>
  <text class="h" x="564" y="190">五处接缝</text>
  <text class="b" x="1200" y="190" text-anchor="end" fill="#B91C1C">一处对不上</text>
  <rect x="556" y="218" width="652" height="126" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text class="b" x="576" y="248">容量模型的上下文长度</text>
  <text class="s" x="860" y="248" text-anchor="middle">对</text>
  <text class="b" x="896" y="248">当前 prompt 模板的实际长度</text>
  <text class="b" x="1192" y="248" text-anchor="end" fill="#B91C1C">不一致</text>
  <path d="M572 266H1192" class="divider"/>
  <text class="mb" x="576" y="294" fill="#B91C1C">12000 对 16000</text>
  <text class="s" x="760" y="294">新版本把检索片段从 Top-5 加到了 Top-8</text>
  <text class="b" x="576" y="324" fill="#B91C1C">并发上限折算为原来的 75%，8 张卡实际要 11 张</text>
  <rect x="556" y="352" width="652" height="48" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text class="b" x="576" y="382">门禁运行时的批量</text>
  <text class="s" x="860" y="382" text-anchor="middle">对</text>
  <text class="b" x="896" y="382">生产配置的批量</text>
  <text class="b" x="1192" y="382" text-anchor="end" fill="#0F766E">一致</text>
  <rect x="556" y="408" width="652" height="48" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text class="b" x="576" y="438">性能证据的框架版本</text>
  <text class="s" x="860" y="438" text-anchor="middle">对</text>
  <text class="b" x="896" y="438">待发布镜像的框架版本</text>
  <text class="b" x="1192" y="438" text-anchor="end" fill="#0F766E">一致</text>
  <rect x="556" y="464" width="652" height="48" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text class="b" x="576" y="494">容量模型的峰值与下限卡数</text>
  <text class="s" x="860" y="494" text-anchor="middle">对</text>
  <text class="b" x="896" y="494">扩缩容配置的实例数区间</text>
  <text class="b" x="1192" y="494" text-anchor="end" fill="#0F766E">一致</text>
  <rect x="556" y="520" width="652" height="48" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text class="b" x="576" y="550">SLO 阈值</text>
  <text class="s" x="860" y="550" text-anchor="middle">对</text>
  <text class="b" x="896" y="550">门禁绝对阈值</text>
  <text class="b" x="1192" y="550" text-anchor="end" fill="#0F766E">一致</text>
  <rect class="badfill" x="56" y="588" width="1168" height="52" rx="14"/>
  <text class="s" x="74" y="618">结论是不通过。每一份材料单看都没错，而没有任何一个单独的角色会去比这五对数：性能工程师看性能证据，运维看容量，开发看变更说明，接缝处正好是所有人的盲区。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">接缝对不上要换算成卡数：不然它看着像格式问题，其实是容量问题</text>
</svg>
