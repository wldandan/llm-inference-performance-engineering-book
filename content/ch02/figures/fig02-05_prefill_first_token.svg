<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 2-5 Prefill 与首 token 的边界</title><desc id="fig-desc">区分服务端从 scheduled 到 first token generated 的 Prefill 区间，以及协议组装和网络传输后客户端收到 first chunk 的时刻。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.lane{font-size:14px;font-weight:750;letter-spacing:1px;fill:#475569}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.h{font-size:17px;font-weight:750}.hl{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.bracket{fill:none;stroke:#64748B;stroke-width:2}.formula{font-size:15px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">OBSERVATION BOUNDARY · 05</text><text class="t" x="56" y="84">Prefill 结束，不等于客户端已经收到首包</text><text class="sub" x="56" y="114">服务端生成首 token 后，还要经过响应编码、缓冲和网络传输</text>
  <text class="lane" x="56" y="182">SERVER</text>
  <g transform="translate(56 224)"><rect class="node" width="166" height="116" rx="16"/><text class="h" x="83" y="46" text-anchor="middle">scheduled</text><text class="s" x="83" y="76" text-anchor="middle">t2</text></g><path class="flow" d="M222 282H274"/><path d="M274 282l-10 -6v12z" fill="#334155"/>
  <g transform="translate(280 224)"><rect class="node" width="190" height="116" rx="16"/><text class="h" x="95" y="42" text-anchor="middle">Prompt Compute</text><text class="s" x="95" y="72" text-anchor="middle">Transformer Forward</text></g><path class="flow" d="M470 282H522"/><path d="M522 282l-10 -6v12z" fill="#334155"/>
  <g transform="translate(528 224)"><rect class="node" width="166" height="116" rx="16"/><text class="h" x="83" y="42" text-anchor="middle">KV Cache</text><text class="s" x="83" y="72" text-anchor="middle">created</text></g><path class="flow" d="M694 282H746"/><path d="M746 282l-10 -6v12z" fill="#334155"/>
  <g transform="translate(752 224)"><rect class="node" width="150" height="116" rx="16"/><text class="h" x="75" y="58" text-anchor="middle">Sampling</text></g><path class="flow" d="M902 282H954"/><path d="M954 282l-10 -6v12z" fill="#334155"/>
  <g transform="translate(960 212)"><rect class="focus" width="264" height="140" rx="18"/><text class="hl" x="132" y="50" text-anchor="middle" fill="#FFFFFF">First Token Generated</text><text class="sl" x="132" y="82" text-anchor="middle" fill="#CBD5E1">first_token · t3</text><text class="sl" x="132" y="112" text-anchor="middle" fill="#CBD5E1">服务端观测点</text></g>
  <path class="bracket" d="M139 380V412H1092V380"/><text class="formula" x="615" y="444" text-anchor="middle">Scheduled-to-First-Token：scheduled → first_token（含 Prefill、logits 与采样）</text>
  <path class="network" d="M1092 352V488H954"/><path d="M954 488l11 -7v14z" fill="#64748B"/><text class="formula" x="1098" y="430">protocol + network</text>
  <text class="lane" x="56" y="520">CLIENT</text><g transform="translate(690 466)"><rect class="node" width="264" height="110" rx="18"/><text class="h" x="132" y="44" text-anchor="middle">First Chunk Received</text><text class="s" x="132" y="74" text-anchor="middle">客户端首包到达</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">首 token 已生成，不代表客户端已经收到首包。</text>
</svg>
