<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 2-7 服务端事件与客户端观测</title><desc id="fig-desc">在服务端时钟和客户端时钟两条独立时间线上区分首 token、首 chunk 发送和首 chunk 接收，并用 Request ID 对齐。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.clock{fill:#0F172A}.ct{font-size:17px;font-weight:750;fill:#FFFFFF}.cs{font-size:14px;fill:#CBD5E1}.node{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3}.h{font-size:17px;font-weight:750}.s{font-size:14px;fill:#64748B}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.trace{fill:#E2E8F0}.tt{font-size:14px;font-weight:700;fill:#475569}.warning{font-size:15px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TWO CLOCKS · 07</text><text class="t" x="56" y="84">服务端事件与客户端观测不能直接混算</text><text class="sub" x="56" y="114">生成、发送和接收是三个观测点；同名指标也必须核对时钟与采集位置</text>
  <g transform="translate(56 174)"><rect class="lane" width="1168" height="168" rx="20"/><rect class="clock" width="190" height="168" rx="20"/><path d="M170 0H190V168H170Z" fill="#0F172A"/><text class="ct" x="24" y="66" fill="#FFFFFF">Server Clock</text><text class="cs" x="24" y="96" fill="#CBD5E1">服务端单调时钟</text><path class="line" d="M224 84H1108"/><path d="M1108 84l-11 -7v14z" fill="#334155"/><g transform="translate(320 38)"><rect class="node" width="228" height="92" rx="14"/><text class="h" x="114" y="38" text-anchor="middle">First Token Generated</text><text class="s" x="114" y="66" text-anchor="middle">模型完成首 token</text></g><g transform="translate(710 38)"><rect class="node" width="228" height="92" rx="14"/><text class="h" x="114" y="38" text-anchor="middle">First Chunk Sent</text><text class="s" x="114" y="66" text-anchor="middle">Gateway 写出首包</text></g></g>
  <g transform="translate(56 402)"><rect class="lane" width="1168" height="168" rx="20"/><rect class="clock" width="190" height="168" rx="20"/><path d="M170 0H190V168H170Z" fill="#0F172A"/><text class="ct" x="24" y="66" fill="#FFFFFF">Client Clock</text><text class="cs" x="24" y="96" fill="#CBD5E1">客户端单调时钟</text><path class="line" d="M224 84H1108"/><path d="M1108 84l-11 -7v14z" fill="#334155"/><g transform="translate(246 38)"><rect class="node" width="214" height="92" rx="14"/><text class="h" x="107" y="38" text-anchor="middle">Request Sent</text><text class="s" x="107" y="66" text-anchor="middle">客户端发出请求</text></g><g transform="translate(824 38)"><rect class="node" width="250" height="92" rx="14"/><text class="h" x="125" y="38" text-anchor="middle">First Chunk Received</text><text class="s" x="125" y="66" text-anchor="middle">客户端看到首包</text></g></g>
  <path class="network" d="M880 304C880 356 954 356 1005 440"/><path d="M1005 440l-10 -6v12z" fill="#64748B"/><text class="s" x="952" y="372" text-anchor="middle">network + buffering</text>
  <rect class="trace" x="492" y="354" width="282" height="38" rx="19"/><text class="tt" x="633" y="378" text-anchor="middle">Request ID 对齐同一条推理请求的事件</text><text class="warning" x="56" y="612">不要用不同机器的墙上时钟直接相减来制造伪精确延迟。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">指标名相同，不代表时钟、采集位置和计算边界相同。</text>
</svg>
