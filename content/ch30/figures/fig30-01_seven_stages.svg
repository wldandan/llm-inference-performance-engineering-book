<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">七个阶段，以及为什么这个顺序不能打乱</title><desc id="fig-desc">左栏是七个阶段的阶梯，依次是：跑起来并说清楚（Ch0 到 Ch5）、把负载和基准立住（Ch6 到 Ch7）、让系统可观测（Ch8 到 Ch10）、Prefill 与上下文（Ch11 到 Ch14）、Decode 与显存（Ch15 到 Ch19）、服务与链路（Ch20 到 Ch25）、容量门禁与评审（Ch26 到 Ch29），每一阶段下面写着它的验收判据。右上一块列出三条依赖：没有 workload 就没有 Baseline，没有 Baseline 就没有门禁，没有容量模型就没有成本讨论。右下一块把第 0 章那三条规律对应到验收判据上：规律一写比读贵，落在阶段四、五，看 Prefill 算术强度和 TPOT 实测与搬运下限之比；规律二批量摊薄搬运、满载拉长等待，落在阶段五、六、七，看 Goodput 峰值批量、负载率与放大、余量；规律三只有有用的产出才算数，落在阶段六、七与报告，看过载后 goodput 是否平稳、成本是否按有用产出算、质量是否是否决项。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 30 章 · 30.1、30.2</text><text class="t" x="56" y="86">七个阶段，以及为什么这个顺序不能打乱</text><text class="sub" x="56" y="116">后面每个阶段都依赖前面的产出，而第 0 章那三条是判据的来源</text>
  <rect class="card" x="56" y="158" width="620" height="416" rx="16"/>
  <text class="b" x="80" y="190">七个阶段，后面每一个都依赖前面的产出</text>
  <circle cx="98" cy="234" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="240" text-anchor="middle">一</text>
  <text class="b" x="124" y="230">跑起来并说清楚　Ch0–Ch5</text>
  <text class="s" x="124" y="254">能说出每个阶段的时间戳来自哪里</text>
  <path d="M98 251V265" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="284" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="290" text-anchor="middle">二</text>
  <text class="b" x="124" y="280">把负载和基准立住　Ch6–Ch7</text>
  <text class="s" x="124" y="304">同事拿着这两份文件能重跑出同一批请求</text>
  <path d="M98 301V315" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="334" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="340" text-anchor="middle">三</text>
  <text class="b" x="124" y="330">让系统可观测　Ch8–Ch10</text>
  <text class="s" x="124" y="354">随便指一条慢请求，能说出它慢在哪一段</text>
  <path d="M98 351V365" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="384" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="390" text-anchor="middle">四</text>
  <text class="b" x="124" y="380">Prefill 与上下文　Ch11–Ch14</text>
  <text class="s" x="124" y="404">报告里有“不可分辨”这类结论的空间</text>
  <path d="M98 401V415" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="434" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="440" text-anchor="middle">五</text>
  <text class="b" x="124" y="430">Decode 与显存　Ch15–Ch19</text>
  <text class="s" x="124" y="454">每个收益数字都标注了对应的批量</text>
  <path d="M98 451V465" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="484" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="490" text-anchor="middle">六</text>
  <text class="b" x="124" y="480">服务与链路　Ch20–Ch25</text>
  <text class="s" x="124" y="504">过载演练的 goodput 在超容量后保持平稳</text>
  <path d="M98 501V515" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="98" cy="534" r="15" fill="#64748B" opacity="0.18"/>
  <text class="b" x="98" y="540" text-anchor="middle">七</text>
  <text class="b" x="124" y="530">容量、门禁与评审　Ch26–Ch29</text>
  <text class="s" x="124" y="554">门禁能真的拦住一次人为制造的回归</text>
  <rect class="warnfill" x="700" y="158" width="524" height="136" rx="16"/>
  <text class="h" x="724" y="190">顺序不能大幅打乱</text>
  <text class="s" x="724" y="220">没有 workload 就没有 Baseline</text>
  <text class="s" x="724" y="244">没有 Baseline 就没有门禁</text>
  <text class="s" x="724" y="268">没有容量模型就没有成本讨论</text>
  <rect class="card" x="700" y="310" width="524" height="264" rx="16"/>
  <text class="h" x="724" y="342">第 0 章那三条规律落在哪里</text>
  <text class="s" x="724" y="368">它们是后面各阶段验收判据的来源，不是开场白</text>
  <text class="b" x="724" y="408" fill="#1D4ED8">规律一</text>
  <text class="b" x="788" y="408">写比读贵</text>
  <text class="s" x="788" y="432">阶段四、五　Prefill 算术强度，TPOT 实测与搬运下限之比</text>
  <text class="b" x="724" y="468" fill="#B45309">规律二</text>
  <text class="b" x="788" y="468">批量摊薄搬运，满载拉长等待</text>
  <text class="s" x="788" y="492">阶段五、六、七　Goodput 峰值批量，负载率与放大，余量</text>
  <text class="b" x="724" y="528" fill="#0F766E">规律三</text>
  <text class="b" x="788" y="528">只有有用的产出才算数</text>
  <text class="s" x="788" y="552">阶段六、七与报告　goodput 平稳，成本按有用产出，质量否决</text>
  <rect class="soft" x="56" y="588" width="1168" height="52" rx="14"/>
  <text class="s" x="74" y="618">五项交付物里最容易被低估的是“可解释”：前二十九章那些错误，绝大多数的根源都是某个数字的含义没说清。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">顺序打乱的代价不是返工，是前面那一步没有可用的验收判据</text>
</svg>
