<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter04-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 4-5 推理服务的三类状态</title>
  <desc id="fig-desc">请求状态、执行状态和资源状态各有自己能拿来做决定的那一份，并共同驱动调度决策与资源清理。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.title{font-size:32px;font-weight:750}.subtitle{font-size:16px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.band{fill:#0F172A}.index{font-size:14px;font-weight:750;fill:#CBD5E1;letter-spacing:1px}.state{font-size:21px;font-weight:750;fill:#FFFFFF}.state-cn{font-size:14px;fill:#CBD5E1}
      .label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}.value{font-size:16px;font-weight:650}.pill{fill:#F1F5F9}.pill-text{font-size:14px;font-weight:700;fill:#475569}
      .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.hub{fill:#0F172A;stroke:#0F172A;stroke-width:2}.hub-title{font-size:20px;font-weight:750;fill:#FFFFFF}.hub-note{font-size:14px;fill:#CBD5E1}
      .take-bg{fill:#0F172A}.take-label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.take{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="kicker" x="56" y="46">STATE OWNERSHIP · 05</text>
  <text class="title" x="56" y="84">一次推理决策，同时依赖三类状态</text>
  <text class="subtitle" x="56" y="114">可以有很多缓存副本，但每一种状态都必须有清晰的权威拥有者</text>

  <g transform="translate(64 166)">
    <rect class="card" width="352" height="302" rx="18"/><path class="band" d="M18 0H334Q352 0 352 18V92H0V18Q0 0 18 0Z"/>
    <text class="index" x="24" y="28" fill="#CBD5E1">STATE 01</text><text class="state" x="24" y="60" fill="#FFFFFF">Request State</text><text class="state-cn" x="24" y="82" fill="#CBD5E1">请求从哪里来、现在到哪一步</text>
    <text class="label" x="24" y="128">内容</text><text class="value" x="24" y="157">Prompt、Params、Trace</text><text class="value" x="24" y="183">Progress、Cancel、Terminal</text>
    <rect class="pill" x="24" y="222" width="304" height="48" rx="12"/><text class="pill-text" x="42" y="252">权威拥有者：Gateway / Engine</text>
  </g>
  <g transform="translate(464 166)">
    <rect class="card" width="352" height="302" rx="18"/><path class="band" d="M18 0H334Q352 0 352 18V92H0V18Q0 0 18 0Z"/>
    <text class="index" x="24" y="28" fill="#CBD5E1">STATE 02</text><text class="state" x="24" y="60" fill="#FFFFFF">Execution State</text><text class="state-cn" x="24" y="82" fill="#CBD5E1">模型正在如何执行</text>
    <text class="label" x="24" y="128">内容</text><text class="value" x="24" y="157">Batch、Model、Sampling</text><text class="value" x="24" y="183">Runtime、Communication</text>
    <rect class="pill" x="24" y="222" width="304" height="48" rx="12"/><text class="pill-text" x="42" y="252">权威拥有者：Scheduler / Worker / Runtime</text>
  </g>
  <g transform="translate(864 166)">
    <rect class="card" width="352" height="302" rx="18"/><path class="band" d="M18 0H334Q352 0 352 18V92H0V18Q0 0 18 0Z"/>
    <text class="index" x="24" y="28" fill="#CBD5E1">STATE 03</text><text class="state" x="24" y="60" fill="#FFFFFF">Resource State</text><text class="state-cn" x="24" y="82" fill="#CBD5E1">还有多少资源可以使用</text>
    <text class="label" x="24" y="128">内容</text><text class="value" x="24" y="157">Queue、KV Blocks、Device</text><text class="value" x="24" y="183">Slots、Worker Health</text>
    <rect class="pill" x="24" y="222" width="304" height="48" rx="12"/><text class="pill-text" x="42" y="252">权威拥有者：Admission / Scheduler / Worker</text>
  </g>

  <path class="flow" d="M240 468C240 500 390 508 500 526"/><path d="M500 526l-7 -12h14z" fill="#334155"/>
  <path class="flow" d="M640 468V526"/><path d="M640 526l-7 -12h14z" fill="#334155"/>
  <path class="flow" d="M1040 468C1040 500 890 508 780 526"/><path d="M780 526l-7 -12h14z" fill="#334155"/>
  <rect class="hub" x="472" y="526" width="336" height="82" rx="18"/><text class="hub-title" x="640" y="560" text-anchor="middle" fill="#FFFFFF">Decision + Cleanup</text><text class="hub-note" x="640" y="586" text-anchor="middle" fill="#CBD5E1">决策、回收和异常处理必须读取一致状态</text>

  <rect class="take-bg" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="take-label" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="take" x="184" y="676" fill="#FFFFFF">每一份状态都要说得出哪个组件的那份能拿来做决定，其余只是缓存或观测副本。</text>
</svg>
