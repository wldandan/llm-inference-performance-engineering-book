<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter04-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 4-8 从现象到组件和观测点</title>
  <desc id="fig-desc">把模糊的性能现象依次映射到责任组件、交接边界和最小证据，最后才进入指标与工具选择。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.title{font-size:32px;font-weight:750}.subtitle{font-size:16px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.later{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:8 6}.num{fill:#0F172A}.num-text{font-size:14px;font-weight:750;fill:#FFFFFF}.stage{font-size:20px;font-weight:750}.stage-en{font-size:14px;font-weight:700;fill:#64748B;letter-spacing:1px}.example{font-size:16px;font-weight:650}.hint{font-size:14px;fill:#64748B}
      .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.event{fill:#E2E8F0}.event-text{font-size:14px;font-weight:700;fill:#475569}.trace{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.2}.trace-title{font-size:14px;font-weight:750;fill:#475569}.trace-value{font-size:14px;fill:#64748B}
      .take-bg{fill:#0F172A}.take-label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.take{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="kicker" x="56" y="46">DIAGNOSTIC PATH · 08</text>
  <text class="title" x="56" y="84">从模糊现象，走到可检查的组件边界</text>
  <text class="subtitle" x="56" y="114">架构图先回答“去哪里找证据”，指标和工具才不会变成盲查</text>

  <g transform="translate(56 190)">
    <rect class="card" width="250" height="300" rx="18"/><circle class="num" cx="34" cy="34" r="18"/><text class="num-text" x="34" y="39" text-anchor="middle" fill="#FFFFFF">01</text>
    <text class="stage" x="64" y="39">观察现象</text><text class="stage-en" x="24" y="82">SYMPTOM</text>
    <text class="example" x="24" y="122">请求超时</text><text class="hint" x="24" y="146">Timeout</text>
    <text class="example" x="24" y="186">路由到错误副本</text><text class="hint" x="24" y="210">Wrong Replica</text>
    <text class="example" x="24" y="250">取消后仍占资源</text><text class="hint" x="24" y="274">Cancel Leak</text>
  </g>
  <g transform="translate(356 190)">
    <rect class="card" width="250" height="300" rx="18"/><circle class="num" cx="34" cy="34" r="18"/><text class="num-text" x="34" y="39" text-anchor="middle" fill="#FFFFFF">02</text>
    <text class="stage" x="64" y="39">定位责任</text><text class="stage-en" x="24" y="82">COMPONENT OWNER</text>
    <text class="example" x="24" y="128">Router</text><text class="hint" x="24" y="153">目标选择是否正确？</text>
    <text class="example" x="24" y="198">Admission</text><text class="hint" x="24" y="223">请求是否进入队列？</text>
    <text class="example" x="24" y="268">Scheduler / Worker</text><text class="hint" x="24" y="293">是否形成并执行计划？</text>
  </g>
  <g transform="translate(656 190)">
    <rect class="card" width="250" height="300" rx="18"/><circle class="num" cx="34" cy="34" r="18"/><text class="num-text" x="34" y="39" text-anchor="middle" fill="#FFFFFF">03</text>
    <text class="stage" x="64" y="39">检查交接</text><text class="stage-en" x="24" y="82">MINIMAL EVIDENCE</text>
    <text class="example" x="24" y="128">同一 Request ID</text><text class="hint" x="24" y="153">贯穿入口与内部组件</text>
    <text class="example" x="24" y="198">Target / Decision</text><text class="hint" x="24" y="223">记录目标和准入结果</text>
    <text class="example" x="24" y="268">Dispatch Event</text><text class="hint" x="24" y="293">确认计划是否下发</text>
  </g>
  <g transform="translate(956 190)">
    <rect class="later" width="268" height="300" rx="18"/><circle class="num" cx="34" cy="34" r="18"/><text class="num-text" x="34" y="39" text-anchor="middle" fill="#FFFFFF">04</text>
    <text class="stage" x="64" y="39">进入后续分析</text><text class="stage-en" x="24" y="82">LATER CHAPTERS</text>
    <text class="example" x="24" y="132">Metrics</text><text class="hint" x="24" y="157">定义延迟与吞吐口径</text>
    <text class="example" x="24" y="207">Benchmark</text><text class="hint" x="24" y="232">稳定复现问题</text>
    <text class="example" x="24" y="282">Profiling / Optimization</text>
  </g>

  <path class="flow" d="M306 340H350"/><path d="M350 340l-10 -6v12z" fill="#334155"/><path class="flow" d="M606 340H650"/><path d="M650 340l-10 -6v12z" fill="#334155"/><path class="flow" d="M906 340H950"/><path d="M950 340l-10 -6v12z" fill="#334155"/>
  <rect class="event" x="314" y="316" width="34" height="24" rx="12"/><text class="event-text" x="331" y="333" text-anchor="middle">谁</text>
  <rect class="event" x="614" y="316" width="34" height="24" rx="12"/><text class="event-text" x="631" y="333" text-anchor="middle">何处</text>
  <rect class="event" x="900" y="316" width="62" height="24" rx="12"/><text class="event-text" x="931" y="333" text-anchor="middle">如何量化</text>

  <rect class="trace" x="238" y="530" width="804" height="64" rx="14"/><text class="trace-title" x="266" y="557">最小可追踪链</text><text class="trace-value" x="390" y="557">request_received → target_selected → queued → scheduled → first_token</text><text class="trace-value" x="266" y="580">Chapter 4 到组件和交接证据为止；指标公式、Benchmark 与 Profiling 在后续章节展开。</text>

  <rect class="take-bg" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="take-label" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="take" x="184" y="676" fill="#FFFFFF">先定位组件与交接，再选择日志、指标和工具。</text>
</svg>
