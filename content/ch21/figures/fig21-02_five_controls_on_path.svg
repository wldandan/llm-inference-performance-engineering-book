<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">五项治理在请求路径上的位置和三条约束</title><desc id="fig-desc">上半部分是一条请求从上游经过网关入口、Waiting 队列，到 GPU 上 Running 的路径。准入挂在入口，超时覆盖排队和生成的每一段，取消在 GPU 上释放 KV，重试和背压都在上游：两条虚线弧从服务端绕回上游，一条是失败或 429，一条是余量信号。下半部分三块写出它们之间的约束：超时不配取消、超时配上不加约束的重试、准入和背压用错对象。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 21 章 · 21.1 至 21.6</text><text class="t" x="56" y="86">五项治理挂在一条请求路径的不同位置</text><text class="sub" x="56" y="116">单独调好任何一项都不够，它们之间有三条约束</text>
  <rect class="soft" x="72" y="150" width="236" height="320" rx="14"/>
  <text class="b" x="90" y="176">上游</text>
  <rect class="soft" x="324" y="150" width="884" height="320" rx="14"/>
  <text class="b" x="342" y="176">服务端</text>
  <rect class="card" x="96" y="248" width="200" height="60" rx="14"/>
  <text class="h" x="196.0" y="285" text-anchor="middle">客户端 / 编排层</text>
  <rect class="card" x="360" y="248" width="200" height="60" rx="14"/>
  <text class="h" x="460.0" y="285" text-anchor="middle">网关入口</text>
  <rect class="card" x="624" y="248" width="200" height="60" rx="14"/>
  <text class="h" x="724.0" y="285" text-anchor="middle">Waiting 队列</text>
  <rect class="dark" x="888" y="248" width="296" height="60" rx="14"/>
  <text class="hw" x="1036.0" y="285" text-anchor="middle">Running：在 GPU 上生成</text>
  <path class="flow" d="M296 278.0H356"/>
  <path class="flow" d="M560 278.0H620"/>
  <path class="flow" d="M824 278.0H884"/>
  <path class="feedback" d="M1036 248Q596.0 112.0 156 248"/>
  <text class="s" x="600" y="216" text-anchor="middle">余量信号：服务端把还剩多少告诉上游</text>
  <path class="feedback" d="M452 248Q344.0 188.0 236 248"/>
  <text class="s" x="374" y="242" text-anchor="middle">失败或 429</text>
  <rect class="badfill" x="96" y="324" width="200" height="64" rx="12"/>
  <text class="b" x="112" y="351">④ 重试</text>
  <text class="s" x="112" y="375">把失败变成新的到达</text>
  <rect class="soft" x="96" y="396" width="200" height="64" rx="12"/>
  <text class="b" x="112" y="423">⑤ 背压</text>
  <text class="s" x="112" y="447">按余量信号自己降速</text>
  <rect class="goodfill" x="360" y="324" width="200" height="64" rx="12"/>
  <text class="b" x="376" y="351">① 准入</text>
  <text class="s" x="376" y="375">没余量就当场 429</text>
  <rect class="coolfill" x="624" y="324" width="560" height="64" rx="12"/>
  <text class="b" x="640" y="351">② 超时</text>
  <text class="s" x="640" y="375">排队、首包、流间隔，每段等待各有上限（细分见图 21-3）</text>
  <rect class="warnfill" x="888" y="396" width="296" height="64" rx="12"/>
  <text class="b" x="904" y="423">③ 取消</text>
  <text class="s" x="904" y="447">断开信号传到引擎，KV 立即释放</text>
  <rect class="warnfill" x="72" y="486" width="360" height="142" rx="14"/>
  <text class="s" x="92" y="514">② 超时 + ③ 取消</text>
  <text class="h" x="92" y="546">超时不配取消</text>
  <text class="s" x="92" y="580">请求在客户端那边已经放弃了</text>
  <text class="s" x="92" y="608">GPU 还在替它算，KV 也不释放</text>
  <rect class="badfill" x="460" y="486" width="360" height="142" rx="14"/>
  <text class="s" x="480" y="514">② 超时 + ④ 重试</text>
  <text class="h" x="480" y="546">超时配上不加约束的重试</text>
  <text class="s" x="480" y="580">每次超时都变成一次新的到达</text>
  <text class="s" x="480" y="608">到达按 1 + p + p² + … 放大</text>
  <rect class="coolfill" x="848" y="486" width="360" height="142" rx="14"/>
  <text class="s" x="868" y="514">① 准入 和 ⑤ 背压</text>
  <text class="h" x="868" y="546">用错对象</text>
  <text class="s" x="868" y="580">准入拒绝一部分，背压让所有请求慢一点</text>
  <text class="s" x="868" y="608">对能降速的上游硬拒，会触发它的重试</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">超时要配取消，重试要有纪律，准入和背压要认清对象</text>
</svg>
