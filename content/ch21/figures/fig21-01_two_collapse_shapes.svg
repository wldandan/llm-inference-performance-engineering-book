<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">过载时的两种垮法：部分拒绝与全员失败</title><desc id="fig-desc">一张折线图，横轴是施加的请求速率从 6 到 36 QPS，纵轴是 Goodput。竖虚线标出 12 QPS 的容量。绿色曲线是有准入的那一版，过容量之后一直保持在 11 QPS 上下；红色曲线是没有准入的那一版，过容量后一路掉到 2.1。右侧两块分别说明这两种形状对应 21.1 里的 B 和 A。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 21 章 · 21.1、21.8</text><text class="t" x="56" y="86">容量总有被超过的一天，问题是超过之后什么样</text><text class="sub" x="56" y="116">A 把“一部分用户失败”变成了“所有用户失败”，而且失败得很慢</text>
  <rect class="card" x="72" y="176" width="1136" height="372" rx="16"/>
  <text class="b" x="96" y="208">同一份负载、同一个容量，只差有没有准入（合成演练）</text>
  <path d="M216 250V466H700" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="204" y="285.8571428571429" text-anchor="end">12</text>
  <text class="s" x="204" y="378.42857142857144" text-anchor="end">6</text>
  <text class="b" x="120" y="240">Goodput（QPS）</text>
  <path class="rule" fill="none" d="M312.8 250L312.8 466"/>
  <text class="s" x="320.8" y="268">容量 12 QPS</text>
  <polyline points="216,374 313,293 410,290 506,292 700,295" fill="none" stroke="#0F766E" stroke-width="3.2"/>
  <circle cx="216" cy="374" r="5" fill="#0F766E"/>
  <circle cx="313" cy="293" r="5" fill="#0F766E"/>
  <circle cx="410" cy="290" r="5" fill="#0F766E"/>
  <circle cx="506" cy="292" r="5" fill="#0F766E"/>
  <circle cx="700" cy="295" r="5" fill="#0F766E"/>
  <text class="b" x="704.0" y="278.74285714285713" text-anchor="end">有准入 11.1</text>
  <polyline points="216,374 313,289 410,307 506,333 700,434" fill="none" stroke="#B91C1C" stroke-width="3.2"/>
  <circle cx="216" cy="374" r="5" fill="#B91C1C"/>
  <circle cx="313" cy="289" r="5" fill="#B91C1C"/>
  <circle cx="410" cy="307" r="5" fill="#B91C1C"/>
  <circle cx="506" cy="333" r="5" fill="#B91C1C"/>
  <circle cx="700" cy="434" r="5" fill="#B91C1C"/>
  <text class="b" x="704.0" y="457.6" text-anchor="end">没有准入 2.1</text>
  <text class="s" x="216.0" y="492" text-anchor="middle">6</text>
  <text class="s" x="312.8" y="492" text-anchor="middle">12</text>
  <text class="s" x="409.6" y="492" text-anchor="middle">18</text>
  <text class="s" x="506.4" y="492" text-anchor="middle">24</text>
  <text class="s" x="700.0" y="492" text-anchor="middle">36</text>
  <text class="s" x="112" y="492">施加的 QPS</text>
  <text class="b" x="120" y="518">末档 36 QPS：有准入保住峰值的 97.4%，没有准入只剩 18.3%</text>
  <rect class="goodfill" x="744" y="240" width="440" height="120" rx="14"/>
  <text class="h" x="766" y="272">B  部分拒绝</text>
  <text class="s" x="766" y="302">超出容量的请求立即被拒</text>
  <text class="s" x="766" y="328">被接受的请求延迟正常，末档拒掉 24.7 QPS</text>
  <rect class="badfill" x="744" y="380" width="440" height="140" rx="14"/>
  <text class="h" x="766" y="412">A  全部接受</text>
  <text class="s" x="766" y="442">队列越堆越长，延迟一起劣化</text>
  <text class="s" x="766" y="468">最终全员超时，一个都没成功</text>
  <text class="s" x="766" y="494">而且失败得很慢，用户要等到超时才知道</text>
  <rect class="soft" x="72" y="564" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="594">数据出自 content/ch21/evidence/ 那两份合成演练，不是真机结果。要看的是两条曲线在过容量之后分道扬镳这件事，不是这几个具体数字。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">健康的形状是过容量后 Goodput 保持平稳、多余流量被拒，不是一起掉下去</text>
</svg>
