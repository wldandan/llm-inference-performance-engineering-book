<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">重试把 4% 的失败推成 73%</title><desc id="fig-desc">左边是一张四行的表，第 0 轮失败率 4%、放大系数 1.04，第 1 轮 15%、1.18，第 2 轮 40%、1.62，第 3 轮 73%、2.65，行的底色从绿到红。右边是一个四节点的环：系统过载、请求超时、客户端重试、负载上升，一条虚线从最后一个节点绕回第一个，标注“p 不是常数，它是负载的函数”。底部说明终点的 73% 与案例里 71% 的可用性是同一个数的两种表现。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 21 章 · 21.5、21.9</text><text class="t" x="56" y="86">雪崩不是某个组件坏了，是这个回路自己跑起来了</text><text class="sub" x="56" y="116">放大系数 1 + p + … + p^r，而 p 每一轮都被上一轮推上去</text>
  <rect class="card" x="72" y="176" width="700" height="372" rx="16"/>
  <text class="b" x="96" y="208">三次重试，四轮把 4% 推成 73%</text>
  <text class="b" x="120" y="246">轮次</text>
  <text class="b" x="270" y="246">这一轮的 p</text>
  <text class="b" x="440" y="246">放大 1+p+p²+p³</text>
  <text class="b" x="620" y="246">下一轮的负载</text>
  <path d="M120 258H740" class="divider"/>
  <rect x="104" y="264" width="656" height="46" rx="10" fill="#0F766E" opacity="0.07"/>
  <text class="b" x="120" y="294">第 0 轮</text>
  <text class="b" x="270" y="294" fill="#0F766E">4%</text>
  <text class="m" x="440" y="294">1.04</text>
  <text class="m" x="620" y="294">1.04 倍</text>
  <rect x="104" y="320" width="656" height="46" rx="10" fill="#B45309" opacity="0.07"/>
  <text class="b" x="120" y="350">第 1 轮</text>
  <text class="b" x="270" y="350" fill="#B45309">15%</text>
  <text class="m" x="440" y="350">1.18</text>
  <text class="m" x="620" y="350">1.18 倍</text>
  <rect x="104" y="376" width="656" height="46" rx="10" fill="#B45309" opacity="0.07"/>
  <text class="b" x="120" y="406">第 2 轮</text>
  <text class="b" x="270" y="406" fill="#B45309">40%</text>
  <text class="m" x="440" y="406">1.62</text>
  <text class="m" x="620" y="406">1.62 倍</text>
  <rect x="104" y="432" width="656" height="46" rx="10" fill="#B91C1C" opacity="0.07"/>
  <text class="b" x="120" y="462">第 3 轮</text>
  <text class="b" x="270" y="462" fill="#B91C1C">73%</text>
  <text class="m" x="440" y="462">2.65</text>
  <text class="m" x="620" y="462">2.65 倍</text>
  <text class="b" x="96" y="516">没有任何一轮是负载翻了三倍，是四轮叠出来的</text>
  <rect class="card" x="796" y="176" width="412" height="372" rx="16"/>
  <text class="b" x="820" y="208">回路是这样转起来的</text>
  <rect class="warnfill" x="836" y="236" width="250" height="52" rx="12"/>
  <text class="b" x="854" y="268">系统过载</text>
  <rect class="warnfill" x="836" y="306" width="250" height="52" rx="12"/>
  <text class="b" x="854" y="338">请求超时</text>
  <rect class="badfill" x="836" y="376" width="250" height="52" rx="12"/>
  <text class="b" x="854" y="408">客户端重试</text>
  <rect class="badfill" x="836" y="446" width="250" height="52" rx="12"/>
  <text class="b" x="854" y="478">负载上升，p 更高</text>
  <path class="flow" d="M961 288V302"/>
  <path class="flow" d="M961 358V372"/>
  <path class="flow" d="M961 428V442"/>
  <path class="feedback" d="M1086 472Q1156 472 1156 262Q1156 236 1110 236"/>
  <text class="good" x="820" y="530">p 不是常数，它是负载的函数</text>
  <rect class="badfill" x="72" y="564" width="1136" height="64" rx="14"/>
  <text class="b" x="96" y="600">终点那个 73% 和开头那个 99.5% 掉到 71% 对得上：一条请求最多试 4 次，0.73 的 4 次方是 28.4%，可用性 71.6%</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">第 0 轮那 4% 的额外流量看起来完全无害，而它正是把 p 从 4% 推到 15% 的那一下</text>
</svg>
