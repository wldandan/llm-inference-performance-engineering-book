<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">LLM 服务需要分层的超时，不是一个总超时</title><desc id="fig-desc">上方是一条请求的时间线，分成排队、Prefill、逐个吐 token 三段。下方四条横杠分别覆盖时间线的不同区间：排队超时只覆盖排队段，首包超时覆盖到第一个 token，流间隔超时覆盖生成段，总超时覆盖全程。每条横杠旁写明它超了意味着什么。下方两块分别说明为什么不能照搬普通服务的做法，以及流间隔超时的阈值怎么定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 21 章 · 21.3</text><text class="t" x="56" y="86">四个超时各管一段，各自对应一个原因</text><text class="sub" x="56" y="116">总超时只能告诉你“慢”，不能告诉你慢在哪</text>
  <rect class="card" x="72" y="176" width="1136" height="340" rx="16"/>
  <text class="b" x="96" y="208">一条请求的时间线，和管着它的四个超时</text>
  <rect class="soft" x="176" y="240" width="111.36" height="56" rx="12"/>
  <text class="b" x="192" y="274">排队</text>
  <rect class="coolfill" x="287.36" y="240" width="97.44000000000001" height="56" rx="12"/>
  <text class="b" x="303.36" y="274">Prefill</text>
  <rect class="goodfill" x="384.8" y="240" width="487.2" height="56" rx="12"/>
  <text class="b" x="400.8" y="274">生成第 1 个 token 之后逐个吐</text>
  <text class="s" x="176" y="322">到达</text>
  <text class="s" x="287.36" y="322">进 Running</text>
  <text class="s" x="384.79999999999995" y="322">第 1 个 token</text>
  <text class="s" x="872" y="322" text-anchor="end">结束</text>
  <rect x="176" y="344" width="111" height="18" rx="6" fill="#1D4ED8" opacity="0.30"/>
  <path d="M176 340V366" stroke="#1D4ED8" stroke-width="2.4"/>
  <path d="M287 340V366" stroke="#1D4ED8" stroke-width="2.4"/>
  <text class="b" x="96" y="359">排队超时</text>
  <text class="s" x="896" y="359">超了说明系统过载，该拒绝</text>
  <rect x="287" y="380" width="97" height="18" rx="6" fill="#0F766E" opacity="0.30"/>
  <path d="M287 376V402" stroke="#0F766E" stroke-width="2.4"/>
  <path d="M385 376V402" stroke="#0F766E" stroke-width="2.4"/>
  <text class="b" x="96" y="395">首包超时</text>
  <text class="s" x="896" y="395">超了说明 Prefill 异常</text>
  <rect x="385" y="416" width="487" height="18" rx="6" fill="#B45309" opacity="0.30"/>
  <path d="M385 412V438" stroke="#B45309" stroke-width="2.4"/>
  <path d="M872 412V438" stroke="#B45309" stroke-width="2.4"/>
  <text class="b" x="96" y="431">流间隔超时</text>
  <text class="s" x="896" y="431">超了说明卡住或被抢占</text>
  <rect x="176" y="452" width="696" height="18" rx="6" fill="#94A3B8" opacity="0.30"/>
  <path d="M176 448V474" stroke="#94A3B8" stroke-width="2.4"/>
  <path d="M872 448V474" stroke="#94A3B8" stroke-width="2.4"/>
  <text class="b" x="96" y="467">总超时</text>
  <text class="s" x="896" y="467">兜底，设得很宽松</text>
  <text class="b" x="96" y="502">前三个才是真正有用的：各自能定位到一个原因，而总超时只能告诉你“慢”</text>
  <rect class="warnfill" x="72" y="524" width="552" height="104" rx="14"/>
  <text class="b" x="92" y="556">为什么不能照搬普通 HTTP 服务那一套</text>
  <text class="s" x="92" y="584">生成 50 个和 2000 个 token，耗时差四十倍</text>
  <text class="s" x="92" y="610">一个固定的总超时要么砍长请求，要么对短请求形同虚设</text>
  <rect class="coolfill" x="656" y="524" width="552" height="104" rx="14"/>
  <text class="b" x="676" y="556">流间隔超时的阈值参考抢占的恢复时间</text>
  <text class="s" x="676" y="584">第 16 章说过抢占后要重算 Prefill，可能是几秒</text>
  <text class="s" x="676" y="610">阈值设得比它短，会把正常恢复中的请求误杀</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">排队超时对应准入，首包超时对应 Prefill 异常，流间隔超时对应抢占；前三个才真正有用</text>
</svg>
