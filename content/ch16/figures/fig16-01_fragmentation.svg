  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 16 章 · 16.4</text><text class="t" x="56" y="86">分页不是消灭浪费，是把没有上界的浪费换成有上界的</text><text class="sub" x="56" y="116">外部碎片是空闲总量够但没有一块连续的；内部碎片是分出去的块没被用满</text>
  <rect class="card" x="72" y="176" width="552" height="372" rx="16"/>
  <text class="b" x="96" y="210">连续分配：外部碎片</text>
  <text class="s" x="96" y="234">每条请求要一整块连续空间</text>
  <rect class="soft" x="96" y="262" width="504" height="46" rx="6"/>
  <rect x="96" y="262" width="120" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 4"/>
