  <rect x="216" y="262" width="96" height="46" rx="6" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.6"/>
  <text class="b" x="264.0" y="292" text-anchor="middle" fill="#FFFFFF">C 运行中</text>
  <rect x="312" y="262" width="108" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="s" x="366.0" y="291" text-anchor="middle">空洞</text>
  <rect x="420" y="262" width="84" height="46" rx="6" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/>
  <text class="b" x="462.0" y="292" text-anchor="middle" fill="#FFFFFF">D 运行中</text>
  <rect x="504" y="262" width="96" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="s" x="552.0" y="291" text-anchor="middle">空洞</text>
  <text class="s" x="96" y="336">三个空洞分别是 1.2、1.1、0.9 GiB，合计 3.2 GiB</text>
  <rect x="96" y="354" width="176" height="34" rx="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text class="bad" x="184" y="377" text-anchor="middle">新请求要连续的 2 GiB</text>
  <text class="b" x="286" y="377">总剩余够，却放不进任何一个空洞</text>
  <rect class="badfill" x="88" y="404" width="520" height="104" rx="14"/>
  <text class="s" x="106" y="434">浪费没有上界：碎片有多碎，取决于请求的到达与结束顺序</text>
  <text class="s" x="106" y="460">早期实现还要按 max_tokens 预留，浪费率常超过 60%</text>
  <text class="s" x="106" y="486">16.9 案例一就是这样查了两天：剩 8 GiB，最大的一块只有 1.2 GiB</text>
  <rect class="card" x="656" y="176" width="552" height="372" rx="16"/>
  <text class="b" x="680" y="210">分页分配：内部碎片</text>
  <text class="s" x="680" y="234">切成固定大小的块，块本身不要求连续</text>
