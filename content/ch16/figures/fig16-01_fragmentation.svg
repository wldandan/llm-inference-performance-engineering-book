  <rect x="714" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="748" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="782" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="816" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="850" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="884" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="918" y="310" width="30" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text class="s" x="680" y="354">深色那一小段是每条请求最后一块里没用满的部分</text>
  <text class="b" x="680" y="380">任何一个空闲块都能给任何请求用</text>
  <rect x="680" y="394" width="176" height="34" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
  <text class="good" x="768" y="417" text-anchor="middle">同一个新请求</text>
  <text class="b" x="870" y="417">凑够 16 个空闲块就能开始，不必连续</text>
  <rect class="goodfill" x="672" y="442" width="520" height="104" rx="14"/>
  <text class="s" x="690" y="472">浪费有上界：块大小 16 时最多 15 个 token 的空间，平均半块</text>
  <text class="s" x="690" y="498">128 条并发、块大小 16 约浪费 128 MiB；块大小 128 约浪费 1 GiB</text>
  <text class="s" x="690" y="524">所以块大小不是越大越省事，它直接换走一部分并发上限</text>
  <rect class="soft" x="72" y="564" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="594">分块分配做的其实是一次交换：用内部碎片换掉外部碎片。这笔交换划得来，因为内部碎片有上界而外部碎片没有。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">用内部碎片换外部碎片：前者有上界，后者没有，所以这笔交换划得来</text>
</svg>
