<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">容量表的九步：80 GiB 怎么变成 130 条</title><desc id="fig-desc">上半部分是一个四级瀑布：80 GiB 的显存先按 gpu_memory_utilization 0.9 折成 72 GiB，减去 14 GiB 权重得到 58 GiB，再减去 6 GiB 激活值与框架开销得到 52 GiB。下半部分是五步除法：每 token 128 KiB、总容量 425984 token、平均长度 2300、理论并发 185 条、打折后 130 到 148 条。右侧标出第 1、3、7、9 四步为什么只能按自己的服务取值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 16 章 · 16.6</text><text class="t" x="56" y="86">80 GiB 怎么一步步变成 130 条</text><text class="sub" x="56" y="116">先按 utilization 折算，再减两项，后五步是除法；四步要按自己的服务取值</text>
  <rect class="card" x="72" y="176" width="700" height="396" rx="16"/>
  <text class="b" x="96" y="204">前四步：先按 utilization 折算，再减两项</text>
  <rect x="120" y="218" width="560" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect class="soft" x="120" y="218" width="560.0" height="34" rx="6"/>
  <text class="b" x="132" y="241">显存总量</text>
  <text class="s" x="668.0" y="241" text-anchor="end">80 GiB</text>
  <rect x="120" y="260" width="560" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect class="goodfill" x="120" y="260" width="504.0" height="34" rx="6"/>
  <text class="b" x="132" y="283">× gpu_memory_utilization 0.9</text>
  <text class="s" x="612.0" y="283" text-anchor="end">72 GiB</text>
  <rect x="120" y="302" width="560" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect class="coolfill" x="120" y="302" width="406.0" height="34" rx="6"/>
  <text class="b" x="132" y="325">减权重</text>
  <text class="s" x="514.0" y="325" text-anchor="end">58 GiB</text>
  <text class="s" x="670" y="325" text-anchor="end">扣掉 14 GiB</text>
  <rect x="120" y="344" width="560" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect class="warnfill" x="120" y="344" width="364.0" height="34" rx="6"/>
  <text class="b" x="132" y="367">减激活值与框架开销</text>
  <text class="s" x="472.0" y="367" text-anchor="end">52 GiB</text>
  <text class="s" x="670" y="367" text-anchor="end">扣掉 6 GiB</text>
  <text class="b" x="120" y="402">剩给 KV Cache 的 52 GiB，后五步是除法</text>
  <text class="b" x="120" y="434">每 token KV</text>
  <text class="mb" x="300" y="434">128 KiB</text>
  <text class="s" x="440" y="434">2 × 32 层 × 8 头 × 128 × 2 字节</text>
  <text class="b" x="120" y="464">总 token 容量</text>
  <text class="mb" x="300" y="464">425984</text>
  <text class="s" x="440" y="464">52 GiB ÷ 128 KiB</text>
  <text class="b" x="120" y="494">按平均总长切分</text>
  <text class="mb" x="300" y="494">2300 token</text>
  <text class="s" x="440" y="494">prompt 2000 + 输出 300</text>
  <text class="b" x="120" y="524">理论并发</text>
  <text class="mb" x="300" y="524">185 条</text>
  <text class="s" x="440" y="524">425984 ÷ 2300</text>
  <text class="b" x="120" y="554">打折后的起点</text>
  <text class="mb" x="300" y="554">130~148 条</text>
  <text class="s" x="440" y="554">按 70%~80% 取</text>
  <rect class="card" x="796" y="176" width="412" height="396" rx="16"/>
  <text class="b" x="820" y="206">四步只能按自己的服务取值</text>
  <rect class="badfill" x="812" y="222" width="380" height="78" rx="14"/>
  <text class="s" x="830" y="252">第 1 步 gpu_memory_utilization 默认 0.9</text>
  <text class="s" x="830" y="278">按整张卡起算，KV 预算要高估 8 GiB</text>
  <rect class="warnfill" x="812" y="310" width="380" height="78" rx="14"/>
  <text class="s" x="830" y="340">第 3 步 激活值与框架开销要实测</text>
  <text class="s" x="830" y="366">读启动日志，用预算减权重减 KV 池反推</text>
  <rect class="coolfill" x="812" y="398" width="380" height="78" rx="14"/>
  <text class="s" x="830" y="428">第 7 步 用平均而不是 P99</text>
  <text class="s" x="830" y="454">平均值默认了混合比例稳定（见图16-3）</text>
  <rect class="goodfill" x="812" y="486" width="380" height="78" rx="14"/>
  <text class="s" x="830" y="516">第 9 步 折扣是给波动留的余量</text>
  <text class="s" x="830" y="542">长度尾部、到达突发、抢占恢复都要余量</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">这张表的用途不是精确预测，是给容量规划一个起点：它告诉你该在 130 附近做压测，而不是从 8 开始一档一档试到 300。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">这张表给的是压测起点，不是预测；第 1 步和第 3 步取错了，后面全错</text>
</svg>
