  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 16 章 · 16.7、16.9</text><text class="t" x="56" y="86">上下文在分母上，所以并发和它成反比</text><text class="sub" x="56" y="116">同样的流量，上下文翻倍就要两倍的卡；而按平均长度算出来的那个数还不是上限</text>
  <rect class="card" x="72" y="176" width="720" height="372" rx="16"/>
  <path d="M156 214V486H740" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text class="b" x="96" y="202">理论并发随平均总长度成反比下降</text>
  <polyline points="194,258 197,277 201,293 204,306 208,319 211,329 214,338 218,346 221,354 225,361 228,367 232,372 235,377 238,382 242,385 245,390 249,394 252,396 256,400 259,403 262,406 266,408 269,410 273,413 276,415 280,416 283,419 287,420 290,422 293,423 297,426 300,427 304,428 307,429 311,430 314,432 317,433 321,434 324,435 328,436 331,438 335,439 338,439 342,440 345,441 348,441 352,442 355,443 359,443 362,445 366,446 369,446 372,447 376,447 379,448 383,448 386,449 390,449 393,451 396,451 400,452 403,452 407,452 410,453 414,453 417,453 421,454 424,454 427,455 431,455 434,455 438,456 441,456 445,456 448,456 451,458 455,458 458,458 462,459 465,459 469,459 472,459 475,460 479,460 482,460 486,460 489,461 493,461 496,461 500,461 503,461 506,462 510,462 513,462 517,462 520,462 524,464 527,464 530,464 534,464 537,464 541,464 544,465 548,465 551,465 554,465 558,465 561,465 565,466 568,466 572,466 575,466 579,466 582,466 585,466 589,467 592,467 596,467 599,467 603,467 606,467 609,467 613,467 616,468 620,468 623,468 627,468 630,468 634,468 637,468 640,468 644,469 647,469 651,469 654,469 658,469 661,469 664,469 668,469 671,469 675,469 678,469 682,471 685,471 688,471 692,471 695,471 699,471 702,471 706,471 709,471 713,471 716,471 719,472 723,472 726,472 730,472 733,472 737,472 740,472" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <circle cx="196" cy="267" r="6" fill="#1D4ED8"/>
  <text class="b" x="215.50588235294117" y="291.2173913043478">185 条</text>
  <text class="s" x="215.50588235294117" y="311.2173913043478">基准</text>
  <circle cx="235" cy="377" r="6" fill="#1D4ED8"/>
  <text class="b" x="255.01176470588234" y="359.2">92 条</text>
  <text class="s" x="255.01176470588234" y="379.2">减半</text>
  <circle cx="314" cy="432" r="6" fill="#1D4ED8"/>
  <text class="b" x="334.0235294117647" y="413.6">46 条</text>
  <text class="s" x="334.0235294117647" y="433.6">四分之一</text>
  <circle cx="706" cy="471" r="6" fill="#1D4ED8"/>
  <text class="b" x="691.6470588235294" y="424.62608695652176" text-anchor="end">13 条</text>
  <text class="s" x="691.6470588235294" y="444.62608695652176" text-anchor="end">十四分之一</text>
  <path d="M196 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="195.50588235294117" y="512" text-anchor="middle">2300</text>
  <path d="M235 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="235.01176470588234" y="512" text-anchor="middle">4600</text>
  <path d="M314 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="314.0235294117647" y="512" text-anchor="middle">9200</text>
  <path d="M431 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="430.8235294117647" y="512" text-anchor="middle">16000</text>
  <path d="M568 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="568.2352941176471" y="512" text-anchor="middle">24000</text>
  <path d="M706 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="705.6470588235294" y="512" text-anchor="middle">32000</text>
  <text class="s" x="740" y="534" text-anchor="end">平均总长度（token）</text>
  <text class="s" x="144" y="431.8695652173913" text-anchor="end">50</text>
  <text class="s" x="144" y="372.7391304347826" text-anchor="end">100</text>
  <text class="s" x="144" y="313.6086956521739" text-anchor="end">150</text>
  <text class="s" x="144" y="254.47826086956522" text-anchor="end">200</text>
  <text class="b" x="96" y="534">上下文翻倍，并发减半，因为它在分母上</text>
  <rect class="card" x="816" y="176" width="392" height="372" rx="16"/>
  <text class="b" x="840" y="210">平均值不是上限</text>
  <rect class="coolfill" x="832" y="230" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="260">97% 的请求 2300 token</text>
  <text class="s" x="850" y="286">3% 的请求 32000 token</text>
  <text class="s" x="850" y="312">混合平均 3191 token  →  133 条</text>
  <rect class="badfill" x="832" y="344" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="374">全是长请求时  →  13 条</text>
  <text class="s" x="850" y="400">一批长请求就能把整张卡占满</text>
  <text class="s" x="850" y="426">排队的大多是那 97% 的短请求</text>
  <rect class="soft" x="832" y="458" width="344" height="78" rx="14"/>
  <text class="s" x="850" y="488">所以上限由最坏情况下的混合决定</text>
  <text class="s" x="850" y="514">不是由平均长度决定</text>
  <rect class="soft" x="72" y="564" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="594">上下文长度是一个三重成本：TTFT 变长、token 账单变多、并发上限下降。前两个是每次调用的成本，第三个是基础设施的成本，而第三个往往最贵。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">并发上限不是由平均长度决定的，是由最坏情况下的混合决定的</text>
</svg>
