  <text class="s" x="160" y="558">刚好够是 31.7 张；故障、升级、预测误差三项约要加 25% 到 30%</text>
  <rect class="card" x="824" y="158" width="400" height="248" rx="16"/>
  <text class="h" x="848" y="190">排队那一项看怎么派发（单位 S）</text>
  <text class="b" x="848" y="222">卡数</text>
  <text class="b" x="920" y="222">钉在副本上</text>
  <text class="b" x="1072" y="222">按负载派发</text>
  <text class="m" x="848" y="256">36 张</text>
  <text class="mb" x="920" y="256" fill="#B45309">7.5</text>
  <text class="mb" x="1072" y="256" fill="#0F766E">0.085</text>
