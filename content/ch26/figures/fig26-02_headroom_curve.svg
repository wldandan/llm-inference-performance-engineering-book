<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">余量买的是什么</title><desc id="fig-desc">左边是一条曲线，横轴卡数从 29 到 45 张，纵轴是一分钟三倍突发的消化时间。刚好够是 31.7 张，36 张时负载率 0.88、约 13.7 分钟消化完；42 张时 0.76、约 5.2 分钟；45 张时 0.70、约 3.8 分钟；48 张时 0.66、约 2.9 分钟。右上一张小表对比排队：36、42、48 张时，请求钉在副本上的单副本上界分别是 7.4、3.1、1.9 个 S，全部卡按负载派发的 Erlang C 只有 0.083、0.005、0.0003 个 S。右下一块写明这张图只给量级，不承诺毫秒数。</desc>
