  <text class="mb" x="920" y="316" fill="#B45309">1.9</text>
  <text class="mb" x="1072" y="316" fill="#0F766E">0.000</text>
  <text class="s" x="848" y="350">左列是单副本上界（M/M/1），</text>
  <text class="s" x="848" y="376">右列是全部卡按负载派发（Erlang C）</text>
  <rect class="warnfill" x="824" y="422" width="400" height="152" rx="16"/>
  <text class="h" x="848" y="454">这张图只给量级</text>
  <text class="s" x="848" y="484">真实部署落在两列之间；单卡里还有几十个</text>
  <text class="s" x="848" y="510">槽位，比左列更平缓。</text>
  <text class="b" x="848" y="548" fill="#B45309">用它定档位，不要用它承诺毫秒数</text>
  <rect class="soft" x="56" y="588" width="1168" height="52" rx="14"/>
  <text class="s" x="74" y="618">按负载派发时平均排队几乎为零，余量主要买的是故障、升级、预测误差和突发；请求被前缀亲和钉在副本上时，排队才回到左列那么陡。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">余量买的是出事时少难受一截：故障、升级、预测误差、突发；按负载派发时排队很便宜</text>
