<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">从日活到卡数，中间那一步不能省</title><desc id="fig-desc">左栏是六级阶梯：日活五十万乘每人 3.2 次对话得到每天一百六十万次，除以 86400 得到每秒 18.5 次对话，乘峰均比 3 得到 55.6，再乘每次对话 2.4 次模型调用得到每秒 133 次调用，乘平均输出长度 220 得到每秒 29333 个输出 token；最后一级回到每秒 133 次调用，乘平均请求时长 4.2 秒得到在途 560 条。右上一块讲不能省的那一步：第 16 章给的单卡并发 130 条是在总长度 2300 token 下测的，本例负载 2820 token，折算后是 106 条。右中一块把约束并排：只看静态吞吐是 18.6 张，补上 Prefill 占时后单卡输出从 1560 降到 924 token/s，变成 31.7 张；按显存并发只要 5.3 张。吞吐先满，刚好够 32 张，加 30% 余量 42 张。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 26 章 · 26.2、26.3</text><text class="t" x="56" y="86">搬数字的时候，要把产生它的条件一起搬</text><text class="sub" x="56" y="116">130 条是在 2300 token 下测的，本例 2820 token，折算后是 106 条</text>
  <rect class="card" x="56" y="158" width="620" height="416" rx="16"/>
  <text class="b" x="80" y="190">26.2 那条链（合成设定）</text>
  <text class="b" x="80" y="242">日活 × 每人对话数</text>
  <text class="m" x="332" y="242">500000 × 3.2</text>
  <text class="mb" x="456" y="242" fill="#64748B">1600000 次对话/天</text>
  <path d="M72 258H660" class="divider"/>
  <text class="b" x="80" y="300">÷ 86400</text>
  <text class="m" x="332" y="300">摊到每秒</text>
  <text class="mb" x="456" y="300" fill="#64748B">18.5 对话/s</text>
  <path d="M72 316H660" class="divider"/>
  <text class="b" x="80" y="358">× 峰均比</text>
  <text class="m" x="332" y="358">× 3</text>
  <text class="mb" x="456" y="358" fill="#B45309">55.6 对话/s</text>
  <path d="M72 374H660" class="divider"/>
  <text class="b" x="80" y="416">× 每次对话的调用数</text>
  <text class="m" x="332" y="416">× 2.4</text>
  <text class="mb" x="456" y="416" fill="#B45309">133 调用/s</text>
  <path d="M72 432H660" class="divider"/>
  <text class="b" x="80" y="474">× 平均输出长度</text>
  <text class="m" x="332" y="474">× 220</text>
  <text class="mb" x="456" y="474" fill="#1D4ED8">29333 token/s</text>
  <path d="M72 490H660" class="divider"/>
  <text class="b" x="80" y="532">调用/s × 平均请求时长</text>
  <text class="m" x="332" y="532">133 × 4.2 s</text>
  <text class="mb" x="456" y="532" fill="#1D4ED8">在途 560 条</text>
  <rect class="warnfill" x="56" y="588" width="620" height="52" rx="14"/>
  <text class="s" x="74" y="618">第二步和第四步之间差 3 × 2.4 = 7.2 倍，26.8 案例一把它们当成了同一个数</text>
  <rect class="badfill" x="700" y="158" width="524" height="196" rx="16"/>
  <text class="h" x="724" y="190">不能省的那一步：按总长度折算并发</text>
  <text class="s" x="724" y="224">第 16 章给的 130 条，是在总长度 2300 token 下测的</text>
  <text class="s" x="724" y="252">本例 2600 + 220 = 2820 token</text>
  <text class="mb" x="724" y="286" fill="#B91C1C">130 × 2300 ÷ 2820 ≈ 106 条</text>
  <text class="s" x="724" y="320">跳过它，等于用另一个负载的容量给这个负载配卡</text>
  <rect class="card" x="700" y="374" width="524" height="200" rx="16"/>
  <text class="h" x="724" y="406">两个约束，取更紧的</text>
  <text class="b" x="724" y="446">只看静态吞吐</text>
  <text class="m" x="904" y="446">29333 ÷ 1560</text>
  <text class="mb" x="1084" y="446" fill="#64748B">18.8 张</text>
  <text class="b" x="724" y="482">补上 Prefill 占时</text>
  <text class="m" x="904" y="482">29333 ÷ 924</text>
  <text class="mb" x="1084" y="482" fill="#B91C1C">31.7 张</text>
  <text class="b" x="724" y="518">按显存并发</text>
  <text class="m" x="904" y="518">560 ÷ 106</text>
  <text class="mb" x="1084" y="518" fill="#0F766E">5.3 张</text>
  <path d="M716 538H1208" class="divider"/>
  <text class="b" x="724" y="568" fill="#B91C1C">吞吐先满，刚好够 32 张，加 30% 余量 42 张</text>
  <rect class="soft" x="700" y="588" width="524" height="52" rx="14"/>
  <text class="s" x="718" y="618">Prefill 占时 10% → 47%，单卡输出 1560 → 924 token/s</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">链上少一步折算，配出来的卡数就是另一个负载的答案</text>
</svg>
