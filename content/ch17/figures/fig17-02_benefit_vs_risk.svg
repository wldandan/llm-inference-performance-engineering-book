<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">三项量化手段的收益与质量风险</title><desc id="fig-desc">一个二维图，横轴是收益，纵轴是质量风险。KV Cache INT8 在右下角，收益大而风险低；权重 INT8 同属低风险档；权重 INT4 在右上角，收益最大而风险最高。右侧列出两件应该先做的、没有质量风险的事：按长度分流与查框架开销。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 17 章 · 17.5、17.6</text><text class="t" x="56" y="86">该先做哪一个：按收益除以质量风险排</text><text class="sub" x="56" y="116">KV 量化排第一，是因为收益最直接、能单独开关回退，而且风险和权重 INT8 同档</text>
  <rect class="card" x="72" y="176" width="720" height="380" rx="16"/>
  <path d="M180 214V492H740" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text class="b" x="96" y="202">收益越大，质量风险通常越高</text>
  <text class="s" x="740" y="538" text-anchor="end">收益（越往右越大）</text>
  <text class="s" x="96" y="538">低</text>
  <text class="s" x="164" y="224" text-anchor="end">高</text>
  <text class="s" x="164" y="488" text-anchor="end">低</text>
  <text class="s" x="112" y="353.0">质</text>
  <text class="s" x="112" y="373.0">量</text>
  <text class="s" x="112" y="393.0">风</text>
  <text class="s" x="112" y="413.0">险</text>
  <rect x="423" y="408" width="208" height="68" rx="14" class="goodfill"/>
  <text class="b" x="527.2" y="433.96" text-anchor="middle">① KV Cache INT8</text>
  <text class="s" x="527.2" y="457.96" text-anchor="middle">并发翻倍 · 风险低</text>
  <rect x="367" y="313" width="208" height="68" rx="14" class="warnfill"/>
  <text class="b" x="471.2" y="339.44" text-anchor="middle">② 权重 INT8</text>
  <text class="s" x="471.2" y="363.44" text-anchor="middle">单步下限减半 · 风险中等</text>
  <rect x="524" y="213" width="208" height="68" rx="14" class="badfill"/>
  <text class="b" x="628.0" y="239.35999999999999" text-anchor="middle">③ 权重 INT4</text>
  <text class="s" x="628.0" y="263.36" text-anchor="middle">下限再减半 · 风险最高</text>
  <text class="bad" x="628.0" y="301.36" text-anchor="middle">没有评测集就不要进这一格</text>
  <rect class="card" x="816" y="176" width="392" height="380" rx="16"/>
  <text class="b" x="840" y="210">在它们之前先做两件事</text>
  <rect class="coolfill" x="832" y="230" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="260">一 按长度分流</text>
  <text class="s" x="850" y="286">少量长请求走单独的实例组</text>
  <text class="s" x="850" y="312">max_model_len 只管最坏情况的并发</text>
  <rect class="coolfill" x="832" y="348" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="378">二 查框架开销</text>
  <text class="s" x="850" y="404">读启动日志，不看空载的 nvidia-smi</text>
  <text class="s" x="850" y="430">权重和 KV 池之外占了 20 GiB，先查这里</text>
  <rect class="soft" x="832" y="466" width="344" height="42" rx="14"/>
  <text class="s" x="850" y="496">这两件都比量化便宜，且没有质量风险</text>
  <rect class="soft" x="72" y="572" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="602">顺序不是按收益排的，是按“收益除以质量风险”排的。17.8 案例三那个团队花两周做 INT4，后来发现只要把长请求分流出去。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">量化是最后一步：先按长度分流、先查框架开销，这两件没有质量风险</text>
</svg>
