<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">投机解码的收益比与盈亏线</title><desc id="fig-desc">一条直线画出收益比随平均接受数的变化，k 为 4、c 为 0.1 时收益比等于接受数除以 1.4。收益比 1 以下的区域标为红色，表示净亏损。盈亏线画在接受数 1.4 处。四个点分别是 1.1、1.3、3.2、3.6，前两个在线的左侧，后两个在右侧。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 18 章 · 18.3</text><text class="t" x="56" y="86">接受数低于 1.4，投机解码是净亏损而不是收益小</text><text class="sub" x="56" y="116">收益比 = a ÷ (1 + k×c)；分母里那个 1 代表验证近乎免费，这是它成立的前提</text>
  <rect class="card" x="72" y="176" width="740" height="380" rx="16"/>
  <path d="M168 214V486H760" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text class="b" x="96" y="202">收益比 = 平均接受长度 a ÷ (1 + k × c)，这里 k=4、c=0.1</text>
  <rect x="168" y="395" width="592" height="91" fill="#FEF2F2" stroke="none"/>
  <path class="rule" fill="none" d="M168 395.33333333333337L760 395.33333333333337"/>
  <text class="s" x="750" y="385.33333333333337" text-anchor="end">收益比 1：不快不慢</text>
  <text class="bad" x="750" y="423.33333333333337" text-anchor="end">这条线以下是净亏损，不是收益小</text>
  <polyline points="168,421 178,418 188,415 198,412 207,408 217,405 227,402 237,399 247,395 257,392 267,389 277,386 286,382 296,379 306,376 316,373 326,369 336,366 346,363 355,360 365,356 375,353 385,350 395,347 405,344 415,340 425,337 434,334 444,331 454,327 464,324 474,321 484,318 494,314 503,311 513,308 523,305 533,301 543,298 553,295 563,292 573,288 582,285 592,282 602,279 612,276 622,272 632,269 642,266 651,263 661,259 671,256 681,253 691,250 701,246 711,243 721,240 730,237 740,233 750,230 760,227" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <path class="rule" fill="none" d="M246.9333333333333 214L246.9333333333333 486"/>
  <text class="b" x="258.9333333333333" y="236">盈亏线 a = 1 + k×c = 1.4</text>
  <circle cx="188" cy="415" r="6" fill="#B91C1C"/>
  <path d="M188 415L184 343" stroke="#B91C1C" stroke-width="1.4" fill="none"/>
  <text class="b" x="183.73333333333335" y="356.76190476190476">1.1 → 0.79 倍</text>
  <text class="s" x="183.73333333333335" y="376.76190476190476">18.3 那个反例</text>
  <circle cx="227" cy="402" r="6" fill="#B91C1C"/>
  <path d="M227 402L261 438" stroke="#B91C1C" stroke-width="1.4" fill="none"/>
  <text class="b" x="261.20000000000005" y="451.8095238095238">1.3 → 0.93 倍</text>
  <text class="s" x="261.20000000000005" y="471.8095238095238">客服对话（18.8 案例一）</text>
  <circle cx="602" cy="279" r="6" fill="#0F766E"/>
  <path d="M602 279L588 307" stroke="#0F766E" stroke-width="1.4" fill="none"/>
  <text class="b" x="588.1333333333334" y="320.7619047619047" text-anchor="end">3.2 → 2.29 倍</text>
  <text class="s" x="588.1333333333334" y="340.7619047619047" text-anchor="end">18.3 那个正例</text>
  <circle cx="681" cy="253" r="6" fill="#0F766E"/>
  <path d="M681 253L667 193" stroke="#0F766E" stroke-width="1.4" fill="none"/>
  <text class="b" x="667.0666666666667" y="206.85714285714283" text-anchor="end">3.6 → 2.57 倍</text>
  <text class="s" x="667.0666666666667" y="226.85714285714283" text-anchor="end">代码补全（18.8 案例一）</text>
  <path d="M168 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="168.0" y="512" text-anchor="middle">1.0</text>
  <path d="M247 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="246.9333333333333" y="512" text-anchor="middle">1.4</text>
  <path d="M365 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="365.3333333333333" y="512" text-anchor="middle">2.0</text>
  <path d="M563 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="562.6666666666666" y="512" text-anchor="middle">3.0</text>
  <path d="M760 486V492" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="760.0" y="512" text-anchor="middle">4.0</text>
  <text class="s" x="760" y="534" text-anchor="end">平均接受长度 a</text>
  <text class="b" x="96" y="534">同一套配置，两个场景落在线的两侧</text>
  <text class="s" x="156" y="400.33333333333337" text-anchor="end">1</text>
  <text class="s" x="156" y="309.6666666666667" text-anchor="end">2</text>
  <text class="s" x="156" y="219.0" text-anchor="end">3</text>
  <rect class="card" x="836" y="176" width="372" height="380" rx="16"/>
  <text class="b" x="860" y="210">分母里那个 1 是什么</text>
  <rect class="goodfill" x="852" y="230" width="340" height="104" rx="14"/>
  <text class="s" x="870" y="260">1 = 验证。目标模型一次前向过 k+1 个位置</text>
  <text class="s" x="870" y="286">Decode 是带宽受限的，权重反正要搬一遍</text>
  <text class="s" x="870" y="312">多算几个位置几乎不增加时间</text>
  <rect class="coolfill" x="852" y="348" width="340" height="104" rx="14"/>
  <text class="s" x="870" y="378">k × c = 草稿的时间。k=4 次草稿</text>
  <text class="s" x="870" y="404">草稿模型是目标模型的十分之一大</text>
  <text class="s" x="870" y="430">所以 4 × 0.1 = 0.4，这部分是净增的</text>
  <rect class="badfill" x="852" y="466" width="340" height="78" rx="14"/>
  <text class="s" x="870" y="496">批量大到算力不空闲时，那个 1 会变大</text>
  <text class="s" x="870" y="522">不是式子失灵，是式子的前提失效</text>
  <rect class="soft" x="72" y="572" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="602">接受数取决于内容的可预测性，是业务属性，在场景之间完全不可迁移。别人的 3.6 来自代码补全，你的开放式对话可能只有 1.1，而 1.1 在这条线的下面。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">盈亏线是 a &gt; 1 + k×c；接受率没测过就不该部署它，那个数不可迁移</text>
</svg>
