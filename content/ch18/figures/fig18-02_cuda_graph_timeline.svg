<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">CUDA Graph 让 Timeline 上的 kernel 空隙消失</title><desc id="fig-desc">上下两条等长的时间轴示意图，空隙被刻意放大以便看清。上面一条是未启用 CUDA Graph 时：十二个 kernel 之间夹着启动空隙。下面一条是启用后：变成一整块连续执行，右侧空出的一段标为省下的时间。下方给出这 0.5 ms 在 7B 上占单步下限的 3.6%、在 30B 上只占 0.8%，以及 1% 那条分界线在 1000 GB/s 的卡上落在 25B、在 2039 GB/s 的卡上落在 51B。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 18 章 · 18.4</text><text class="t" x="56" y="86">CUDA Graph 治的是启动开销，而它值多少随卡而变</text><text class="sub" x="56" y="116">录一次、每步提交一次；省下的启动开销占单步下限的比例决定它值不值那份捕获显存</text>
  <rect class="card" x="72" y="176" width="1136" height="296" rx="16"/>
  <text class="b" x="96" y="208">同一步 Decode 的 Timeline（示意，空隙被放大了，不按比例）</text>
  <text class="b" x="96" y="254">未启用</text>
  <rect class="soft" x="200" y="236" width="984" height="42" rx="6"/>
  <rect x="204" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="286" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="368" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="450" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="532" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="614" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="696" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="778" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="860" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="942" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="1024" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <rect x="1106" y="242" width="51" height="30" rx="3" fill="#1D4ED8" opacity="0.85"/>
  <text class="s" x="96" y="304">每步几十到上百个 kernel，每个之间一道启动空隙；单次几微秒，每步合计约 0.5 ms</text>
  <text class="b" x="96" y="354">已启用</text>
  <rect class="soft" x="200" y="336" width="984" height="42" rx="6"/>
  <rect x="204" y="342" width="618" height="30" rx="3" fill="#0F766E" opacity="0.9"/>
  <text class="hw" x="218" y="364">一次提交替代上百次启动</text>
  <path d="M826 386V394H1184V386" class="bracket"/>
  <text class="b" x="1005.04" y="414" text-anchor="middle">省下的那一段</text>
  <text class="s" x="96" y="440">空隙消失，变成连续密集的执行</text>
  <rect class="card" x="72" y="488" width="552" height="128" rx="16"/>
  <text class="b" x="96" y="520">那 0.5 ms 值多少，取决于单步下限</text>
  <text class="m" x="96" y="548">7B   下限 14 ms   0.5 ÷ 14 = 3.6%   值得做</text>
  <text class="m" x="96" y="574">30B  下限 60 ms   0.5 ÷ 60 = 0.8%   不值那份捕获显存</text>
  <text class="s" x="96" y="600">上面那两条轴里的空隙按真实比例只有 3.6%，画不出来</text>
  <text class="s" x="72" y="636">0.5 ms 当定值是简化：kernel 数随层数涨，60 层约 0.9 ms，真实的线比 25B 更靠后</text>
  <rect class="card" x="656" y="488" width="552" height="128" rx="16"/>
  <text class="b" x="680" y="520">分界线是卡的属性，不是常数</text>
  <text class="m" x="680" y="548">0.5 ÷ 下限 = 1%  →  下限 50 ms</text>
  <text class="m" x="680" y="574">1000 GB/s → 25B</text>
  <text class="m" x="896" y="574">2039 GB/s → 51B</text>
  <text class="s" x="680" y="600">带宽越高，同样参数量下单步越短，这项反而越值得做</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">启动开销涨得比单步下限慢得多，所以分界线是卡的属性，不是写死的 30B</text>
</svg>
