<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">变化比回路快时，弹性就调不了</title><desc id="fig-desc">主图是一根对数时间轴，从 20 秒到一个月，刻度标出 1 分、10 分、1 时、1 天、1 周。一条竖带标出回路滞后 4 到 13.5 分钟，一条竖虚线标出两倍滞后 27 分钟的门槛，门槛右边才值得交给弹性。三类变化按持续时间画成三条横条：突发 30 秒到 2 分钟，落在滞后带左边，要交给准入和排队；日内波峰与小时级增长 1 到 6 小时，落在门槛右边，可预测的用定时扩缩容、不可预测的交给弹性；长期增长 1 周到 1 个月，该做容量规划。右栏是同一条轨迹上四种策略的未满足需求和成本：三种扩缩容策略都有十万量级的未满足，只做准入的那一种未满足为零、成本最低。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 27 章 · 27.4、27.5</text><text class="t" x="56" y="86">弹性能不能用，取决于变化比回路快还是慢</text><text class="sub" x="56" y="116">回路滞后 4 到 13.5 分钟，经验上取两倍，27 分钟以上的变化才值得交给它</text>
  <rect class="card" x="56" y="158" width="744" height="416" rx="16"/>
  <text class="b" x="80" y="190">横轴是变化持续的时间，对数刻度</text>
  <path d="M128 500H768" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M187.7 500V506" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="187.72642183953764" y="526" text-anchor="middle">1 分</text>
  <path d="M312.9 500V506" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="312.90722493461357" y="526" text-anchor="middle">10 分</text>
  <path d="M410.3 500V506" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="410.3168233870756" y="526" text-anchor="middle">1 时</text>
  <path d="M583.1 500V506" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="583.0927750653864" y="526" text-anchor="middle">1 天</text>
  <path d="M688.9 500V506" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="688.8828264084457" y="526" text-anchor="middle">1 周</text>
  <rect x="263.1" y="222" width="66.1" height="278" fill="#B45309" opacity="0.12"/>
  <text class="b" x="296.15764290530626" y="214" text-anchor="middle">回路滞后 4 到 13.5 分</text>
  <path class="rule" fill="none" d="M366.90568735815054 222L366.90568735815054 500"/>
  <text class="b" x="376.9" y="244" fill="#B45309">门槛 27 分</text>
  <text class="s" x="376.90568735815054" y="268">右边才值得交给弹性</text>
  <rect x="150.0" y="300" width="75.4" height="22" rx="8" fill="#B91C1C" opacity="0.28" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="b" x="150.0" y="290" text-anchor="start" fill="#B91C1C">突发（秒到分钟）</text>
  <text class="s" x="150.04324522661324" y="342">弹性追不上，交给准入和排队</text>
  <rect x="410.3" y="366" width="97.4" height="22" rx="8" fill="#0F766E" opacity="0.28" stroke="#0F766E" stroke-width="1.6"/>
  <text class="b" x="410.3" y="356" text-anchor="start" fill="#0F766E">日内波峰与小时级增长（小时）</text>
  <text class="s" x="410.3168233870756" y="408">可预测的用定时扩缩容，不可预测的交给弹性</text>
  <rect x="688.9" y="432" width="79.1" height="22" rx="8" fill="#1D4ED8" opacity="0.28" stroke="#1D4ED8" stroke-width="1.6"/>
  <text class="b" x="768.0" y="422" text-anchor="end" fill="#1D4ED8">长期增长（周到月）</text>
  <text class="s" x="768.0" y="474" text-anchor="end">该做容量规划（第 26 章），不是弹性</text>
  <text class="b" x="80" y="562" fill="#B91C1C">样例轨迹那次突发只持续 90 秒，比这次模拟的滞后 420 秒还短（滞后下限也有 240 秒）</text>
  <rect class="card" x="824" y="158" width="400" height="264" rx="16"/>
  <text class="h" x="848" y="190">同一条轨迹，四种策略</text>
  <text class="s" x="848" y="218">未满足需求</text>
  <text class="s" x="1096" y="218">成本</text>
  <text class="b" x="848" y="260">reactive</text>
  <text class="m" x="1000" y="260" text-anchor="end" fill="#B91C1C">107k</text>
  <text class="m" x="1180" y="260" text-anchor="end">49</text>
  <text class="b" x="848" y="300">scheduled</text>
  <text class="m" x="1000" y="300" text-anchor="end" fill="#B91C1C">107k</text>
  <text class="m" x="1180" y="300" text-anchor="end">50</text>
  <text class="b" x="848" y="340">warm-pool</text>
  <text class="m" x="1000" y="340" text-anchor="end" fill="#B91C1C">106k</text>
  <text class="m" x="1180" y="340" text-anchor="end">50</text>
  <text class="b" x="848" y="380">admission-only</text>
  <text class="m" x="1000" y="380" text-anchor="end" fill="#0F766E">0k</text>
  <text class="m" x="1180" y="380" text-anchor="end">44</text>
  <rect class="goodfill" x="824" y="442" width="400" height="132" rx="16"/>
  <text class="h" x="848" y="474">读法</text>
  <text class="s" x="848" y="506">三种靠扩缩容的策略都漏了那一段，</text>
  <text class="s" x="848" y="532">而只做准入的那一列未满足为零，</text>
  <text class="b" x="848" y="560" fill="#0F766E">成本还更低</text>
  <rect class="soft" x="56" y="588" width="1168" height="52" rx="14"/>
  <text class="s" x="74" y="618">弹性不是没用，它在趋势那一段都跟得上。这张图说的是：突发那一段不该交给它，因为无论指标选得多好、阈值调得多准，回路的三段滞后都还在。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">突发那一段不该交给弹性：轨迹上 99% 的未满足需求都在那 90 秒里</text>
</svg>
