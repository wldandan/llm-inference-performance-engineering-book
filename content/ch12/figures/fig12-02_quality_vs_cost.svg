  <path class="rule" fill="none" d="M385.33333333333337 196L385.33333333333337 524"/>
  <text class="mb" x="385.33333333333337" y="186" text-anchor="middle">拐点</text>
  <text class="s" x="562.6666666666667" y="283.99999999999994">质量在 10 到 20 之间反而下降</text>
  <text class="s" x="96" y="610">新增片段相关性低、互相稀释，所以“取质量最高那一档”会买到一个更贵且更差的结果</text>
  <rect class="soft" x="824" y="182" width="400" height="214" rx="14"/>
  <text class="h" x="848" y="216">判据：增量质量 ÷ 增量成本</text>
  <text class="b" x="848" y="254">3 → 5</text>
  <text class="m" x="848" y="280">+0.07 质量   +400 token   +114 ms</text>
  <text class="b" x="848" y="318">5 → 10</text>
  <text class="m" x="848" y="344">+0.01 质量   +1000 token  +304 ms</text>
  <path class="rule" fill="none" d="M846 364L1200 364"/>
  <text class="mb" x="848" y="386">前一步的性价比是后一步的 17.5 倍</text>
  <rect class="coolfill" x="824" y="416" width="400" height="166" rx="14"/>
  <text class="h" x="848" y="450">两个答案不一样</text>
  <text class="s" x="848" y="484">质量最高的一档</text>
  <text class="mb" x="1200" y="484" text-anchor="end">K = 10</text>
  <text class="s" x="848" y="520">划算的那一档</text>
  <text class="mb" x="1200" y="520" text-anchor="end">K = 5</text>
  <text class="s" x="848" y="552">拐点附近两档要按可识别线判断能否分辨</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">判据是增量质量除以增量成本，它给出的答案和取质量最高那一档不同。</text>
</svg>
