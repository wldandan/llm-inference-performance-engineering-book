  <text class="mb" x="385.33333333333337" y="552" text-anchor="middle">K=5</text>
  <text class="s" x="385.33333333333337" y="574" text-anchor="middle">1630 token</text>
  <circle cx="546.7" cy="250.0" r="6" fill="#0F766E"/>
  <circle cx="546.7" cy="464.2" r="6" fill="#B45309"/>
