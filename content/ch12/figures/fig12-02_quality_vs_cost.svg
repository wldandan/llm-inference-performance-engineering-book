  <text class="m" x="224.0" y="300.0" text-anchor="middle" fill="#0F766E">0.71</text>
  <text class="m" x="224.0" y="484.1" text-anchor="middle" fill="#B45309">320 ms</text>
  <text class="mb" x="224.0" y="552" text-anchor="middle">K=3</text>
  <text class="s" x="224.0" y="574" text-anchor="middle">1230 token</text>
