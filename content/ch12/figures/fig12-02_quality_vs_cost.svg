  <text class="mb" x="546.6666666666667" y="552" text-anchor="middle">K=10</text>
  <text class="s" x="546.6666666666667" y="574" text-anchor="middle">2630 token</text>
  <circle cx="708.0" cy="258.0" r="6" fill="#0F766E"/>
  <circle cx="708.0" cy="407.8" r="6" fill="#B45309"/>
  <text class="m" x="708.0" y="244.0" text-anchor="middle" fill="#0F766E">0.78</text>
  <text class="m" x="708.0" y="393.8" text-anchor="middle" fill="#B45309">1434 ms</text>
  <text class="mb" x="708.0" y="552" text-anchor="middle">K=20</text>
  <text class="s" x="708.0" y="574" text-anchor="middle">4630 token</text>
  <text class="b" x="164" y="230" text-anchor="end" fill="#0F766E">质量分</text>
  <text class="s" x="164" y="252" text-anchor="end">示意值</text>
  <text class="b" x="164" y="406" text-anchor="end" fill="#B45309">TTFT</text>
