</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH12 · 12.4</text><text class="t" x="56" y="86">拐点在 5，不在质量最高的 10</text><text class="sub" x="56" y="116">该停在哪一档</text>
  <rect class="card" x="72" y="182" width="728" height="400" rx="16"/>
  <path d="M178 210V338H754" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
