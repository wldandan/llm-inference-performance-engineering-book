<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 12-1 prompt 的五段各由谁决定</title><desc id="fig-desc">一条按 token 数成比例的堆叠条，依次是 system prompt 200、few-shot 400、检索片段 2000、用户问题 30，共 2630 token；下方括号标出可缓存前缀 600 token，并说明它为什么不是不随请求变化的那 630。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH12 · 12.2</text><text class="t" x="56" y="86">prompt 的五段各由谁决定</text><text class="sub" x="56" y="116">最长的那一段是谁选的</text>
  <text class="b" x="96" y="208">Top-K = 10 的一条 prompt，共 2630 token（段宽按 token 数成比例，左边就是拼接顺序）</text>
  <rect x="96.0" y="238" width="82.7" height="72" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <rect x="178.7" y="238" width="165.5" height="72" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <rect x="344.2" y="238" width="827.4" height="72" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <rect x="1171.6" y="238" width="12.4" height="72" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
  <path d="M137.4 310V334" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <text class="b" x="127.4" y="358" text-anchor="start" fill="#1D4ED8">system prompt 200 token</text>
  <text class="s" x="127.36882129277566" y="380">应用层</text>
  <text class="b" x="261.5" y="268" text-anchor="middle" fill="#1D4ED8">few-shot 示例</text>
  <text class="m" x="261.47528517110266" y="292" text-anchor="middle">400 token</text>
  <text class="s" x="261.47528517110266" y="342" text-anchor="middle">应用层</text>
  <text class="b" x="757.9" y="268" text-anchor="middle" fill="#B45309">检索片段 10 段</text>
  <text class="m" x="757.9011406844106" y="292" text-anchor="middle">2000 token</text>
  <text class="s" x="757.9011406844106" y="342" text-anchor="middle">应用层：Top-K</text>
  <path d="M1177.8 310V334" fill="none" stroke="#0F766E" stroke-width="2"/>
  <text class="b" x="1167.8" y="358" text-anchor="end" fill="#0F766E">用户问题 30 token</text>
  <text class="s" x="1167.7946768060838" y="380" text-anchor="end">用户输入，整条里最短的一段，却排在最后</text>
  <path class="bracket" d="M96 412V426H344.2V412"/>
  <text class="mb" x="360.212927756654" y="430">可缓存前缀 600 token</text>
  <rect class="soft" x="96" y="478" width="528" height="132" rx="14"/>
  <text class="h" x="118" y="510">为什么是 600 而不是 630</text>
  <text class="s" x="118" y="542">不随请求变化的内容有 630 token，但缓存按前缀匹配。</text>
  <text class="s" x="118" y="568">用户问题排在最后，它前面的检索片段一变，前缀早就</text>
  <text class="s" x="118" y="594">断了，那 30 token 永远命中不了。</text>
  <rect class="coolfill" x="656" y="478" width="528" height="132" rx="14"/>
  <text class="h" x="678" y="510">同一份 prompt，两个档位</text>
  <text class="m" x="678" y="544">Top-K = 3    1230 token    前缀占 49%</text>
  <text class="m" x="678" y="572">Top-K = 10   2630 token    前缀占 23%</text>
  <text class="s" x="678" y="600">档位一变，该不该开缓存的答案就变了</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">最大的那一段是应用层选的；能被缓存的只有排在最前面那一段。</text>
</svg>
