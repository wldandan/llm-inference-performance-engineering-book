<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 12-3 Agent 的上下文是一条阶梯</title><desc id="fig-desc">五级阶梯按 token 数成比例，从 600 递增到 5800，总计 14500；右侧对比按调用估算的 3000 token，两者相差 4.8 倍。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH12 · 12.5</text><text class="t" x="56" y="86">Agent 的上下文是一条阶梯</text><text class="sub" x="56" y="116">为什么五步任务的账单不是单步的五倍</text>
  <text class="b" x="96" y="238">第 1 步</text>
  <text class="s" x="352" y="238" text-anchor="end">system + 任务描述</text>
  <rect class="coolfill" x="368" y="212" width="48.62068965517241" height="40" rx="6"/>
  <text class="m" x="430.62068965517244" y="238">600 token</text>
  <text class="b" x="96" y="304">第 2 步</text>
  <text class="s" x="352" y="304" text-anchor="end">上一步 + 工具A结果</text>
  <rect class="coolfill" x="368" y="278" width="113.44827586206897" height="40" rx="6"/>
  <text class="m" x="495.44827586206895" y="304">1400 token</text>
  <text class="b" x="96" y="370">第 3 步</text>
  <text class="s" x="352" y="370" text-anchor="end">上两步 + 工具B结果</text>
  <rect class="coolfill" x="368" y="344" width="210.68965517241378" height="40" rx="6"/>
  <text class="m" x="564.6896551724137" y="370" text-anchor="end">2600 token</text>
  <text class="b" x="96" y="436">第 4 步</text>
  <text class="s" x="352" y="436" text-anchor="end">上三步 + 工具C结果</text>
  <rect class="coolfill" x="368" y="410" width="332.2413793103448" height="40" rx="6"/>
  <text class="m" x="686.2413793103449" y="436" text-anchor="end">4100 token</text>
  <text class="b" x="96" y="502">第 5 步</text>
  <text class="s" x="352" y="502" text-anchor="end">上四步 + 工具D结果</text>
  <rect class="coolfill" x="368" y="476" width="470.0" height="40" rx="6"/>
  <text class="m" x="824.0" y="502" text-anchor="end">5800 token</text>
  <path class="rule" fill="none" d="M368 190L368 530"/>
  <rect class="badfill" x="908" y="196" width="316" height="160" rx="14"/>
  <text class="h" x="932" y="230">按任务算</text>
  <text class="mb" x="932" y="268">14500 token</text>
  <text class="s" x="932" y="296">五步相加</text>
  <text class="s" x="932" y="330">600+1400+2600+4100+5800</text>
  <rect class="soft" x="908" y="376" width="316" height="130" rx="14"/>
  <text class="h" x="932" y="410">按调用算</text>
  <text class="mb" x="932" y="448">3000 token</text>
  <text class="s" x="932" y="476">首步 600 × 5，估少了</text>
  <path class="flow" d="M1066 512V548"/>
  <text class="mb" x="1066" y="576" text-anchor="middle">差 4.8 倍</text>
  <rect class="soft" x="96" y="548" width="700" height="78" rx="14"/>
  <text class="s" x="114" y="578">延迟也在逐步恶化：每一步的 TTFT 都比上一步长，用户感受到的是任务越往后越卡。</text>
  <text class="s" x="114" y="604">这就是第 6 章那个“Agent 的账算少了”案例的机理；压缩历史的具体策略在第 24 章。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">Agent 的成本要按任务算，按调用算会少算好几倍。</text>
</svg>
