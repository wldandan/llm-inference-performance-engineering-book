<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter00-v2" fill="#0F172A">
  <title id="fig-title">图 0-3 批量摊薄搬运，满载拉长等待</title><desc id="fig-desc">左图示意同时服务的人数增加时，总产出先近乎线性上升、每人出字速度先几乎不变，越过显存或计算的边界后二者都变差；右图示意负载接近满载时排队等待急剧上升。两图均为示意曲线，不含具体数值。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.thin{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.loop{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.axis{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:7 6}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.warn{fill:#FED7AA}.warnt{font-size:14px;font-weight:700;fill:#0F172A}.lbl{font-size:15px;font-weight:700}.tw{font-size:14px;font-weight:700;fill:#FFFFFF}.big{font-size:22px;font-weight:750}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}.sep{fill:none;stroke:#E2E8F0;stroke-width:1.5}.dv{font-size:15px;fill:#334155}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">SHARING ONE GPU · 03</text><text class="t" x="56" y="84">批量摊薄搬运，满载拉长等待</text><text class="sub" x="56" y="114">左：同时服务的人数增加时；右：负载接近满载时。两图均为示意曲线，不代表具体数值</text>
  <g transform="translate(56 146)"><rect class="card" width="572" height="470" rx="22"/><text class="h" x="28" y="42">批量：同一次搬运，同时给很多人写</text><path class="axis" d="M90 404V112"/><path d="M90 112l-6 9h12z" fill="#334155"/><path class="axis" d="M90 404H548"/><path d="M548 404l-9 -6v12z" fill="#334155"/><text class="s" x="319" y="436" text-anchor="middle">同时服务的人数</text><text class="s" x="46" y="258" transform="rotate(-90 46 258)" text-anchor="middle">示意（两条线单位不同）</text><path class="dash" d="M360 120V404"/><rect class="tag" x="214" y="66" width="292" height="36" rx="18"/><text class="tagt" x="360" y="90" text-anchor="middle">边界：显存装不下 / 计算追上来</text><path d="M90 360L360 178Q430 150 530 140" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/><path d="M90 360H360Q430 366 530 390" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><text class="lbl" x="468" y="128" text-anchor="middle">总产出</text><text class="lbl" x="120" y="390" fill="#64748B">每人出字速度</text><rect class="tag" x="100" y="176" width="150" height="34" rx="17"/><text class="tagt" x="175" y="198" text-anchor="middle">边界内几乎白捡</text><rect class="warn" x="374" y="222" width="160" height="34" rx="17"/><text class="warnt" x="454" y="244" text-anchor="middle">越过边界开始变慢</text></g>
  <g transform="translate(652 146)"><rect class="card" width="572" height="470" rx="22"/><text class="h" x="28" y="42">排队：越接近满载，等待涨得越快</text><rect x="412" y="112" width="128" height="292" fill="#FED7AA" opacity="0.55"/><text class="warnt" x="476" y="136" text-anchor="middle">接近满载</text><path class="axis" d="M90 404V112"/><path d="M90 112l-6 9h12z" fill="#334155"/><path class="axis" d="M90 404H548"/><path d="M548 404l-9 -6v12z" fill="#334155"/><text class="s" x="319" y="436" text-anchor="middle">到来的请求量（越往右越接近处理上限）</text><text class="s" x="46" y="258" transform="rotate(-90 46 258)" text-anchor="middle">排队等待</text><path d="M90.0 396.0L94.5 395.9L99.1 395.7L103.6 395.6L108.1 395.4L112.6 395.3L117.2 395.2L121.7 395.0L126.2 394.8L130.7 394.7L135.3 394.5L139.8 394.4L144.3 394.2L148.8 394.0L153.4 393.8L157.9 393.7L162.4 393.5L166.9 393.3L171.5 393.1L176.0 392.9L180.5 392.7L185.1 392.5L189.6 392.2L194.1 392.0L198.6 391.8L203.2 391.6L207.7 391.3L212.2 391.1L216.7 390.8L221.3 390.6L225.8 390.3L230.3 390.0L234.8 389.7L239.4 389.4L243.9 389.1L248.4 388.8L252.9 388.5L257.5 388.2L262.0 387.8L266.5 387.5L271.1 387.1L275.6 386.8L280.1 386.4L284.6 386.0L289.2 385.6L293.7 385.1L298.2 384.7L302.7 384.2L307.3 383.7L311.8 383.2L316.3 382.7L320.8 382.2L325.4 381.6L329.9 381.0L334.4 380.4L338.9 379.7L343.5 379.1L348.0 378.4L352.5 377.6L357.1 376.9L361.6 376.1L366.1 375.2L370.6 374.3L375.2 373.4L379.7 372.4L384.2 371.3L388.7 370.2L393.3 369.0L397.8 367.7L402.3 366.4L406.8 365.0L411.4 363.4L415.9 361.8L420.4 360.0L424.9 358.1L429.5 356.1L434.0 353.9L438.5 351.5L443.1 348.8L447.6 346.0L452.1 342.8L456.6 339.3L461.2 335.4L465.7 331.1L470.2 326.2L474.7 320.6L479.3 314.3L483.8 307.0L488.3 298.5L492.8 288.4L497.4 276.3L501.9 261.5L506.4 243.0L510.9 219.3L515.5 187.6" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="tag" x="106" y="316" width="232" height="34" rx="17"/><text class="tagt" x="222" y="338" text-anchor="middle">空闲时多来一些，几乎无感</text><rect class="warn" x="140" y="170" width="232" height="34" rx="17"/><text class="warnt" x="256" y="192" text-anchor="middle">多一点请求，等待成倍增长</text><path class="thin" d="M372 187Q430 190 468 226"/><path d="M468 226l-9 -3 5 -9z" fill="#334155"/></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">想省就要跑满，想快就要留余量；愿意等的请求，可以放进跑满的卡池。</text>
</svg>
