<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter00-v2" fill="#0F172A">
  <title id="fig-title">图 0-1 朴素的四步生成循环</title><desc id="fig-desc">展示最朴素的生成方式：切成 token、让输入与已写出的全部 token 穿过权重、得到词表概率、选出一个 token 再回到第二步；下方逐圈列出每一圈送进模型的内容，标出与上一圈相比没有变化却被重复处理的部分。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.thin{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.loop{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.axis{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:7 6}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.warn{fill:#FED7AA}.warnt{font-size:14px;font-weight:700;fill:#0F172A}.lbl{font-size:15px;font-weight:700}.tw{font-size:14px;font-weight:700;fill:#FFFFFF}.big{font-size:22px;font-weight:750}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}.sep{fill:none;stroke:#E2E8F0;stroke-width:1.5}.dv{font-size:15px;fill:#334155}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">NAIVE GENERATION LOOP · 01</text><text class="t" x="56" y="84">朴素的四步生成循环：每转一圈，只多一个 token</text><text class="sub" x="56" y="114">先按最朴素的方式想象：第 ② 步每一圈都把输入和已写出的全部 token 重新送进模型</text>
  <rect class="warn" x="1064" y="30" width="160" height="38" rx="19"/><text class="warnt" x="1144" y="55" text-anchor="middle">朴素模型</text>
  <g transform="translate(56 150)"><rect class="card" width="250" height="170" rx="18"/><text class="h" x="125" y="46" text-anchor="middle">① 切成 token</text><text class="s" x="125" y="82" text-anchor="middle">输入文本 → token 序列</text><rect class="tag" x="30" y="110" width="190" height="38" rx="19"/><text class="tagt" x="125" y="135" text-anchor="middle">今天 · 天气 · 真</text></g>
  <g transform="translate(362 150)"><rect class="dark" width="250" height="170" rx="18"/><text class="hd" x="125" y="46" text-anchor="middle" fill="#FFFFFF">② 穿过权重</text><text class="sd" x="125" y="82" text-anchor="middle" fill="#CBD5E1">输入 + 已写出的全部 token</text><text class="sd" x="125" y="110" text-anchor="middle" fill="#CBD5E1">几十层 · 乘法与加法</text><text class="sd" x="125" y="138" text-anchor="middle" fill="#CBD5E1">稠密模型：全部权重参与</text></g>
  <g transform="translate(668 150)"><rect class="card" width="250" height="170" rx="18"/><text class="h" x="125" y="46" text-anchor="middle">③ 词表概率</text><text class="s" x="125" y="82" text-anchor="middle">词表里每个 token 一个概率</text><rect class="tag" x="30" y="110" width="190" height="38" rx="19"/><text class="tagt" x="125" y="135" text-anchor="middle">好 > 不错 > … > 糟</text></g>
  <g transform="translate(974 150)"><rect class="card" width="250" height="170" rx="18"/><text class="h" x="125" y="46" text-anchor="middle">④ 选一个 token</text><text class="s" x="125" y="82" text-anchor="middle">按规则挑出一个</text><rect class="tag" x="30" y="110" width="190" height="38" rx="19"/><text class="tagt" x="125" y="135" text-anchor="middle">接到序列末尾</text></g>
  <path class="flow" d="M306 235H356"/><path d="M356 235l-9 -6v12z" fill="#334155"/><path class="flow" d="M612 235H662"/><path d="M662 235l-9 -6v12z" fill="#334155"/><path class="flow" d="M918 235H968"/><path d="M968 235l-9 -6v12z" fill="#334155"/>
  <path class="loop" d="M1099 320V356Q1099 372 1083 372H503Q487 372 487 356V330"/><path d="M487 330l-6 9h12z" fill="#334155"/><rect class="tag" x="543" y="352" width="500" height="40" rx="20"/><text class="tagt" x="793" y="378" text-anchor="middle">回到 ②，直到写完：转多少圈，就写出多少个 token</text>
  <g transform="translate(56 412)"><rect class="card" width="1168" height="212" rx="22"/><text class="h" x="28" y="38">第 ② 步每一圈送进模型的内容</text><text class="s" x="1140" y="38" text-anchor="end">浅色：输入 · 深色：已写出的 token · 橙色框：和上一圈相比没变，却又处理了一遍</text><text class="lbl" x="28" y="82">第 1 圈</text><rect x="124" y="62" width="226" height="28" rx="6" fill="#CBD5E1"/><text class="tagt" x="237" y="81" text-anchor="middle">输入（系统提示 + 问题）</text><path class="thin" d="M368 76H868"/><path d="M868 76l-8 -5v10z" fill="#334155"/><rect class="tag" x="876" y="61" width="118" height="30" rx="15"/><text class="tagt" x="935" y="81" text-anchor="middle">写出 t1</text><text class="lbl" x="28" y="120">第 2 圈</text><rect x="124" y="100" width="226" height="28" rx="6" fill="#CBD5E1"/><text class="tagt" x="237" y="119" text-anchor="middle">输入（系统提示 + 问题）</text><rect x="356" y="100" width="44" height="28" rx="6" fill="#0F172A"/><text class="tw" x="378.0" y="119" text-anchor="middle" fill="#FFFFFF">t1</text><rect x="119" y="95" width="236" height="38" rx="9" fill="none" stroke="#FDBA74" stroke-width="3"/><path class="thin" d="M418 114H868"/><path d="M868 114l-8 -5v10z" fill="#334155"/><rect class="tag" x="876" y="99" width="118" height="30" rx="15"/><text class="tagt" x="935" y="119" text-anchor="middle">写出 t2</text><text class="lbl" x="28" y="158">第 3 圈</text><rect x="124" y="138" width="226" height="28" rx="6" fill="#CBD5E1"/><text class="tagt" x="237" y="157" text-anchor="middle">输入（系统提示 + 问题）</text><rect x="356" y="138" width="44" height="28" rx="6" fill="#0F172A"/><text class="tw" x="378.0" y="157" text-anchor="middle" fill="#FFFFFF">t1</text><rect x="406" y="138" width="44" height="28" rx="6" fill="#0F172A"/><text class="tw" x="428.0" y="157" text-anchor="middle" fill="#FFFFFF">t2</text><rect x="119" y="133" width="286" height="38" rx="9" fill="none" stroke="#FDBA74" stroke-width="3"/><path class="thin" d="M468 152H868"/><path d="M868 152l-8 -5v10z" fill="#334155"/><rect class="tag" x="876" y="137" width="118" height="30" rx="15"/><text class="tagt" x="935" y="157" text-anchor="middle">写出 t3</text><text class="lbl" x="28" y="196">第 500 圈</text><rect x="124" y="176" width="226" height="28" rx="6" fill="#CBD5E1"/><text class="tagt" x="237" y="195" text-anchor="middle">输入（系统提示 + 问题）</text><rect x="356" y="176" width="44" height="28" rx="6" fill="#0F172A"/><text class="tw" x="378.0" y="195" text-anchor="middle" fill="#FFFFFF">t1</text><rect x="406" y="176" width="44" height="28" rx="6" fill="#0F172A"/><text class="tw" x="428.0" y="195" text-anchor="middle" fill="#FFFFFF">t2</text><text class="lbl" x="472" y="196" text-anchor="middle" fill="#64748B">…</text><rect x="492" y="176" width="56" height="28" rx="6" fill="#0F172A"/><text class="tw" x="520.0" y="195" text-anchor="middle" fill="#FFFFFF">t499</text><rect x="119" y="171" width="372" height="38" rx="9" fill="none" stroke="#FDBA74" stroke-width="3"/><path class="thin" d="M566 190H868"/><path d="M868 190l-8 -5v10z" fill="#334155"/><rect class="tag" x="876" y="175" width="118" height="30" rx="15"/><text class="tagt" x="935" y="195" text-anchor="middle">写出 t500</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">一段回答要转很多圈；朴素做法每一圈都在重复处理没变过的历史。</text>
</svg>
