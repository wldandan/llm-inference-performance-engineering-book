  <g transform="translate(652 146)"><rect class="card" width="572" height="470" rx="22"/><text class="h" x="28" y="42">答题 · 1000 个 token 一个一个写</text><text class="s" x="28" y="68">后一个依赖前一个，只能串行</text><rect x="56" y="92" width="460" height="58" rx="14" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.7"/><text class="h" x="286" y="127" text-anchor="middle">权重 · 约 1 GB</text><path class="thin" d="M79 150V222"/><path d="M79 222l-5 -8h10z" fill="#334155"/><rect x="66" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="79" y="248" text-anchor="middle" fill="#FFFFFF">1</text><path class="thin" d="M119 150V222"/><path d="M119 222l-5 -8h10z" fill="#334155"/><rect x="106" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="119" y="248" text-anchor="middle" fill="#FFFFFF">2</text><path class="thin" d="M159 150V222"/><path d="M159 222l-5 -8h10z" fill="#334155"/><rect x="146" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="159" y="248" text-anchor="middle" fill="#FFFFFF">3</text><path class="thin" d="M199 150V222"/><path d="M199 222l-5 -8h10z" fill="#334155"/><rect x="186" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="199" y="248" text-anchor="middle" fill="#FFFFFF">4</text><path class="thin" d="M239 150V222"/><path d="M239 222l-5 -8h10z" fill="#334155"/><rect x="226" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="239" y="248" text-anchor="middle" fill="#FFFFFF">5</text><path class="thin" d="M279 150V222"/><path d="M279 222l-5 -8h10z" fill="#334155"/><rect x="266" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="279" y="248" text-anchor="middle" fill="#FFFFFF">6</text><path class="thin" d="M319 150V222"/><path d="M319 222l-5 -8h10z" fill="#334155"/><rect x="306" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="319" y="248" text-anchor="middle" fill="#FFFFFF">7</text><path class="thin" d="M359 150V222"/><path d="M359 222l-5 -8h10z" fill="#334155"/><rect x="346" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="359" y="248" text-anchor="middle" fill="#FFFFFF">8</text><path class="thin" d="M399 150V222"/><path d="M399 222l-5 -8h10z" fill="#334155"/><rect x="386" y="228" width="26" height="30" rx="6" fill="#0F172A"/><text class="tw" x="399" y="248" text-anchor="middle" fill="#FFFFFF">9</text><text class="lbl" x="439" y="252" text-anchor="middle" fill="#64748B">…</text><path class="thin" d="M484 150V222"/><path d="M484 222l-5 -8h10z" fill="#334155"/><rect x="460" y="228" width="48" height="30" rx="6" fill="#0F172A"/><text class="tw" x="484" y="248" text-anchor="middle" fill="#FFFFFF">1000</text><text class="s" x="286" y="290" text-anchor="middle">每写 1 个 token：整份权重搬 1 遍，只算新的这 1 个（历史不再重算）</text><rect class="warn" x="76" y="310" width="420" height="40" rx="20"/><text class="warnt" x="286" y="336" text-anchor="middle">Qwen2.5-0.5B 单个请求：0.98 GB × 1000 ≈ 980 GB</text><rect class="tag" x="56" y="374" width="214" height="40" rx="20"/><text class="tagt" x="163" y="400" text-anchor="middle">搬运 1000 次</text><rect class="tag" x="302" y="374" width="214" height="40" rx="20"/><text class="tagt" x="409" y="400" text-anchor="middle">每次计算量小</text><text class="big" x="286" y="448" text-anchor="middle">累在搬</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">读题累在算，答题累在搬：同样一个 token，写出来占用的机器时间远多于读进去。</text>
</svg>
