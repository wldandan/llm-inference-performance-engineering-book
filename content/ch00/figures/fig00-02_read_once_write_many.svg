<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter00-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 0-2 读题搬一次，答题搬 N 次</title><desc id="fig-desc">左右对比同一份约 1 GB 的权重：读 1000 个 token 的输入时权重搬运一次、一次计算大量 token；写 1000 个 token 的回答时每写一个 token 就搬运一次权重、每次只计算一个 token，以 Qwen2.5-0.5B 为例约搬运 980 GB。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.thin{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.loop{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.axis{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:1.8;stroke-dasharray:7 6}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.warn{fill:#FED7AA}.warnt{font-size:14px;font-weight:700;fill:#0F172A}.lbl{font-size:15px;font-weight:700}.tw{font-size:14px;font-weight:700;fill:#FFFFFF}.big{font-size:22px;font-weight:750}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}.sep{fill:none;stroke:#E2E8F0;stroke-width:1.5}.dv{font-size:15px;fill:#334155}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">READ VS WRITE · 02</text><text class="t" x="56" y="84">读题搬一次，答题搬 N 次</text><text class="sub" x="56" y="114">同一份权重，两段工作的搬运次数和每次的计算量正好相反</text>
