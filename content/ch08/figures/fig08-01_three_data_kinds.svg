  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">THREE DATA KINDS · 08</text><text class="t" x="56" y="86">三种数据各自能回答什么</text><text class="sub" x="56" y="116">搞混了就会拿错工具：只看日志把个例当普遍，只看指标永远停在“确实慢了”</text>
  <rect class="card" x="72" y="172" width="356" height="282" rx="16"/>
  <text class="h" x="96" y="210">指标 Metrics</text>
  <text class="s" x="96" y="238">按时间聚合的数值</text>
  <path d="M84 256H416" class="divider"/>
  <text class="b" x="96" y="286">擅长回答</text>
  <text class="good" x="96" y="314">· 现在是否异常</text>
  <text class="good" x="96" y="340">· 趋势如何</text>
  <text class="good" x="96" y="366">· 容量还剩多少</text>
  <text class="b" x="96" y="396">回答不了</text>
  <text class="bad" x="96" y="424">· 具体是哪条请求</text>
  <text class="bad" x="96" y="450">· 为什么慢</text>
  <rect class="card" x="452" y="172" width="356" height="282" rx="16"/>
  <text class="h" x="476" y="210">日志 Logs</text>
  <text class="s" x="476" y="238">单条事件记录</text>
  <path d="M464 256H796" class="divider"/>
  <text class="b" x="476" y="286">擅长回答</text>
  <text class="good" x="476" y="314">· 这一条发生了什么</text>
  <text class="good" x="476" y="340">· 报了什么错</text>
  <text class="b" x="476" y="396">回答不了</text>
  <text class="bad" x="476" y="424">· 整体趋势</text>
  <text class="bad" x="476" y="450">· 跨组件的先后关系</text>
  <rect class="card" x="832" y="172" width="356" height="282" rx="16"/>
  <text class="h" x="856" y="210">链路 Traces</text>
  <text class="s" x="856" y="238">一次调用跨组件的时间线</text>
  <path d="M844 256H1176" class="divider"/>
  <text class="b" x="856" y="286">擅长回答</text>
  <text class="good" x="856" y="314">· 时间花在哪一段</text>
  <text class="good" x="856" y="340">· 哪个下游拖慢了</text>
  <text class="b" x="856" y="396">回答不了</text>
  <text class="bad" x="856" y="424">· 长期趋势</text>
  <text class="bad" x="856" y="450">· 罕见事件的统计</text>
  <rect class="badfill" x="72" y="476" width="356" height="52" rx="12"/>
  <text class="bad" x="96" y="508">不要把高基数字段放进标签</text>
  <text class="b" x="72" y="570">三者是接力，不是三选一</text>
  <rect class="soft" x="72" y="586" width="300" height="42" rx="6"/>
  <text class="s" x="222.0" y="613" text-anchor="middle">用指标确认问题与范围</text>
  <path class="flow" d="M376 607H408"/>
  <rect class="soft" x="412" y="586" width="360" height="42" rx="6"/>
  <text class="s" x="592.0" y="613" text-anchor="middle">用日志或 Trace 定位具体请求</text>
  <path class="flow" d="M776 607H808"/>
  <rect class="soft" x="812" y="586" width="280" height="42" rx="6"/>
  <text class="s" x="952.0" y="613" text-anchor="middle">回到指标验证修复</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">三者是接力，不是三选一。</text>
