<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 8-4 客户端与服务端的差值要拆，不要命名</title><desc id="fig-desc">客户端一次 9.48 秒的操作对应服务端三条请求（两条 cancelled、一条 480 ms 成功），9.00 秒的差值拆成两次取消尝试 6.0 秒与两次退避 3.0 秒，余下为零。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CLIENT VS SERVER · 08</text><text class="t" x="56" y="86">客户端与服务端的差值要拆，不要命名</text><text class="sub" x="56" y="116">差值不是一个待命名的数，是一个待拆的数</text>
  <text class="b" x="72" y="190">客户端一次操作</text>
  <text class="mb" x="72" y="216">9.48 s</text>
  <rect class="badfill" x="200.0" y="236" width="281.25" height="48" rx="6"/>
  <text class="s" x="340.625" y="266" text-anchor="middle">尝试 1 · 被取消</text>
  <rect class="warnfill" x="481.25" y="236" width="93.75" height="48" rx="6"/>
  <text class="s" x="528.125" y="266" text-anchor="middle">退避</text>
  <rect class="badfill" x="575.0" y="236" width="281.2500000000001" height="48" rx="6"/>
  <text class="s" x="715.625" y="266" text-anchor="middle">尝试 2 · 被取消</text>
  <rect class="warnfill" x="856.2500000000001" y="236" width="187.4999999999999" height="48" rx="6"/>
  <text class="s" x="950.0" y="266" text-anchor="middle">退避</text>
  <rect class="goodfill" x="1043.75" y="236" width="45.0" height="48" rx="6"/>
  <text class="s" x="1066.25" y="310" text-anchor="middle">尝试 3</text>
  <text class="s" x="1066.25" y="332" text-anchor="middle">成功 480 ms</text>
  <path d="M200 352H1100" stroke="#94A3B8" stroke-width="1.4" fill="none"/>
  <path d="M200.0 352V358" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="200.0" y="374" text-anchor="middle">0 s</text>
  <path d="M481.25 352V358" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="481.25" y="374" text-anchor="middle">3 s</text>
  <path d="M762.5 352V358" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="762.5" y="374" text-anchor="middle">6 s</text>
  <path d="M1043.75 352V358" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="1043.75" y="374" text-anchor="middle">9 s</text>
  <text class="b" x="72" y="412">服务端记录</text>
  <text class="s" x="72" y="438">三条</text>
  <rect class="badfill" x="200.0" y="400" width="281.25" height="44" rx="6"/>
  <text class="s" x="340.625" y="428" text-anchor="middle">cancelled</text>
  <rect class="badfill" x="575.0" y="400" width="281.2500000000001" height="44" rx="6"/>
  <text class="s" x="715.625" y="428" text-anchor="middle">cancelled</text>
  <rect class="goodfill" x="1043.75" y="400" width="45.0" height="44" rx="6"/>
  <text class="s" x="1066.25" y="466" text-anchor="middle">finished</text>
  <text class="s" x="206.0" y="466">按“成功返回耗时”筛日志，只有最右边那条会出现</text>
  <rect class="card" x="72" y="482" width="1136" height="124" rx="16"/>
  <text class="b" x="96" y="518">差值 9.00 s 拆开</text>
  <rect class="badfill" x="300" y="498" width="290" height="92" rx="12"/>
  <text class="b" x="316" y="528">两次被取消的尝试</text>
  <text class="m" x="316" y="556">3.0 + 3.0 = 6.0 s</text>
  <text class="s" x="316" y="580">服务端有记录，终态是 cancelled</text>
  <rect class="warnfill" x="604" y="498" width="290" height="92" rx="12"/>
  <text class="b" x="620" y="528">两次退避等待</text>
  <text class="m" x="620" y="556">1.0 + 2.0 = 3.0 s</text>
  <text class="s" x="620" y="580">只有客户端有记录</text>
  <rect class="goodfill" x="908" y="498" width="290" height="92" rx="12"/>
  <text class="b" x="924" y="528">余下</text>
  <text class="m" x="924" y="556">0 s</text>
  <text class="s" x="924" y="580">拆完一分不剩，痕迹是齐的</text>
  <text class="m" x="96" y="552">客户端 9.48 s</text>
  <text class="m" x="96" y="578">服务端 0.48 s</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">拆不完时剩下的写未归因，不写网络耗时。</text>
</svg>
