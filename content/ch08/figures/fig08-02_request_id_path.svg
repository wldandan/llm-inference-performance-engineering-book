<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 8-2 一个 ID 要出现在哪五个地方</title><desc id="fig-desc">客户端生成 ID 经请求头传给服务端、服务端沿用并在响应头回带；这个 ID 要出现在客户端记录、入口日志、请求级指标、错误日志与 Trace 里对应的 Span 五处，唯独不能进指标标签。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">REQUEST ID · 08</text><text class="t" x="56" y="86">一个 ID 要出现在哪五个地方</text><text class="sub" x="56" y="116">三种数据要能互相走通，前提是它们记的是同一条请求</text>
  <rect class="card" x="72" y="196" width="300" height="168" rx="16"/>
  <text class="h" x="222" y="236" text-anchor="middle">客户端</text>
  <text class="m" x="222" y="272" text-anchor="middle">生成 req-8a3f</text>
  <text class="s" x="222" y="304" text-anchor="middle">记录它</text>
  <text class="s" x="222" y="336" text-anchor="middle">投诉时能直接报出来</text>
  <rect class="card" x="756" y="196" width="300" height="168" rx="16"/>
  <text class="h" x="906" y="236" text-anchor="middle">服务端</text>
  <text class="s" x="906" y="272" text-anchor="middle">读到就沿用</text>
  <text class="s" x="906" y="304" text-anchor="middle">读不到才自己生成</text>
  <text class="s" x="906" y="336" text-anchor="middle">并校验格式与重复</text>
  <path class="flow" d="M372 248H748"/>
  <text class="m" x="560" y="232" text-anchor="middle">请求头带 req-8a3f</text>
  <path class="flow" d="M756 316H376"/>
  <text class="m" x="560" y="300" text-anchor="middle">响应头回带同一个 ID</text>
  <text class="b" x="72" y="420">这个 ID 要出现在五个地方</text>
  <rect class="goodfill" x="72" y="442" width="212" height="62" rx="14"/>
  <text class="s" x="178" y="480" text-anchor="middle">客户端调用记录</text>
  <rect class="goodfill" x="304" y="442" width="212" height="62" rx="14"/>
  <text class="s" x="410" y="480" text-anchor="middle">服务端入口日志</text>
  <rect class="goodfill" x="536" y="442" width="212" height="62" rx="14"/>
  <text class="s" x="642" y="480" text-anchor="middle">引擎请求级指标</text>
  <rect class="goodfill" x="768" y="442" width="212" height="62" rx="14"/>
  <text class="s" x="874" y="480" text-anchor="middle">出错时的错误日志</text>
  <rect class="goodfill" x="1000" y="442" width="212" height="62" rx="14"/>
  <text class="s" x="1106" y="480" text-anchor="middle">Trace 里对应的 Span</text>
  <rect class="badfill" x="72" y="528" width="668" height="76" rx="14"/>
  <text class="bad" x="96" y="562">第六个地方：指标标签</text>
  <text class="s" x="96" y="590">不要放。每条请求一条新时间序列，监控系统会被打垮</text>
  <rect class="soft" x="764" y="528" width="444" height="78" rx="14"/>
  <text class="s" x="782" y="558">判据：会不会出现“没有响应但需要追踪”</text>
  <text class="s" x="782" y="584">会就客户端生成，不会就服务端生成</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">客户端必须最终拿到并记下这个 ID，否则投诉时无从查起。</text>
</svg>
