    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">TRACE TREE · 08</text><text class="t" x="56" y="86">一次 RAG 调用的 Trace 树</text><text class="sub" x="56" y="116">慢不在检索，也不在模型计算，而在排队</text>
  <text class="mb" x="72" y="186">Trace: rag-query-7c2e</text>
  <text class="m" x="96" y="242">assemble-prompt</text>
  <rect class="soft" x="360.0" y="222" width="3.1666666666666665" height="30" rx="6"/>
  <text class="m" x="375.1666666666667" y="243">10 ms</text>
  <text class="m" x="96" y="288">retrieve</text>
  <rect class="coolfill" x="363.1666666666667" y="268" width="57.0" height="30" rx="6"/>
  <text class="m" x="432.1666666666667" y="289">180 ms</text>
  <text class="m" x="96" y="334">rerank</text>
  <rect class="coolfill" x="420.1666666666667" y="314" width="28.5" height="30" rx="6"/>
  <text class="m" x="460.6666666666667" y="335">90 ms</text>
  <text class="m" x="96" y="380">llm-call</text>
  <rect class="coolfill" x="448.6666666666667" y="360" width="671.3333333333333" height="30" rx="6"/>
  <text class="m" x="1132.0" y="381">2120 ms</text>
  <text class="m" x="124" y="426">queue</text>
  <rect class="badfill" x="448.6666666666667" y="406" width="285.0" height="30" rx="6"/>
  <text class="m" x="745.6666666666667" y="427">900 ms</text>
  <text class="bad" x="591.1666666666667" y="427" text-anchor="middle">时间在这</text>
  <text class="m" x="124" y="472">scheduled-to-first-token</text>
  <rect class="coolfill" x="733.6666666666666" y="452" width="44.333333333333336" height="30" rx="6"/>
  <text class="m" x="790.0" y="473">140 ms</text>
  <text class="m" x="124" y="518">generation</text>
  <rect class="coolfill" x="778.0" y="498" width="342.0" height="30" rx="6"/>
  <text class="m" x="1132.0" y="519">1080 ms</text>
  <path class="bracket" d="M360 202H1120"/>
  <path class="bracket" d="M360 202V210"/>
  <path class="bracket" d="M1120 202V210"/>
  <text class="b" x="740.0" y="196" text-anchor="middle">总计 2400 ms</text>
  <rect class="soft" x="72" y="546" width="1136" height="78" rx="14"/>
  <text class="s" x="90" y="576">只看总时长 2400 ms 得不出“在排队”这个结论；只看 LLM 服务的指标也得不出来，因为那里看不到检索和重排</text>
  <text class="s" x="90" y="602">span 的边界同样取决于埋点位置：Trace 让时间线直观，不会自动让边界可信</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">只看总时长 2400 ms 得不出“在排队”这个结论。</text>
