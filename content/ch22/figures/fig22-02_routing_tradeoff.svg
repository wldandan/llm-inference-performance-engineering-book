<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">缓存命中率和负载均衡是互相冲突的两个目标</title><desc id="fig-desc">一张散点图，横轴是缓存命中率，纵轴是负载不均衡度，纵轴上两条虚线标出 0.3 和 0.5 两条经验界。轮询落在左下角：命中率 29.6%、不均衡度接近 0。纯前缀哈希落在右上角：命中率 88.8%、不均衡度 0.94，已越过 0.5。带溢出的前缀哈希落在右下角：命中率 79.9%、不均衡度 0.20。右侧三块列出各自的代价，包括纯前缀哈希那一版的最差实例比整体 P95 高 440 毫秒。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 22 章 · 22.4、22.5、22.7</text><text class="t" x="56" y="86">追求均衡就打散缓存，追求命中就容易出热点</text><text class="sub" x="56" y="116">所以带溢出的那一种才是实际可用的形态，溢出阈值就在这两个数之间定位置</text>
  <rect class="card" x="72" y="176" width="700" height="396" rx="16"/>
  <text class="b" x="96" y="208">三种路由策略在同一条链路上的两个数（合成评估）</text>
  <path d="M176 250V466H700" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <path class="rule" fill="none" d="M176 401.2L700 401.2"/>
  <text class="s" x="696" y="393.2" text-anchor="end">0.3 以下感觉不到</text>
  <path class="rule" fill="none" d="M176 358.0L700 358.0"/>
  <text class="s" x="696" y="350.0" text-anchor="end">0.5 以上最慢的实例决定 P99</text>
  <circle cx="331" cy="466" r="9" fill="#1D4ED8"/>
  <text class="b" x="347" y="454" text-anchor="start" fill="#1D4ED8">轮询</text>
  <text class="s" x="391" y="454" text-anchor="start">命中率 29.6%，不均衡度 0.00</text>
  <circle cx="641" cy="263" r="9" fill="#B91C1C"/>
  <text class="b" x="625" y="257" text-anchor="end" fill="#B91C1C">纯前缀哈希</text>
  <text class="s" x="625" y="279" text-anchor="end">命中率 88.8%，不均衡度 0.94</text>
  <circle cx="595" cy="422" r="9" fill="#0F766E"/>
  <text class="b" x="579" y="418" text-anchor="end" fill="#0F766E">带溢出的前缀哈希</text>
  <text class="s" x="579" y="437" text-anchor="end">命中率 79.9%，不均衡度 0.20</text>
  <text class="s" x="307.0" y="492" text-anchor="middle">25%</text>
  <text class="s" x="438.0" y="492" text-anchor="middle">50%</text>
  <text class="s" x="569.0" y="492" text-anchor="middle">75%</text>
  <text class="s" x="700.0" y="492" text-anchor="middle">100%</text>
  <text class="s" x="92" y="492">缓存命中率</text>
  <text class="b" x="120" y="240">负载不均衡度</text>
  <text class="s" x="96" y="520">右下角是两边都好，左上角是两边都差；这两个目标互相冲突，所以取舍点在中间</text>
  <rect class="card" x="796" y="176" width="412" height="396" rx="16"/>
  <text class="b" x="820" y="208">三种形态各自的代价</text>
  <rect class="coolfill" x="812" y="228" width="380" height="96" rx="12"/>
  <text class="mb" x="832" y="260">round-robin</text>
  <text class="s" x="832" y="286">会话前缀被打散，缓存又装不下</text>
  <text class="s" x="832" y="310">整体 P95 TTFT 1250 ms，最差实例 1290 ms</text>
  <rect class="badfill" x="812" y="340" width="380" height="96" rx="12"/>
  <text class="mb" x="832" y="372">prefix-hash</text>
  <text class="s" x="832" y="398">热点：最差实例 P95 比整体高出 440 ms</text>
  <text class="s" x="832" y="422">整体 P95 TTFT 980 ms，最差实例 1420 ms</text>
  <rect class="goodfill" x="812" y="452" width="380" height="96" rx="12"/>
  <text class="mb" x="832" y="484">prefix-hash-with-overflow</text>
  <text class="s" x="832" y="510">两边都在可接受区间</text>
  <text class="s" x="832" y="534">整体 P95 TTFT 680 ms，最差实例 740 ms</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">实际可用的是prefix-hash-with-overflow：在不均衡度还感觉不到的策略里，它的命中率最高。数据是合成评估，不是真机结果。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">聚合指标会掩盖单实例问题，所以整体和最差实例两个数必须一起报</text>
</svg>
