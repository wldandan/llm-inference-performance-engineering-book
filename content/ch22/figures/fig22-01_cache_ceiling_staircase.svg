<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">扩容本身就在削会话级前缀的缓存</title><desc id="fig-desc">一张分组柱状图，横轴是实例数 1、2、4、8、16，每组两根柱子分别是会话级前缀复用 2 次和 10 次时，轮询路由下的路由项。复用 2 次时依次是 50%、25%、12.5%、6%、3%；复用 10 次时是 90%、80%、62%、41%、24%。顶部虚线是全体共享前缀的情形，接近 100%。右侧列出第 13.3 节的命中率式子和路由项式子，并说明缓存装不下时路由项会往 1/N 掉。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 22 章 · 22.4</text><text class="t" x="56" y="86">多副本部署里一笔不写出来就不会有人算的账</text><text class="sub" x="56" y="116">会话级前缀被轮询打散，每个碰到它的实例都要先付一次写入</text>
  <rect class="card" x="72" y="176" width="720" height="396" rx="16"/>
  <text class="b" x="96" y="208">会话级前缀被轮询打散时的路由项（缓存装得下时）</text>
  <path class="rule" fill="none" d="M136 280L768 280"/>
  <text class="s" x="130" y="285" text-anchor="end">100%</text>
  <text class="good" x="152" y="270">全体共享的前缀（同一段 system prompt）：每个实例各存一份，接近 100%</text>
  <rect x="152" y="388" width="44" height="108" rx="6" fill="#B91C1C" opacity="0.18" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="s" x="174" y="380" text-anchor="middle" fill="#B91C1C">50%</text>
  <rect x="202" y="302" width="44" height="194" rx="6" fill="#B45309" opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="224" y="294" text-anchor="middle" fill="#B45309">90%</text>
  <text class="b" x="199" y="522" text-anchor="middle">1 个实例</text>
  <rect x="272" y="442" width="44" height="54" rx="6" fill="#B91C1C" opacity="0.18" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="s" x="294" y="434" text-anchor="middle" fill="#B91C1C">25%</text>
  <rect x="322" y="323" width="44" height="173" rx="6" fill="#B45309" opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="344" y="315" text-anchor="middle" fill="#B45309">80%</text>
  <text class="b" x="319" y="522" text-anchor="middle">2 个</text>
  <rect x="392" y="469" width="44" height="27" rx="6" fill="#B91C1C" opacity="0.18" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="s" x="414" y="461" text-anchor="middle" fill="#B91C1C">12.5%</text>
  <rect x="442" y="362" width="44" height="134" rx="6" fill="#B45309" opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="464" y="354" text-anchor="middle" fill="#B45309">62%</text>
  <text class="b" x="439" y="522" text-anchor="middle">4 个</text>
  <rect x="512" y="482" width="44" height="14" rx="6" fill="#B91C1C" opacity="0.18" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="s" x="534" y="474" text-anchor="middle" fill="#B91C1C">6.3%</text>
  <rect x="562" y="407" width="44" height="89" rx="6" fill="#B45309" opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="584" y="399" text-anchor="middle" fill="#B45309">41%</text>
  <text class="b" x="559" y="522" text-anchor="middle">8 个</text>
  <rect x="632" y="489" width="44" height="7" rx="6" fill="#B91C1C" opacity="0.18" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="s" x="654" y="481" text-anchor="middle" fill="#B91C1C">3.1%</text>
  <rect x="682" y="444" width="44" height="52" rx="6" fill="#B45309" opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
  <text class="s" x="704" y="436" text-anchor="middle" fill="#B45309">24%</text>
  <text class="b" x="679" y="522" text-anchor="middle">16 个</text>
  <path d="M136 496H768" stroke="#94A3B8" stroke-width="1.6"/>
  <rect x="176" y="540" width="18" height="14" rx="3" fill="#B91C1C" opacity="0.25" stroke="#B91C1C"/>
  <text class="s" x="202" y="552">复用 2 次（k = 2）</text>
  <rect x="406" y="540" width="18" height="14" rx="3" fill="#B45309" opacity="0.25" stroke="#B45309"/>
  <text class="s" x="432" y="552">复用 10 次（k = 10）</text>
  <rect class="card" x="816" y="176" width="392" height="396" rx="16"/>
  <text class="b" x="840" y="208">这一刀出自第 13.3 节那个式子</text>
  <rect class="coolfill" x="832" y="228" width="344" height="78" rx="14"/>
  <text class="s" x="850" y="258">命中率 ≈ 可缓存占比 × 局部性</text>
  <text class="s" x="850" y="284">        × 未被淘汰 × 路由项</text>
  <rect class="soft" x="832" y="312" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="342">路由项 ≈ 1 − N(1 − (1 − 1/N)^k)/k</text>
  <text class="s" x="850" y="368">k 是一个前缀被复用的次数，</text>
  <text class="s" x="850" y="394">每个被碰到的实例都先付一次写入</text>
  <rect class="warnfill" x="832" y="424" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="454">缓存装不下时更糟：轮询让每个实例</text>
  <text class="s" x="850" y="480">都替全部会话存一份，前缀没等到</text>
  <text class="s" x="850" y="506">复用就被挤出去，往 1/N 掉</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">这是缓存装得下时的路由项，乘上可缓存占比才是命中率上限。复用少时副本数翻倍、路由项约减半，TTFT 可能不降反升，22.8 案例二就是这个形状。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">会话级前缀复用少时，副本数翻倍、命中率大约减半；全体共享的前缀不受影响</text>
</svg>
