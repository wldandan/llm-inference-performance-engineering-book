<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">每一次都在阈值下面，累积起来不在</title><desc id="fig-desc">上半部分是五根柱子，分别是 5%、4%、6%、5%、4% 的单次退化，一条虚线画在门禁阈值 8% 处，五根都在线下，所以门禁一次都不会响。下半部分是累积曲线，横轴是改动次数 0 到 13，纵轴是累积倍数 1.0 到 2.2，第 5 次落在 1.26 倍，第 13 次落在 1.89 倍，一条虚线标出翻倍线。右上一块讲那条 8% 的线怎么定：变异系数 9% 时 5% 的阈值没法用，压到 2.6% 之后 8% 稳定可用，单指标误报约 1.5%，两边各跑 3 轮时 10% 的回归约 83% 被拦住。右下一块强调 1.26 倍和 1.89 倍是两个数，前者的结论是门禁不会响，后者的结论是系统慢了将近一倍。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 28 章 · 28.1、28.3、28.8</text><text class="t" x="56" y="86">门禁拦的是单次，用户感受到的是累积</text><text class="sub" x="56" y="116">5% 每次要 14.2 次才翻倍，两周一次的发布半年就有十三次</text>
  <rect class="card" x="56" y="158" width="744" height="416" rx="16"/>
  <text class="b" x="80" y="190">每次改动的退化幅度，和它们的累积（合成设定）</text>
  <path d="M128 300V494H768" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M122 461.7H128" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="114" y="466.6666666666667" text-anchor="end">1.2×</text>
  <path d="M122 429.3H128" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="114" y="434.33333333333337" text-anchor="end">1.4×</text>
  <path d="M122 397.0H128" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="114" y="402.0" text-anchor="end">1.6×</text>
  <path d="M122 364.7H128" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="114" y="369.66666666666663" text-anchor="end">1.8×</text>
  <path d="M122 332.3H128" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="s" x="114" y="337.3333333333333" text-anchor="end">2.0×</text>
  <text class="s" x="374.1538461538462" y="520" text-anchor="middle">第 5 次</text>
  <text class="s" x="620.3076923076924" y="520" text-anchor="middle">第 10 次</text>
  <text class="s" x="768.0" y="520" text-anchor="middle">第 13 次</text>
  <path class="rule" fill="none" d="M128 332.3333333333333L768 332.3333333333333"/>
  <text class="b" x="138.0" y="322.3" fill="#B91C1C">翻倍线</text>
  <path d="M128.0 494.0L177.2 485.9L226.5 477.4L275.7 468.5L324.9 459.2L374.2 449.3L423.4 439.0L472.6 428.2L521.8 416.8L571.1 404.9L620.3 392.3L669.5 379.2L718.8 365.3L768.0 350.8" fill="none" stroke="#1D4ED8" stroke-width="2.6"/>
  <circle cx="374.2" cy="451.3" r="7" fill="#B45309"/>
  <text class="b" x="388.2" y="479.3" fill="#B45309">5 次 = 1.26 倍</text>
  <circle cx="768.0" cy="350.8" r="7" fill="#B91C1C"/>
  <text class="b" x="768.0" y="322.3" text-anchor="end" fill="#B91C1C">13 次 = 1.89 倍</text>
  <text class="b" x="80" y="234">门禁阈值 8%</text>
  <path class="rule" fill="none" d="M128 246L480 246"/>
  <rect x="152" y="256.5" width="30" height="17.5" rx="4" fill="#0F766E" opacity="0.45"/>
  <text class="s" x="167" y="292" text-anchor="middle">5%</text>
  <rect x="212" y="260.0" width="30" height="14.0" rx="4" fill="#0F766E" opacity="0.45"/>
  <text class="s" x="227" y="292" text-anchor="middle">4%</text>
  <rect x="272" y="253.0" width="30" height="21.0" rx="4" fill="#0F766E" opacity="0.45"/>
  <text class="s" x="287" y="292" text-anchor="middle">6%</text>
  <rect x="332" y="256.5" width="30" height="17.5" rx="4" fill="#0F766E" opacity="0.45"/>
  <text class="s" x="347" y="292" text-anchor="middle">5%</text>
  <rect x="392" y="260.0" width="30" height="14.0" rx="4" fill="#0F766E" opacity="0.45"/>
  <text class="s" x="407" y="292" text-anchor="middle">4%</text>
  <text class="b" x="500" y="252" fill="#0F766E">五次都在阈值下面，门禁一次都不会响</text>
  <text class="s" x="500" y="276">而它们连乘起来已经是 1.26 倍</text>
  <rect class="card" x="824" y="158" width="400" height="220" rx="16"/>
  <text class="h" x="848" y="190">那条 8% 的线是怎么定的</text>
  <text class="s" x="848" y="222">28.3：阈值不能低于可识别线（各 3 轮约 2.3 × CV）</text>
  <text class="b" x="848" y="256" fill="#B91C1C">变异系数 9%：5% 的阈值没法用</text>
  <text class="b" x="848" y="292" fill="#0F766E">压到 2.6% 之后：8% 稳定可用</text>
  <text class="s" x="848" y="318">推荐 8%，单指标误报约 1.5%</text>
  <text class="s" x="848" y="344">各跑 3 轮时 10% 回归检出约 83%</text>
  <rect class="warnfill" x="824" y="398" width="400" height="176" rx="16"/>
  <text class="h" x="848" y="430">两个数不能混</text>
  <text class="b" x="848" y="462">五步连乘 = 1.26 倍</text>
  <text class="s" x="848" y="488">结论是“门禁一次都不会响”</text>
  <text class="b" x="848" y="520">半年十三次连乘 = 1.89 倍</text>
  <text class="s" x="848" y="546">结论是“系统慢了将近一倍”</text>
  <rect class="soft" x="56" y="588" width="1168" height="52" rx="14"/>
  <text class="s" x="74" y="618">每次 5% 要 14.2 次翻倍，每次 8% 只要 9.0 次。门禁拦的是单次，而用户感受到的是累积，所以基线要固定：相对阈值对着那份冻结的基线算，绝对阈值另外兜住 SLO。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">五步连乘是 1.26 倍，半年十三步是 1.89 倍：这两个数不能混用</text>
</svg>
