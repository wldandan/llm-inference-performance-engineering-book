<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">检索不准的代价比按 token 数线性推算出来的更贵</title><desc id="fig-desc">一张折线图，横轴是上下文 token 从 3000 到 12000，纵轴是相对 3000 token 的 Prefill 代价。虚线是按 token 数线性推算的参考线，实线是第 11 章那个模型算出来的真实代价，两条线在 9000 token 处分开：线性推算是 3.0 倍，实际是 3.92 倍。右侧把它换算成 TTFT：3000 token 对应 600 毫秒，9000 token 对应 2350 毫秒，以及重排能省下的净收益区间。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 23 章 · 23.3</text><text class="t" x="56" y="86">token 是三倍，TTFT 却将近四倍</text><text class="sub" x="56" y="116">多出来的那部分是第 11 章那个 Attention 平方项</text>
  <rect class="card" x="72" y="176" width="728" height="396" rx="16"/>
  <text class="b" x="96" y="208">上下文长度与 Prefill 代价：两条线不重合</text>
  <path d="M176 250V466H744" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <path class="divider" fill="none" d="M176 431.16129032258067L744 431.16129032258067"/>
  <text class="s" x="166" y="436.16129032258067" text-anchor="end">1×</text>
  <path class="divider" fill="none" d="M176 396.3225806451613L744 396.3225806451613"/>
  <text class="s" x="166" y="401.3225806451613" text-anchor="end">2×</text>
  <path class="divider" fill="none" d="M176 361.48387096774195L744 361.48387096774195"/>
  <text class="s" x="166" y="366.48387096774195" text-anchor="end">3×</text>
  <path class="divider" fill="none" d="M176 326.64516129032256L744 326.64516129032256"/>
  <text class="s" x="166" y="331.64516129032256" text-anchor="end">4×</text>
  <path class="divider" fill="none" d="M176 291.80645161290323L744 291.80645161290323"/>
  <text class="s" x="166" y="296.80645161290323" text-anchor="end">5×</text>
  <path class="divider" fill="none" d="M176 256.9677419354839L744 256.9677419354839"/>
  <text class="s" x="166" y="261.9677419354839" text-anchor="end">6×</text>
  <polyline points="318,431 330,428 342,425 354,422 365,420 377,417 389,414 401,411 413,408 424,405 436,402 448,399 460,396 472,393 484,391 496,388 507,385 519,382 531,379 543,376 555,373 566,370 578,367 590,364 602,361 614,359 626,356 638,353 649,350 661,347 673,344 685,341 697,338 708,335 720,332 732,330 744,327" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polyline points="318,431 330,428 342,424 354,421 365,417 377,414 389,410 401,406 413,402 424,398 436,394 448,390 460,386 472,381 484,377 496,373 507,368 519,364 531,359 543,354 555,349 566,345 578,340 590,335 602,330 614,324 626,319 638,314 649,308 661,303 673,298 685,292 697,286 708,280 720,275 732,269 744,263" fill="none" stroke="#B91C1C" stroke-width="3.2"/>
  <circle cx="318" cy="431" r="6.5" fill="#0F766E"/>
  <circle cx="602" cy="330" r="6.5" fill="#B91C1C"/>
  <circle cx="602" cy="361" r="5" fill="#94A3B8"/>
  <text class="b" x="586.0" y="319.55429998029035" text-anchor="end">实际 3.92 倍</text>
  <text class="s" x="616.0" y="367.48387096774195">按 token 线性推 3.0 倍</text>
  <text class="good" x="332.0" y="455.16129032258067">基准 3000 token</text>
  <text class="s" x="318.0" y="492" text-anchor="middle">3k</text>
  <text class="s" x="460.0" y="492" text-anchor="middle">6k</text>
  <text class="s" x="602.0" y="492" text-anchor="middle">9k</text>
  <text class="s" x="744.0" y="492" text-anchor="middle">12k</text>
  <text class="s" x="96" y="492">上下文 token</text>
  <text class="b" x="120" y="240">Prefill 代价（相对 3000 token）</text>
  <text class="b" x="96" y="526">差额来自 Attention 那个平方项：Attention 占 Prefill 计算量的比例从 15% 涨到 35%</text>
  <rect class="card" x="824" y="176" width="384" height="396" rx="16"/>
  <text class="b" x="848" y="208">换成 TTFT 就是这一对</text>
  <rect class="goodfill" x="840" y="228" width="344" height="104" rx="14"/>
  <text class="s" x="858" y="258">检索准确  Top-5 就够</text>
  <text class="s" x="858" y="284">prompt 3000 token</text>
  <text class="s" x="858" y="310">TTFT 600 ms</text>
  <rect class="badfill" x="840" y="346" width="344" height="104" rx="14"/>
  <text class="s" x="858" y="376">检索不准  要 Top-15</text>
  <text class="s" x="858" y="402">prompt 9000 token</text>
  <text class="s" x="858" y="428">TTFT 2350 ms</text>
  <rect class="coolfill" x="840" y="464" width="344" height="104" rx="14"/>
  <text class="s" x="858" y="494">省下的 TTFT 1750 ms</text>
  <text class="s" x="858" y="520">重排代价最多 300 ms</text>
  <text class="s" x="858" y="546">净收益 1450 到 1700 ms</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">提升检索质量是收益最大的那一类优化：它同时降低 TTFT、token 成本和显存占用，还提升回答质量。幅度要实测，因为它取决于你的 Attention 占比落在哪一段。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">提升检索质量同时降低 TTFT、token 成本和显存占用，没有任何一边要付出代价</text>
</svg>
