<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">一次 RAG 调用的时间去了哪</title><desc id="fig-desc">上方是一条按比例分段的横条，依次是查询改写、向量化、向量检索、重排、prompt 拼装、生成 TTFT、生成剩余七段，每段标出耗时和占比，短的几段用引线引出。下方左边是冷热对照表：向量检索冷起来是热的 3.58 倍，而端到端只慢 6.6%。下方右边列出查询改写和重排这两处最容易被低估的地方。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 23 章 · 23.1、23.2、23.7</text><text class="t" x="56" y="86">模型生成只是最后一段</text><text class="sub" x="56" y="116">不知道时间花在哪，优化只能凭猜；所以 RAG 性能工程第一步不是优化，是分解</text>
  <rect class="card" x="72" y="176" width="1136" height="260" rx="16"/>
  <text class="b" x="96" y="208">一次热查询的逐段耗时（合成 trace）</text>
  <rect x="96.0" y="240" width="49.7" height="52" rx="6" fill="#B45309" opacity="0.22" stroke="#B45309" stroke-width="1.6"/>
  <rect x="148.7" y="240" width="4.3" height="52" rx="6" fill="#94A3B8" opacity="0.22" stroke="#94A3B8" stroke-width="1.6"/>
  <rect x="156.1" y="240" width="24.8" height="52" rx="6" fill="#1D4ED8" opacity="0.22" stroke="#1D4ED8" stroke-width="1.6"/>
  <rect x="183.9" y="240" width="58.5" height="52" rx="6" fill="#B45309" opacity="0.22" stroke="#B45309" stroke-width="1.6"/>
  <rect x="245.4" y="240" width="2.0" height="52" rx="6" fill="#94A3B8" opacity="0.22" stroke="#94A3B8" stroke-width="1.6"/>
  <rect x="246.6" y="240" width="407.1" height="52" rx="6" fill="#B91C1C" opacity="0.22" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="b" x="452" y="272" text-anchor="middle" fill="#B91C1C">生成 TTFT</text>
  <rect x="656.7" y="240" width="524.3" height="52" rx="6" fill="#0F766E" opacity="0.22" stroke="#0F766E" stroke-width="1.6"/>
  <text class="b" x="920" y="272" text-anchor="middle" fill="#0F766E">生成剩余</text>
  <rect x="96" y="308" width="14" height="14" rx="4" fill="#B45309" opacity="0.28" stroke="#B45309" stroke-width="1.4"/>
  <text class="b" x="118" y="320">查询改写</text>
  <text class="s" x="118" y="344">180 ms  4.9%</text>
  <rect x="251" y="308" width="14" height="14" rx="4" fill="#94A3B8" opacity="0.28" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="b" x="273.42857142857144" y="320">向量化</text>
  <text class="s" x="273.42857142857144" y="344">25 ms  0.7%</text>
  <rect x="407" y="308" width="14" height="14" rx="4" fill="#1D4ED8" opacity="0.28" stroke="#1D4ED8" stroke-width="1.4"/>
  <text class="b" x="428.85714285714283" y="320">向量检索</text>
  <text class="s" x="428.85714285714283" y="344">95 ms  2.6%</text>
  <rect x="562" y="308" width="14" height="14" rx="4" fill="#B45309" opacity="0.28" stroke="#B45309" stroke-width="1.4"/>
  <text class="b" x="584.2857142857142" y="320">重排</text>
  <text class="s" x="584.2857142857142" y="344">210 ms  5.7%</text>
  <rect x="718" y="308" width="14" height="14" rx="4" fill="#94A3B8" opacity="0.28" stroke="#94A3B8" stroke-width="1.4"/>
  <text class="b" x="739.7142857142857" y="320">prompt 拼装</text>
  <text class="s" x="739.7142857142857" y="344">4 ms  0.1%</text>
  <rect x="873" y="308" width="14" height="14" rx="4" fill="#B91C1C" opacity="0.28" stroke="#B91C1C" stroke-width="1.4"/>
  <text class="b" x="895.1428571428571" y="320">生成 TTFT</text>
  <text class="s" x="895.1428571428571" y="344">1400 ms  37.7%</text>
  <rect x="1029" y="308" width="14" height="14" rx="4" fill="#0F766E" opacity="0.28" stroke="#0F766E" stroke-width="1.4"/>
  <text class="b" x="1050.5714285714284" y="320">生成剩余</text>
  <text class="s" x="1050.5714285714284" y="344">1800 ms  48.5%</text>
  <text class="b" x="96" y="408">生成那两段占 86.2%，它之前的部分占 13.8%；这一章关注的正是前面那一小块</text>
  <rect class="card" x="72" y="452" width="552" height="176" rx="16"/>
  <text class="b" x="96" y="484">冷热对照：差距集中在检索这一段</text>
  <text class="b" x="96" y="508">向量检索</text>
  <text class="s" x="224" y="508">热 95 ms</text>
  <text class="s" x="352" y="508">冷 340 ms</text>
  <text class="b" x="480" y="508" fill="#B91C1C">3.58 倍</text>
  <text class="b" x="96" y="540">生成 TTFT</text>
  <text class="s" x="224" y="540">热 1400 ms</text>
  <text class="s" x="352" y="540">冷 1400 ms</text>
  <text class="b" x="480" y="540" fill="#94A3B8">1.00 倍</text>
  <text class="b" x="96" y="572">重排</text>
  <text class="s" x="224" y="572">热 210 ms</text>
  <text class="s" x="352" y="572">冷 210 ms</text>
  <text class="b" x="480" y="572" fill="#94A3B8">1.00 倍</text>
  <text class="b" x="96" y="606">而端到端只慢 6.6%</text>
  <rect class="card" x="656" y="452" width="552" height="176" rx="16"/>
  <text class="b" x="680" y="484">两处最容易被低估的地方</text>
  <rect class="warnfill" x="672" y="500" width="520" height="52" rx="14"/>
  <text class="s" x="690" y="530">查询改写是一次完整的 LLM 调用，有自己的 TTFT 和排队</text>
  <rect class="coolfill" x="672" y="554" width="520" height="52" rx="14"/>
  <text class="s" x="690" y="584">重排的耗时和候选数成正比，这是性价比最高的旋钮之一</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">检索冷起来慢 3.6 倍，端到端只慢 6.6%：占比小的那一段能造成的全部影响就这么多</text>
</svg>
