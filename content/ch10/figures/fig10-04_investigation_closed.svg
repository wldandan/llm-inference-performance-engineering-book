<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 10-4 一次走完的调查</title><desc id="fig-desc">调查依次排除 H3、确认 H1、回头证伪 H1 自己的机制、把 H2 留作残留不确定性；最小改动是把批处理并发从 70 压到 20；同流量重跑均值约 620 ms，与 9/1 的 400 ms 仍差 55%；右侧是报告要分开写的七行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">INVESTIGATION CLOSED · 10</text><text class="t" x="56" y="86">一次走完的调查</text><text class="sub" x="56" y="116">它刻意没有完全恢复：620 ms 与 400 ms 相差 55%，不是波动</text>
  <rect class="goodfill" x="72" y="176" width="660" height="80" rx="14"/>
  <text class="b" x="96" y="210">第 1 步</text>
  <text class="h" x="178" y="210">H3 缓存被关闭</text>
  <text class="s" x="178" y="238">看配置 diff，10 分钟</text>
  <text class="b" x="712" y="220" text-anchor="end">排除</text>
  <rect class="warnfill" x="72" y="266" width="660" height="80" rx="14"/>
  <text class="b" x="96" y="300">第 2 步</text>
  <text class="h" x="178" y="300">H1 队列积压</text>
  <text class="s" x="178" y="328">查已有请求级记录，30 分钟</text>
  <text class="b" x="712" y="310" text-anchor="end">成立　Queue 占 82%</text>
  <rect class="warnfill" x="72" y="356" width="660" height="54" rx="14"/>
  <text class="b" x="96" y="390">第 2.5 步</text>
  <text class="s" x="186" y="390">回头证伪 H1 的机制　短 prompt Queue P99 35 → 40 ms</text>
  <text class="b" x="712" y="390" text-anchor="end">机制要修正</text>
  <rect class="soft" x="72" y="420" width="660" height="80" rx="14"/>
  <text class="b" x="96" y="454">第 3 步</text>
  <text class="h" x="178" y="454">H2 Prefill 被拆分</text>
  <text class="s" x="178" y="482">需要框架级 trace，未采集</text>
  <text class="b" x="712" y="464" text-anchor="end">残留不确定性</text>
  <rect class="coolfill" x="72" y="500" width="660" height="64" rx="14"/>
  <text class="b" x="96" y="528">最小改动</text>
  <text class="m" x="206" y="528">批处理任务并发上限 70 → 20</text>
  <text class="s" x="206" y="552">改配置、不改代码、可随时回滚</text>
  <text class="s" x="72" y="590">同流量重跑三轮 640 / 590 / 620 ms，均值约 620 ms</text>
  <rect class="goodfill" x="72" y="600" width="196" height="38" rx="12"/>
  <text class="s" x="86" y="625">9/1 基线</text>
  <text class="b" x="254" y="625" text-anchor="end">400 ms</text>
  <rect class="badfill" x="284" y="600" width="196" height="38" rx="12"/>
  <text class="s" x="298" y="625">9/8 故障期</text>
  <text class="b" x="466" y="625" text-anchor="end">6 s</text>
  <rect class="warnfill" x="496" y="600" width="264" height="38" rx="12"/>
  <text class="s" x="510" y="625">改动后</text>
  <text class="b" x="746" y="625" text-anchor="end">620 ms　仍差 220 ms</text>
  <rect class="card" x="756" y="176" width="452" height="410" rx="16"/>
  <text class="b" x="780" y="214">报告要分开写的七行</text>
  <text class="b" x="780" y="252">结论</text>
  <text class="s" x="872" y="252">H1 成立，是主要原因</text>
  <text class="b" x="780" y="300">置信度</text>
  <text class="s" x="872" y="300">高。有干预、有反例</text>
  <text class="b" x="780" y="348">机制</text>
  <text class="warn" x="872" y="348">长请求进不了调度；KV 还是 token 预算未定</text>
  <text class="b" x="780" y="396">已解决</text>
  <text class="good" x="872" y="396">P99 从 6 s 回到 620 ms</text>
  <text class="b" x="780" y="444">未解决</text>
  <text class="warn" x="872" y="444">620 与 400 相差 55%，不是波动</text>
  <text class="b" x="780" y="492">未确认</text>
  <text class="s" x="872" y="492">机制是哪一种；H2 是否同时成立</text>
  <text class="b" x="780" y="540">下一步</text>
  <text class="s" x="872" y="540">看 KV 使用率与抢占计数；再采框架级 trace</text>
  <text class="s" x="780" y="574">图中数字为合成数据</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">“已解决”和“未解决”要分两行写，那 220 ms 是下一次的起点。</text>
</svg>
