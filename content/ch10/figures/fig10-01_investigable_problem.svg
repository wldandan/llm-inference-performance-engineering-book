  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">INVESTIGABLE PROBLEM · 10</text><text class="t" x="56" y="86">把“服务慢”补成可调查的问题</text><text class="sub" x="56" y="116">范围和对照是最容易漏的两项：没有范围只能大海捞针，没有对照连算不算异常都判断不了</text>
  <rect class="badfill" x="72" y="200" width="268" height="130" rx="16"/>
  <text class="h" x="206" y="258" text-anchor="middle">服务慢了</text>
  <text class="s" x="206" y="294" text-anchor="middle">没有任何可以被证明为假的内容</text>
  <path class="flow" d="M340 265H400"/>
  <rect class="card" x="420" y="176" width="500" height="96" rx="14"/>
  <text class="h" x="444" y="214">现象</text>
  <text class="m" x="520" y="214">TTFT P99 从 400 ms 升到 6 s</text>
  <text class="s" x="520" y="244">要有量：从多少变成多少</text>
  <rect class="card" x="420" y="284" width="500" height="96" rx="14"/>
  <text class="h" x="444" y="322">范围</text>
  <text class="m" x="520" y="322">只影响 prompt &gt; 4000 token，约 8%</text>
  <text class="s" x="520" y="352">最容易漏的两项之一</text>
  <rect class="card" x="420" y="392" width="500" height="96" rx="14"/>
  <text class="h" x="444" y="430">时间</text>
  <text class="m" x="520" y="430">9 月 8 日 14:20 开始</text>
  <text class="s" x="520" y="460">突然开始指向某个变更</text>
  <rect class="card" x="420" y="500" width="500" height="96" rx="14"/>
  <text class="h" x="444" y="538">对照</text>
  <text class="m" x="520" y="538">9 月 1 日同负载 Baseline 400 ms</text>
  <text class="s" x="520" y="568">最容易漏的两项之二</text>
  <text class="b" x="960" y="186">候选解释</text>
