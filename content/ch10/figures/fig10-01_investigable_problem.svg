  <text class="s" x="962" y="606">每补一项，剩下要查的就少一批</text>
  <text class="s" x="72" y="380">补完之后，很多可能性</text>
  <text class="s" x="72" y="406">已经自动被排除</text>
  <text class="s" x="72" y="452">写不出这四项，说明</text>
  <text class="s" x="72" y="478">可观测性还不够，</text>
  <text class="s" x="72" y="504">该回第 8 章补请求级记录</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">写不出这四项，说明可观测性还不够，不是调查方法不对。</text>
