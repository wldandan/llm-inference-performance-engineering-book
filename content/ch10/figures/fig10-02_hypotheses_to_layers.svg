  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">COMPETING HYPOTHESES · 10</text><text class="t" x="56" y="86">三个竞争假设、各自的层次与门槛</text><text class="sub" x="56" y="116">一次列多个假设，调查就变成“哪个能活下来”，而不是“能不能证明我是对的”</text>
  <rect class="card" x="72" y="176" width="1136" height="300" rx="16"/>
  <text class="b" x="96" y="214">假设</text>
  <text class="b" x="392" y="214">需要哪一层证据</text>
  <text class="b" x="640" y="214">成立的门槛</text>
  <text class="b" x="960" y="214">门槛的来处</text>
  <path d="M72 232H1208" class="divider"/>
  <rect class="goodfill" x="84" y="238" width="292" height="56" rx="6"/>
  <text class="b" x="96" y="270">H1 队列积压</text>
  <text class="s" x="392" y="270">请求级</text>
  <text class="m" x="640" y="270">Queue 占 TTFT ≥ 70%</text>
  <text class="s" x="960" y="270">唯一原因约 94%，解释一半约 48%</text>
  <rect class="warnfill" x="84" y="308" width="292" height="56" rx="6"/>
  <text class="b" x="96" y="340">H2 Prefill 被拆分</text>
  <text class="s" x="392" y="340">框架级</text>
  <text class="m" x="640" y="340">首 token 前 scheduled &gt; 1 次</text>
  <text class="s" x="960" y="340">机制本身给出的判定</text>
  <rect class="coolfill" x="84" y="378" width="292" height="56" rx="6"/>
  <text class="b" x="96" y="410">H3 缓存被关闭</text>
  <text class="s" x="392" y="410">配置 + 请求级</text>
  <text class="m" x="640" y="410">同前缀比冷请求快 &lt; 30%</text>
  <text class="s" x="960" y="410">生效时快约 60%，失效时约 0</text>
  <text class="b" x="72" y="520">按采集成本排序，先查便宜的</text>
  <rect class="goodfill" x="72" y="540" width="332" height="70" rx="14"/>
  <text class="b" x="92" y="570">H3 看配置 diff</text>
  <text class="s" x="92" y="596">10 分钟</text>
  <path class="flow" d="M408 575H468"/>
  <rect class="goodfill" x="474" y="540" width="332" height="70" rx="14"/>
  <text class="b" x="494" y="570">H1 查已有请求级记录</text>
  <text class="s" x="494" y="596">30 分钟</text>
  <path class="flow" d="M810 575H870"/>
  <rect class="warnfill" x="876" y="540" width="332" height="70" rx="14"/>
  <text class="b" x="896" y="570">H2 需要框架级 trace</text>
  <text class="s" x="896" y="596">尚未采集</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">没有门槛的假设，仍然是不可证伪的。</text>
