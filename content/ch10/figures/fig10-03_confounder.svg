    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CONFOUNDER · 10</text><text class="t" x="56" y="86">混杂因子与那个反例</text><text class="sub" x="56" y="116">调查里最容易出错的一步，是把同时发生当成了因果</text>
  <text class="b" x="72" y="186">同时发生不等于因果</text>
  <rect class="card" x="72" y="206" width="540" height="200" rx="16"/>
  <rect class="warnfill" x="212" y="232" width="260" height="56" rx="12"/>
  <text class="b" x="342" y="267" text-anchor="middle">并发 20 → 90</text>
  <path class="flow" d="M280 288L190 344"/>
  <path class="flow" d="M404 288L494 344"/>
  <rect class="soft" x="104" y="348" width="172" height="44" rx="10"/>
  <text class="s" x="190" y="376" text-anchor="middle">GPU 利用率 60→95</text>
  <rect class="soft" x="408" y="348" width="172" height="44" rx="10"/>
  <text class="s" x="494" y="376" text-anchor="middle">TTFT 升高</text>
  <path class="rule" fill="none" d="M276 370L408 370"/>
  <text class="s" x="342" y="342" text-anchor="middle">看起来互为因果</text>
  <text class="s" x="342" y="424" text-anchor="middle">流量是混杂因子：它同时推高了两者</text>
  <text class="b" x="660" y="186">一个反例就够了</text>
  <rect class="card" x="660" y="206" width="548" height="200" rx="16"/>
  <text class="b" x="684" y="244"></text>
  <text class="b" x="818" y="244">GPU 利用率</text>
  <text class="b" x="952" y="244">并发</text>
  <text class="b" x="1086" y="244">TTFT P99</text>
  <path d="M672 258H1196" class="divider"/>
  <text class="s" x="684" y="296">9/8 14:20 后</text>
  <text class="m" x="818" y="296">95%</text>
  <text class="m" x="952" y="296">90</text>
  <text class="bad" x="1086" y="296">6 s</text>
  <text class="s" x="684" y="346">8/26 下午</text>
  <text class="m" x="818" y="346">93%</text>
  <text class="m" x="952" y="346">24</text>
  <text class="good" x="1086" y="346">430 ms</text>
  <text class="s" x="684" y="386">利用率几乎一样，TTFT 差十几倍，差的是并发</text>
  <text class="b" x="72" y="464">从相关走到因果，至少做到两件事之一</text>
  <rect class="card" x="72" y="486" width="548" height="136" rx="14"/>
  <text class="h" x="96" y="522">找出机制</text>
  <text class="s" x="96" y="554">并发超过 max-num-seqs，多出来的请求</text>
  <text class="s" x="96" y="582">在队列里等待，Queue 时间因此上升</text>
  <text class="warn" x="96" y="608">10.6 会把这条机制再证伪一次</text>
  <rect class="card" x="660" y="486" width="548" height="136" rx="14"/>
  <text class="h" x="684" y="522">做受控变更</text>
  <text class="s" x="684" y="554">只改一个变量，同流量重跑。第 7 章那份</text>
  <text class="s" x="684" y="582">可复现 Baseline 在这里是前提</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">找反例比采新数据便宜，应该排在前面。</text>
</svg>
