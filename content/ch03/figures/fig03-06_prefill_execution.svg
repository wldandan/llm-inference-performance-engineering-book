<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 3-6 Prefill：整段 Prompt 的第一次前向计算</title><desc id="fig-desc">展示 S 个 Prompt Tokens 经完整序列前向计算，一路写入长度为 S 的 KV Cache，一路由最后位置 Logits 采样出第一个生成 token。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:7 7}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">PREFILL EXECUTION · 06</text><text class="t" x="56" y="84">Prefill：整段 Prompt 的第一次前向计算</text><text class="sub" x="56" y="114">同一次前向计算完成两件事：建立 Prompt 的 KV Cache，并为首个输出 token 产生 Logits</text>
  <g transform="translate(56 224)"><rect class="card" width="190" height="172" rx="18"/><text class="h" x="95" y="52" text-anchor="middle">S Prompt Tokens</text><text class="s" x="95" y="86" text-anchor="middle">t₁ · t₂ · t₃ · · · tₛ</text><rect class="tag" x="35" y="110" width="120" height="36" rx="18"/><text class="tagt" x="95" y="134" text-anchor="middle">Sequence Length S</text></g>
  <g transform="translate(316 196)"><rect class="dark" width="260" height="228" rx="20"/><text class="hd" x="130" y="60" text-anchor="middle" fill="#FFFFFF">Full-sequence Forward</text><text class="sd" x="130" y="100" text-anchor="middle" fill="#CBD5E1">Embedding</text><text class="sd" x="130" y="130" text-anchor="middle" fill="#CBD5E1">All Transformer Layers</text><text class="sd" x="130" y="160" text-anchor="middle" fill="#CBD5E1">Final Norm + LM Head</text><text class="sd" x="130" y="194" text-anchor="middle" fill="#CBD5E1">一次处理全部位置</text></g>
  <g transform="translate(650 224)"><rect class="card" width="210" height="172" rx="18"/><text class="h" x="105" y="54" text-anchor="middle">Last-position Logits</text><text class="s" x="105" y="88" text-anchor="middle">只读取最后位置</text><text class="s" x="105" y="116" text-anchor="middle">的词表分数</text></g>
  <g transform="translate(930 224)"><rect class="card" width="120" height="172" rx="18"/><text class="h" x="60" y="72" text-anchor="middle">Sampling</text><text class="s" x="60" y="106" text-anchor="middle">选择 ID</text></g>
  <g transform="translate(1110 224)"><rect class="dark" width="114" height="172" rx="18"/><text class="hd" x="57" y="62" text-anchor="middle" fill="#FFFFFF">First</text><text class="hd" x="57" y="90" text-anchor="middle" fill="#FFFFFF">Token</text><text class="sd" x="57" y="126" text-anchor="middle" fill="#CBD5E1">y₁</text></g>
  <path class="flow" d="M246 310H310"/><path d="M310 310l-9 -6v12z" fill="#334155"/><path class="flow" d="M576 310H644"/><path d="M644 310l-9 -6v12z" fill="#334155"/><path class="flow" d="M860 310H924"/><path d="M924 310l-9 -6v12z" fill="#334155"/><path class="flow" d="M1050 310H1104"/><path d="M1104 310l-9 -6v12z" fill="#334155"/>
  <path class="flow" d="M446 424V466"/><path d="M446 466l-6 -9h12z" fill="#334155"/><g transform="translate(304 474)"><rect class="card" width="284" height="112" rx="18"/><text class="h" x="142" y="42" text-anchor="middle">KV Cache · Length S</text><text class="s" x="142" y="74" text-anchor="middle">每层、每个 Prompt 位置</text><text class="s" x="142" y="98" text-anchor="middle">写入对应 K / V</text></g><path class="dash" d="M588 530H860"/><text class="s" x="724" y="517" text-anchor="middle">供后续 Decode 复用</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Prefill 写入完整 Prompt 的 K/V，并为首个输出 token 产生 Logits。</text>
