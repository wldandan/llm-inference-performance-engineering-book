<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 3-9 Demo 输出模型机制报告</title><desc id="fig-desc">展示 Model Config、Prompt 与 Decode 参数、Logits 与采样参数进入 mechanics.py，输出 Shapes、Sampling 和 Execution Trace 三组离线合成结果。</desc>
