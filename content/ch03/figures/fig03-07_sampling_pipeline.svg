<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 3-7 Sampling：从 Logits 到 Selected Token</title><desc id="fig-desc">展示 Vocabulary Logits 经 Temperature、概率归一化、Top-k 或 Top-p 候选过滤，最后由 Greedy 或随机采样选出一个 token。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:17px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.bar{fill:#CBD5E1}.bar2{fill:#64748B}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TOKEN SELECTION · 07</text><text class="t" x="56" y="84">Sampling：从 Logits 到 Selected Token</text><text class="sub" x="56" y="114">模型输出分数；Temperature、候选过滤和选择策略共同决定最终 token</text>
  <g transform="translate(56 218)"><rect class="card" width="176" height="224" rx="18"/><text class="h" x="88" y="48" text-anchor="middle">Vocabulary Logits</text><rect class="bar2" x="32" y="82" width="95" height="13" rx="6"/><rect class="bar" x="32" y="110" width="62" height="13" rx="6"/><rect class="bar" x="32" y="138" width="118" height="13" rx="6"/><rect class="bar" x="32" y="166" width="42" height="13" rx="6"/><text class="s" x="88" y="206" text-anchor="middle">任意实数分数</text></g>
  <g transform="translate(284 218)"><rect class="card" width="176" height="224" rx="18"/><text class="h" x="88" y="52" text-anchor="middle">Temperature</text><text class="s" x="88" y="88" text-anchor="middle">logits ÷ T</text><rect class="tag" x="38" y="112" width="100" height="38" rx="19"/><text class="tagt" x="88" y="137" text-anchor="middle">T &gt; 0</text><text class="s" x="88" y="184" text-anchor="middle">改变分布尖锐程度</text></g>
  <g transform="translate(512 218)"><rect class="card" width="176" height="224" rx="18"/><text class="h" x="88" y="52" text-anchor="middle">Probability</text><text class="h" x="88" y="78" text-anchor="middle">Distribution</text><text class="s" x="88" y="116" text-anchor="middle">Softmax</text><text class="s" x="88" y="148" text-anchor="middle">pᵢ ≥ 0</text><text class="s" x="88" y="178" text-anchor="middle">Σ pᵢ = 1</text></g>
  <g transform="translate(740 218)"><rect class="card" width="176" height="224" rx="18"/><text class="h" x="88" y="52" text-anchor="middle">Top-k / Top-p</text><text class="s" x="88" y="90" text-anchor="middle">过滤低概率项</text><rect class="tag" x="24" y="118" width="128" height="38" rx="19"/><text class="tagt" x="88" y="143" text-anchor="middle">Candidate Set</text><text class="s" x="88" y="188" text-anchor="middle">重新归一化</text></g>
  <g transform="translate(968 218)"><rect class="card" width="136" height="224" rx="18"/><text class="h" x="68" y="54" text-anchor="middle">Selection</text><text class="s" x="68" y="98" text-anchor="middle">Greedy</text><text class="s" x="68" y="128" text-anchor="middle">或</text><text class="s" x="68" y="158" text-anchor="middle">Random Sample</text></g>
  <g transform="translate(1156 218)"><rect class="dark" width="68" height="224" rx="18"/><text class="hd" x="34" y="76" text-anchor="middle" fill="#FFFFFF">ID</text><text class="hd" x="34" y="112" text-anchor="middle" fill="#FFFFFF">42</text><text class="sd" x="34" y="156" text-anchor="middle" fill="#CBD5E1">选中</text></g>
  <path class="flow" d="M232 330H278"/><path d="M278 330l-9 -6v12z" fill="#334155"/><path class="flow" d="M460 330H506"/><path d="M506 330l-9 -6v12z" fill="#334155"/><path class="flow" d="M688 330H734"/><path d="M734 330l-9 -6v12z" fill="#334155"/><path class="flow" d="M916 330H962"/><path d="M962 330l-9 -6v12z" fill="#334155"/><path class="flow" d="M1104 330H1150"/><path d="M1150 330l-9 -6v12z" fill="#334155"/>
  <rect class="tag" x="336" y="500" width="608" height="44" rx="22"/><text class="tagt" x="640" y="528" text-anchor="middle">同一组 Logits，在不同解码参数下可能得到不同的 Selected Token</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Logits 只是分数，解码策略决定最终选择哪个 token。</text>
</svg>
