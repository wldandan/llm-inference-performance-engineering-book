  <g transform="translate(300 162)"><rect class="card" width="160" height="100" rx="16"/><text class="h" x="80" y="42" text-anchor="middle">Q Projection</text><text class="s" x="80" y="70" text-anchor="middle">Query</text></g>
  <g transform="translate(300 310)"><rect class="card" width="160" height="100" rx="16"/><text class="h" x="80" y="42" text-anchor="middle">K Projection</text><text class="s" x="80" y="70" text-anchor="middle">Key</text></g>
  <g transform="translate(300 458)"><rect class="card" width="160" height="100" rx="16"/><text class="h" x="80" y="42" text-anchor="middle">V Projection</text><text class="s" x="80" y="70" text-anchor="middle">Value</text></g>
