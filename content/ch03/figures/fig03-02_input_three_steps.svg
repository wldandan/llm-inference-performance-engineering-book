<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 3-2 Chat Template、Tokenizer 与 Embedding</title><desc id="fig-desc">从左到右是 messages、Chat Template、Tokenizer、Embedding 和 Transformer Blocks。Chat Template 和 Tokenizer 在服务进程里、通常跑在 CPU 上，只改变输入的格式；Embedding 是模型权重的一部分，跑在 GPU 上。下方一张 151936 行的词表（Tokenizer 用到其中 151665 个号）把 Tokenizer 产出的 ID、Embedding 表的行号和 LM Head 输出的分数绑在一起；输出时 Tokenizer 用同一张词表把 ID 解码回文字。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:17px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.dash{fill:none;stroke:#64748B;stroke-width:1.8;stroke-dasharray:6 6}.br{fill:none;stroke:#94A3B8;stroke-width:1.8}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:#475569}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">INPUT PIPELINE · 02</text><text class="t" x="56" y="84">三道手续：从 messages 到向量</text><text class="sub" x="56" y="114">前两道在服务进程里改格式，第三道已经是模型；一张词表把三者绑在一起</text>
  <g transform="translate(56 160)"><rect class="card" width="190" height="168" rx="18"/><text class="h" x="95.0" y="40" text-anchor="middle">messages</text><text class="s" x="95.0" y="68" text-anchor="middle">角色 + 内容</text><text class="s" x="95.0" y="92" text-anchor="middle">应用拼好发来</text><rect class="tag" x="14" y="120" width="162" height="34" rx="17"/><text class="tagt" x="95.0" y="142" text-anchor="middle">user：请用三句话…</text></g><g transform="translate(286 160)"><rect class="card" width="190" height="168" rx="18"/><text class="h" x="95.0" y="40" text-anchor="middle">Chat Template</text><text class="s" x="95.0" y="68" text-anchor="middle">插入角色与分隔标记</text><text class="s" x="95.0" y="92" text-anchor="middle">拼成一段文本</text><rect class="tag" x="14" y="120" width="162" height="34" rx="17"/><text class="mono" x="95.0" y="142" text-anchor="middle">&lt;|im_start|&gt;user…</text></g><g transform="translate(516 160)"><rect class="card" width="190" height="168" rx="18"/><text class="h" x="95.0" y="40" text-anchor="middle">Tokenizer</text><text class="s" x="95.0" y="68" text-anchor="middle">按词表切分</text><text class="s" x="95.0" y="92" text-anchor="middle">映射成整数 ID</text><rect class="tag" x="14" y="120" width="162" height="34" rx="17"/><text class="tagt" x="95.0" y="142" text-anchor="middle">30 个 token ID</text></g><g transform="translate(746 160)"><rect class="card" width="190" height="168" rx="18"/><text class="h" x="95.0" y="40" text-anchor="middle">Embedding</text><text class="s" x="95.0" y="68" text-anchor="middle">按 ID 查表</text><text class="s" x="95.0" y="92" text-anchor="middle">取出一行向量</text><rect class="tag" x="14" y="120" width="162" height="34" rx="17"/><text class="tagt" x="95.0" y="142" text-anchor="middle">30 × 896</text></g><g transform="translate(976 160)"><rect class="dark" width="248" height="168" rx="18"/><text class="hd" x="124.0" y="40" text-anchor="middle">N × Blocks</text><text class="sd" x="124.0" y="68" text-anchor="middle">上下文关系</text><text class="sd" x="124.0" y="92" text-anchor="middle">从这里才开始形成</text></g><path class="flow" d="M246 244.0H280"/><path class="flow" d="M476 244.0H510"/><path class="flow" d="M706 244.0H740"/><path class="flow" d="M936 244.0H970"/><path class="br" d="M286 344V354H706V344"/><text class="tagt" x="496" y="380" text-anchor="middle">服务进程里，通常跑在 CPU 上</text><path class="br" d="M746 344V354H1224V344"/><text class="tagt" x="985" y="380" text-anchor="middle">模型权重的一部分，跑在 GPU 上</text><rect class="tag" x="286" y="470" width="654" height="44" rx="22"/><text class="tagt" x="613" y="498" text-anchor="middle">同一张词表：Embedding 151936 行，Tokenizer 用到其中 151665 个号</text><path class="dash" d="M381 328V470"/><path class="dash" d="M611 328V470"/><path class="dash" d="M841 328V470"/><rect x="303" y="412" width="156" height="28" rx="6" fill="#F8FAFC"/><text class="s" x="381" y="432" text-anchor="middle">控制标记也在表里</text><rect x="533" y="412" width="156" height="28" rx="6" fill="#F8FAFC"/><text class="s" x="611" y="432" text-anchor="middle">ID 只能取表里的号</text><rect x="763" y="412" width="156" height="28" rx="6" fill="#F8FAFC"/><text class="s" x="841" y="432" text-anchor="middle">号码就是表的行号</text><g transform="translate(976 430)"><rect class="card" width="248" height="124" rx="18"/><text class="h" x="124.0" y="40" text-anchor="middle">LM Head</text><text class="s" x="124.0" y="68" text-anchor="middle">给词表里每个 token</text><text class="s" x="124.0" y="92" text-anchor="middle">打一个分</text></g><path class="dash" d="M940 492H970"/><g transform="translate(56 416)"><rect class="card" width="210" height="146" rx="18"/><text class="h" x="20" y="38">输出时反过来走</text><text class="s" x="20" y="68">Sampling 选出的 ID，</text><text class="s" x="20" y="92">由 Tokenizer 查同一</text><text class="s" x="20" y="116">张词表解码成文字</text></g><rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">前两道只改格式，第三道已经是模型；换模型时三样要一起换，因为它们共用一张词表。</text>
</svg>
