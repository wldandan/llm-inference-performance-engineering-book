<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 3-1 从文本到下一个 token</title><desc id="fig-desc">展示文本经过 Chat Template 与 Tokenizer、Embedding、Transformer Blocks、LM Head 与 Sampling 后生成下一个 token 的完整模型路径。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:17px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TOKEN PIPELINE · 01</text><text class="t" x="56" y="84">从文本到下一个 token</text><text class="sub" x="56" y="114">Transformer 先计算词表分数，Sampling 再做选择</text>
  <g transform="translate(60 226)"><rect class="card" width="140" height="190" rx="18"/><text class="h" x="70" y="70" text-anchor="middle">Text</text><text class="s" x="70" y="102" text-anchor="middle">messages</text><text class="s" x="70" y="130" text-anchor="middle">角色 + 内容</text></g>
  <g transform="translate(220 226)"><rect class="card" width="140" height="190" rx="18"/><text class="h" x="70" y="62" text-anchor="middle">Chat Template</text><text class="h" x="70" y="90" text-anchor="middle">+ Tokenizer</text><rect class="tag" x="18" y="120" width="104" height="38" rx="19"/><text class="tagt" x="70" y="145" text-anchor="middle">Token IDs</text></g>
  <g transform="translate(380 226)"><rect class="card" width="140" height="190" rx="18"/><text class="h" x="70" y="70" text-anchor="middle">Embedding</text><text class="s" x="70" y="102" text-anchor="middle">查表</text><text class="s" x="70" y="130" text-anchor="middle">Hidden States</text></g>
  <g transform="translate(540 226)"><rect class="dark" width="140" height="190" rx="18"/><text class="hd" x="70" y="62" text-anchor="middle" fill="#FFFFFF">N × Blocks</text><text class="sd" x="70" y="96" text-anchor="middle" fill="#CBD5E1">Attention</text><text class="sd" x="70" y="124" text-anchor="middle" fill="#CBD5E1">+ MLP</text></g>
  <g transform="translate(700 226)"><rect class="card" width="140" height="190" rx="18"/><text class="h" x="70" y="62" text-anchor="middle">Final Norm</text><text class="h" x="70" y="90" text-anchor="middle">+ LM Head</text><text class="s" x="70" y="128" text-anchor="middle">词表投影</text><text class="s" x="70" y="154" text-anchor="middle">Logits</text></g>
  <g transform="translate(860 226)"><rect class="card" width="140" height="190" rx="18"/><text class="h" x="70" y="70" text-anchor="middle">Sampling</text><text class="s" x="70" y="102" text-anchor="middle">候选过滤</text><text class="s" x="70" y="130" text-anchor="middle">选择 ID</text></g>
  <g transform="translate(1020 226)"><rect class="dark" width="140" height="190" rx="18"/><text class="hd" x="70" y="70" text-anchor="middle" fill="#FFFFFF">Next Token</text><text class="sd" x="70" y="102" text-anchor="middle" fill="#CBD5E1">token ID</text><text class="sd" x="70" y="130" text-anchor="middle" fill="#CBD5E1">decode to text</text></g>
  <path class="flow" d="M200 321H214"/><path d="M214 321l-8 -6v12z" fill="#334155"/><path class="flow" d="M360 321H374"/><path d="M374 321l-8 -6v12z" fill="#334155"/><path class="flow" d="M520 321H534"/><path d="M534 321l-8 -6v12z" fill="#334155"/><path class="flow" d="M680 321H694"/><path d="M694 321l-8 -6v12z" fill="#334155"/><path class="flow" d="M840 321H854"/><path d="M854 321l-8 -6v12z" fill="#334155"/><path class="flow" d="M1000 321H1014"/><path d="M1014 321l-8 -6v12z" fill="#334155"/>
  <rect class="tag" x="356" y="466" width="568" height="44" rx="22"/><text class="tagt" x="640" y="494" text-anchor="middle">Token IDs 是模型输入 · Logits 是模型输出 · Token 是 Sampling 结果</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">模型先计算词表分数，Sampling 才决定下一个 token。</text>
</svg>
