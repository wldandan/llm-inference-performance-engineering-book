<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-3 同步请求字段与响应验收项</title><desc id="fig-desc">左侧列出同步请求的五个字段与必需性，右侧按正文顺序列出响应的五个验收项，并标明 HTTP 200 不在其中。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:32px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:19px;font-weight:650;fill:#FFFFFF}
</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">REQUEST CONTRACT · 03</text><text class="t" x="56" y="84">同步请求字段与响应验收项</text><text class="sub" x="56" y="114">两个必需字段加三个显式写出的可选字段，换来一份要逐项验收的完整响应</text>
  <g transform="translate(72 170)"><rect class="card" width="440" height="404" rx="20"/><text class="h" x="32" y="52">请求 · stream=false</text>
<g transform="translate(32 88)"><rect class="soft" width="376" height="56" rx="12"/><text class="m" x="20" y="34">model</text><text class="s" x="170" y="34" fill="#0F172A">必需</text><text class="s" x="230" y="34">服务公开的模型名</text></g>
<g transform="translate(32 152)"><rect class="soft" width="376" height="56" rx="12"/><text class="m" x="20" y="34">messages</text><text class="s" x="170" y="34" fill="#0F172A">必需</text><text class="s" x="230" y="34">对话消息与角色</text></g>
<g transform="translate(32 216)"><rect class="soft" width="376" height="56" rx="12"/><text class="m" x="20" y="34">max_tokens</text><text class="s" x="170" y="34" fill="#0F172A">可选</text><text class="s" x="230" y="34">限制最大输出长度</text></g>
<g transform="translate(32 280)"><rect class="soft" width="376" height="56" rx="12"/><text class="m" x="20" y="34">temperature</text><text class="s" x="170" y="34" fill="#0F172A">可选</text><text class="s" x="230" y="34">控制采样随机性</text></g>
<g transform="translate(32 344)"><rect class="soft" width="376" height="56" rx="12"/><text class="m" x="20" y="34">stream</text><text class="s" x="170" y="34" fill="#0F172A">可选</text><text class="s" x="230" y="34">false 一次性返回</text></g>
</g>
  <path class="flow" d="M512 372H620"/>
  <text class="s" x="566" y="352" text-anchor="middle" fill="#0F172A">返回</text>
  <text class="s" x="566" y="404" text-anchor="middle">HTTP 200</text>
  <text class="s" x="566" y="428" text-anchor="middle">不是验收项</text>
  <g transform="translate(624 170)"><rect class="card" width="584" height="404" rx="20"/><text class="h" x="32" y="52">一次性完整响应：五项逐条检查</text>
<g transform="translate(32 88)"><rect class="soft" width="520" height="56" rx="12"/><text class="b" x="20" y="35">1</text><text class="s" x="56" y="34" fill="#0F172A">model 是否为目标服务公开的模型名</text></g>
<g transform="translate(32 152)"><rect class="soft" width="520" height="56" rx="12"/><text class="b" x="20" y="35">2</text><text class="s" x="56" y="34" fill="#0F172A">choices[0].message.role 是否为 assistant</text></g>
<g transform="translate(32 216)"><rect class="soft" width="520" height="56" rx="12"/><text class="b" x="20" y="35">3</text><text class="s" x="56" y="34" fill="#0F172A">content 是否包含非空正文</text></g>
<g transform="translate(32 280)"><rect class="soft" width="520" height="56" rx="12"/><text class="b" x="20" y="35">4</text><text class="s" x="56" y="34" fill="#0F172A">finish_reason 是否说明正常结束</text></g>
<g transform="translate(32 344)"><rect class="soft" width="520" height="56" rx="12"/><text class="b" x="20" y="35">5</text><text class="s" x="56" y="34" fill="#0F172A">usage 是否给出 token 数，缺失则留空</text></g>
</g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">HTTP 200 不等于验收通过；usage 缺失时留空，不用字符数折算。</text>
</svg>
