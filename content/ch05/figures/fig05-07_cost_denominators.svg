<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter05-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 5-7 成本指标的分母</title><desc id="fig-desc">将同一份 Total Serving Cost 分别除以输入 token、输出 token、成功请求和满足 SLO 的 Good Requests，说明分母会改变工程结论。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:19px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">COST DENOMINATOR · 07</text><text class="t" x="56" y="84">成本指标的分母决定结论</text><text class="sub" x="56" y="114">成本范围和分母都一致，单位成本才可比较</text>
  <g transform="translate(426 158)"><rect class="dark" width="428" height="120" rx="24"/><text class="hd" x="214" y="48" text-anchor="middle" fill="#FFFFFF">Total Serving Cost</text><text class="sd" x="214" y="80" text-anchor="middle" fill="#CBD5E1">GPU · CPU · Memory · Network · Operations</text></g>
  <path class="flow" d="M500 278L196 370"/><path d="M196 370l1 -11l9 7z" fill="#334155"/><path class="flow" d="M594 278L492 370"/><path d="M492 370l-4 -10l11 3z" fill="#334155"/><path class="flow" d="M686 278L788 370"/><path d="M788 370l-11 -3l7 -8z" fill="#334155"/><path class="flow" d="M780 278L1084 370"/><path d="M1084 370l-10 -4l8 -8z" fill="#334155"/>
  <g transform="translate(56 376)"><rect class="card" width="260" height="188" rx="20"/><text class="h" x="130" y="44" text-anchor="middle">Input Tokens</text><text class="s" x="130" y="80" text-anchor="middle">USD / 1M input tokens</text><rect class="tag" x="54" y="112" width="152" height="38" rx="19"/><text class="tagt" x="130" y="137" text-anchor="middle">Prompt Cost</text></g>
  <g transform="translate(358 376)"><rect class="card" width="260" height="188" rx="20"/><text class="h" x="130" y="44" text-anchor="middle">Output Tokens</text><text class="s" x="130" y="80" text-anchor="middle">USD / 1M output tokens</text><rect class="tag" x="54" y="112" width="152" height="38" rx="19"/><text class="tagt" x="130" y="137" text-anchor="middle">Generation Cost</text></g>
  <g transform="translate(660 376)"><rect class="card" width="260" height="188" rx="20"/><text class="h" x="130" y="44" text-anchor="middle">Successful Requests</text><text class="s" x="130" y="80" text-anchor="middle">USD / success</text><rect class="tag" x="44" y="112" width="172" height="38" rx="19"/><text class="tagt" x="130" y="137" text-anchor="middle">Failure Cost Included?</text></g>
  <g transform="translate(962 376)"><rect class="card" width="262" height="188" rx="20"/><text class="h" x="131" y="44" text-anchor="middle">Good Requests</text><text class="s" x="131" y="80" text-anchor="middle">USD / good（success + quality + SLO）</text><rect class="tag" x="60" y="112" width="142" height="38" rx="19"/><text class="tagt" x="131" y="137" text-anchor="middle">Business Value</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">成本范围相同、分母相同，单位成本才可比较。</text>
