<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter05-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 5-9 Demo 输出指标报告</title><desc id="fig-desc">展示 JSONL 请求记录、SLO 与 Workload 进入 metrics_report.py，输出 Latency、Throughput、Goodput、Cost 和 Measurement Contract。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.warn{fill:#FFF7ED;stroke:#FDBA74;stroke-width:1.4}.warnt{font-size:14px;font-weight:750;fill:#9A3412}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">OFFLINE METRICS · 09</text><text class="t" x="56" y="84">Demo 输出指标报告</text><text class="sub" x="56" y="114">报告保存公式、统计口径和原始请求级结果</text>
  <g transform="translate(56 186)"><rect class="card" width="270" height="102" rx="18"/><text class="h" x="24" y="38">JSONL Request Records</text><text class="s" x="24" y="68">start · token times · end</text><text class="s" x="24" y="92">tokens · success · cost</text></g><g transform="translate(56 318)"><rect class="card" width="270" height="102" rx="18"/><text class="h" x="24" y="38">SLO Conditions</text><text class="s" x="24" y="68">TTFT threshold</text><text class="s" x="24" y="92">E2E threshold</text></g><g transform="translate(56 450)"><rect class="card" width="270" height="102" rx="18"/><text class="h" x="24" y="38">Workload Metadata</text><text class="s" x="24" y="68">scenario · concurrency</text><text class="s" x="24" y="92">model · request distribution</text></g>
