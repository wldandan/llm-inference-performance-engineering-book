<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter05-v2" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 5-3 TTFT、TPOT 与 ITL</title><desc id="fig-desc">在同一客户端时间线上标出请求开始、首 token、后续 token 与响应结束，并区分 TTFT、ITL、TPOT 和 E2E 覆盖范围。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.dark{fill:#0F172A}.mid{fill:#475569}.dot{fill:#0F172A}.h{font-size:18px;font-weight:750}.s{font-size:14px;fill:#64748B}.axis{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.brace{fill:none;stroke:#64748B;stroke-width:2}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.darktag{fill:#0F172A}.darkt{font-size:14px;font-weight:750;fill:#FFFFFF}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">CLIENT LATENCY · 03</text><text class="t" x="56" y="84">TTFT、TPOT 与 ITL：覆盖的不是同一段时间</text><text class="sub" x="56" y="114">本书 TPOT 使用首 token 之后的平均 token 间隔</text>
  <path class="axis" d="M100 344H1180"/><path d="M1180 344l-9 -6v12z" fill="#334155"/>
  <g><circle class="dot" cx="120" cy="344" r="10"/><circle class="dot" cx="452" cy="344" r="10"/><circle class="dot" cx="648" cy="344" r="10"/><circle class="dot" cx="824" cy="344" r="10"/><circle class="dot" cx="1000" cy="344" r="10"/><circle class="dot" cx="1150" cy="344" r="10"/><text class="h" x="120" y="390" text-anchor="middle">c_send</text><text class="s" x="120" y="418" text-anchor="middle">request start</text><text class="h" x="452" y="390" text-anchor="middle">c₁</text><text class="s" x="452" y="418" text-anchor="middle">first token</text><text class="h" x="648" y="390" text-anchor="middle">c₂</text><text class="h" x="824" y="390" text-anchor="middle">c₃</text><text class="h" x="1000" y="390" text-anchor="middle">cₙ</text><text class="s" x="1000" y="418" text-anchor="middle">last token</text><text class="h" x="1150" y="390" text-anchor="middle">c_end</text><text class="s" x="1150" y="418" text-anchor="middle">response end</text></g>
  <path class="brace" d="M120 294V260H452V294"/><rect class="darktag" x="230" y="218" width="112" height="38" rx="19"/><text class="darkt" x="286" y="243" text-anchor="middle" fill="#FFFFFF">TTFT</text><path class="brace" d="M120 190V156H1150V190"/><rect class="tag" x="570" y="132" width="130" height="38" rx="19"/><text class="tagt" x="635" y="157" text-anchor="middle">E2E Latency</text>
  <path class="brace" d="M452 464V494H648V464"/><text class="s" x="550" y="522" text-anchor="middle">ITL₂</text><path class="brace" d="M648 464V494H824V464"/><text class="s" x="736" y="522" text-anchor="middle">ITL₃</text><path class="brace" d="M824 464V494H1000V464"/><text class="s" x="912" y="522" text-anchor="middle">··· ITLₙ</text><rect class="tag" x="560" y="554" width="332" height="42" rx="21"/><text class="tagt" x="726" y="581" text-anchor="middle">TPOT = mean(ITL₂ … ITLₙ)</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">TTFT 看首响，ITL / TPOT 看输出节奏，E2E 看完整请求。</text>
</svg>
