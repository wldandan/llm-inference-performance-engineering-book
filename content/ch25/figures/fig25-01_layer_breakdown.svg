<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">分层定位，不是分层优化</title><desc id="fig-desc">左侧四条横条按占比画出编排层 18%、检索层 22%、模型服务 47%、工具 13%，每条下方写明主要构成。最下方把模型服务那一层再拆成排队 31% 和 GPU 计算 16% 两段。右侧三块依次是：默认假设是先去优化推理；真正的 GPU 计算只占 16%，单次计算从 480 降到 260 毫秒，端到端只改善约 7%；排队高先问负载率为什么高，答案在容量、准入和满载吞吐上。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 25 章 · 25.2</text><text class="t" x="56" y="86">最大的那一层，未必是该先动的那一层</text><text class="sub" x="56" y="116">模型服务占 47%，但其中三分之二是排队</text>
  <rect class="card" x="72" y="176" width="700" height="396" rx="16"/>
  <text class="b" x="96" y="208">压测下的全链路时间分解（合成设定）</text>
  <rect x="232" y="236" width="92" height="34" rx="8" fill="#B45309" opacity="0.20" stroke="#B45309" stroke-width="1.6"/>
  <text class="b" x="96" y="259">编排层</text>
  <text class="b" x="336" y="259" fill="#B45309">18%</text>
  <text class="s" x="232" y="292">步数 P95 = 34（模型调用约 7 次）</text>
  <rect x="232" y="306" width="113" height="34" rx="8" fill="#1D4ED8" opacity="0.20" stroke="#1D4ED8" stroke-width="1.6"/>
  <text class="b" x="96" y="329">检索层</text>
  <text class="b" x="357" y="329" fill="#1D4ED8">22%</text>
  <text class="s" x="232" y="362">重排候选 200，冷查询占比高</text>
  <rect x="232" y="376" width="241" height="34" rx="8" fill="#B91C1C" opacity="0.20" stroke="#B91C1C" stroke-width="1.6"/>
  <text class="b" x="96" y="399">模型服务</text>
  <text class="b" x="485" y="399" fill="#B91C1C">47%</text>
  <text class="s" x="232" y="432">排队 31%，GPU 计算 16%</text>
  <rect x="232" y="446" width="67" height="34" rx="8" fill="#94A3B8" opacity="0.20" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="b" x="96" y="469">工具</text>
  <text class="b" x="311" y="469" fill="#94A3B8">13%</text>
  <text class="s" x="232" y="502">代码执行</text>
  <text class="b" x="96" y="556">模型服务那 47% 里，三分之二是排队</text>
  <rect x="380" y="536" width="240" height="28" rx="6" fill="#B91C1C" opacity="0.35"/>
  <rect x="620" y="536" width="124" height="28" rx="6" fill="#0F766E" opacity="0.35"/>
  <text class="s" x="392" y="555">排队 31%</text>
  <text class="s" x="632.0851063829788" y="555">GPU 16%</text>
  <rect class="card" x="796" y="176" width="412" height="396" rx="16"/>
  <text class="b" x="820" y="208">这张表立刻推翻的那个假设</text>
  <rect class="badfill" x="812" y="228" width="380" height="78" rx="14"/>
  <text class="s" x="830" y="258">默认假设：模型服务占 47%，</text>
  <text class="s" x="830" y="284">所以先去优化推理</text>
  <rect class="warnfill" x="812" y="316" width="380" height="104" rx="14"/>
  <text class="s" x="830" y="346">真正的 GPU 计算只占 16%</text>
  <text class="s" x="830" y="372">单次计算从 480 降到 260 ms，</text>
  <text class="s" x="830" y="398">端到端只改善约 7%</text>
  <rect class="goodfill" x="812" y="430" width="380" height="104" rx="14"/>
  <text class="s" x="830" y="460">排队高，先问负载率为什么高：</text>
  <text class="s" x="830" y="486">容量、准入、满载吞吐（第 20、21 章）；</text>
  <text class="s" x="830" y="512">满载吞吐上去了，排队才会塌下去</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">分解要在压测下做，不是在空闲时做。空闲时排队为零，这张表会完全是另一个样子，然后你会去优化一个在高峰期根本不是瓶颈的环节。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">单次计算快了将近一半，端到端只改善约 7%：先分解，再决定动哪一层</text>
</svg>
