<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">拆预算会立刻暴露不可能的目标</title><desc id="fig-desc">两栏对照。左栏是第一版：步数 P95 等于 15，编排层 750、检索层 1200、模型服务 5000、工具 1000；模型服务按 7 次模型调用拆，每次 714 毫秒，扣掉 480 毫秒纯计算，排队只占得到 234 毫秒，而现状实测每次排队约 930 毫秒，所以这份预算不成立。右栏是调整后的版本：步数降到 10，编排层 500、检索层 1200、模型服务 5000、工具 1000、未分配余量 300，合计 8000；负载率要守在 0.69 以下，排队才放得进每次调用的预算。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 25 章 · 25.3、25.8</text><text class="t" x="56" y="86">预算算不下来时，该改的是负载率、步数或者 SLO，不是预算表</text><text class="sub" x="56" y="116">按调用拆，每次调用里排队只占得到 234 ms，负载率要守在 0.69 以下</text>
  <rect class="badfill" x="72" y="176" width="552" height="396" rx="16"/>
  <text class="h" x="96" y="208">第一版：步数 P95 = 15，负载率按现状 0.9</text>
  <text class="b" x="120" y="248">编排层</text>
  <text class="m" x="252" y="248">750 ms</text>
  <text class="s" x="384" y="248">步数 P95 = 15</text>
  <text class="b" x="120" y="284">检索层</text>
  <text class="m" x="252" y="284">1200 ms</text>
  <text class="s" x="384" y="284">含重排</text>
  <text class="b" x="120" y="320">模型服务</text>
  <text class="m" x="252" y="320">5000 ms</text>
  <text class="s" x="384" y="320">含排队</text>
  <text class="b" x="120" y="356">工具</text>
  <text class="m" x="252" y="356">1000 ms</text>
  <text class="s" x="384" y="356">代码执行设超时</text>
  <path d="M104 374H600" class="divider"/>
  <text class="b" x="120" y="408">合计</text>
  <text class="m" x="252" y="408">7950 ms</text>
  <text class="b" x="120" y="450">每次调用 714 ms，扣掉纯计算 480，排队只占得到 234 ms</text>
  <text class="b" x="120" y="480" fill="#B91C1C">负载率 0.9 时实测每次排队约 930 ms</text>
  <text class="s" x="120" y="510">这份预算不成立，脚本直接报错</text>
  <rect class="goodfill" x="656" y="176" width="552" height="396" rx="16"/>
  <text class="h" x="680" y="208">调整后：步数 P95 = 10，负载率 ≤ 0.69</text>
  <text class="b" x="704" y="248">编排层</text>
  <text class="m" x="836" y="248">500 ms</text>
  <text class="s" x="968" y="248">步数 P95 = 10</text>
  <text class="b" x="704" y="284">检索层</text>
  <text class="m" x="836" y="284">1200 ms</text>
  <text class="s" x="968" y="284">含重排</text>
  <text class="b" x="704" y="320">模型服务</text>
  <text class="m" x="836" y="320">5000 ms</text>
  <text class="s" x="968" y="320">含排队</text>
  <text class="b" x="704" y="356">工具</text>
  <text class="m" x="836" y="356">1000 ms</text>
  <text class="s" x="968" y="356">代码执行设超时</text>
  <text class="b" x="704" y="392">未分配余量</text>
  <text class="m" x="836" y="392">300 ms</text>
  <text class="s" x="968" y="392">给串行等待和抖动</text>
  <path d="M688 410H1192" class="divider"/>
  <text class="b" x="704" y="444">合计</text>
  <text class="m" x="836" y="444">8000 ms</text>
  <text class="b" x="704" y="486" fill="#0F766E">每次 714 ms = 纯计算 480 + 排队 ≤ 234</text>
  <text class="s" x="704" y="516">负载率上限 234 ÷ (103 + 234) ≈ 0.69，交给准入和容量去守</text>
  <path class="flow" d="M628 372H648"/>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">拆预算的价值就在于它会报错。一个总能返回结果的函数，正是让这个矛盾在优化到一半才被发现的那个东西；这个矛盾必须在动手之前解决。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">这个矛盾必须在动手之前解决，而不是优化到一半才发现做不到</text>
</svg>
