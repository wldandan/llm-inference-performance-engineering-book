</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH14 · 14.6</text><text class="t" x="56" y="86">四项边界与各自的失效方式</text><text class="sub" x="56" y="116">这个收益数字能推广到哪里</text>
  <circle cx="640" cy="386" r="88" fill="#0F172A"/>
  <text class="hw" x="640" y="380" text-anchor="middle">收益 33%</text>
  <text class="sw" x="640" y="406" text-anchor="middle">合成样例第 1 轮</text>
  <rect x="72" y="206" width="452" height="130" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="3"/>
  <text class="h" x="94" y="240" fill="#B91C1C">模型</text>
  <text class="s" x="94" y="272">交叉点 0.5B 16640 → 7B 65024</text>
  <text class="s" x="94" y="296">同样 3000 token 的负载上</text>
  <text class="s" x="94" y="320">Attention 占比 15.3% → 4.4%</text>
  <path class="flow" d="M532 271.0L546 340"/>
  <rect x="756" y="206" width="468" height="130" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text class="h" x="778" y="240" fill="#B45309">负载</text>
  <text class="s" x="778" y="272">换成短 prompt，注意力矩阵</text>
  <text class="s" x="778" y="296">1710 MiB → 10 MiB，</text>
  <text class="s" x="778" y="320">FlashAttention 的收益缩水</text>
  <path class="flow" d="M748 271.0L734 340"/>
  <rect x="72" y="466" width="452" height="130" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text class="h" x="94" y="500" fill="#B45309">硬件</text>
  <text class="s" x="94" y="532">单副本变多副本，命中率被路由除一刀；</text>
  <text class="s" x="94" y="556">换 GPU 可能翻转算力受限</text>
  <text class="s" x="94" y="580">还是带宽受限的判断</text>
  <path class="flow" d="M532 531.0L546 432"/>
  <rect x="756" y="466" width="468" height="130" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text class="h" x="778" y="500" fill="#B45309">配置</text>
  <text class="s" x="778" y="532">temperature、缓存状态、分位数算法，</text>
  <text class="s" x="778" y="556">任一不同，两个数字就只是长得像</text>
  <path class="flow" d="M748 531.0L734 432"/>
  <text class="b" x="640" y="622" text-anchor="middle">没有边界说明的收益数字，会被当成普适结论到处引用</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">收益绑定四个条件，报告里要带上交叉点这类具体数字，别人才判断得了能不能套用。</text>
</svg>
