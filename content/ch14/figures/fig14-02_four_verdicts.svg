    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH14 · 14.5、14.7</text><text class="t" x="56" y="86">四种结论，第四种最容易被改写</text><text class="sub" x="56" y="116">同一条可识别线用两次：先判有没有变化，再判和预期差多少</text>
  <rect class="soft" x="72" y="176" width="1152" height="84" rx="14"/>
  <text class="b" x="96" y="206">对不上的时候，按这个顺序排查（顺序不能颠倒）</text>
  <text class="m" x="96" y="242">1 越过可识别线了吗</text>
  <path class="flow" d="M312 237H358"/>
  <text class="m" x="376" y="242">2 有变量泄漏吗</text>
  <path class="flow" d="M592 237H638"/>
  <text class="m" x="656" y="242">3 前提条件满足吗</text>
  <path class="flow" d="M872 237H918"/>
  <text class="m" x="936" y="242">4 最后才怀疑预期</text>
  <text class="b" x="72" y="300">第一步：改善越过可识别线了吗</text>
  <rect class="soft" x="212.0" y="364" width="80.0" height="32" rx="6"/>
  <path d="M92 380H412" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text class="s" x="252.0" y="340" text-anchor="middle">±2.5% 以内：在波动内不可分辨</text>
  <circle cx="245.6" cy="380" r="9" fill="#64748B"/>
  <text class="mb" x="245.6" y="414" text-anchor="middle" fill="#64748B">−0.4%</text>
  <text class="s" x="245.6" y="438" text-anchor="middle">第 3 轮　确认 Attention 实现</text>
  <text class="m" x="92.0" y="464" text-anchor="middle">−10%</text>
  <text class="m" x="252.0" y="464" text-anchor="middle">0</text>
  <text class="m" x="412.0" y="464" text-anchor="middle">+10%</text>
  <rect x="92" y="484" width="180" height="40" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text class="b" x="182" y="510" text-anchor="middle" fill="#B91C1C">小幅有效</text>
  <path d="M100 522L264 486" stroke="#B91C1C" stroke-width="3"/>
  <text class="s" x="92" y="552">灰带里的结论不是失败，硬写成“小幅有效”</text>
  <text class="s" x="92" y="574">是在用噪声支撑结论。</text>
  <text class="b" x="476" y="300">第二步：改善 − 预期，拿同一条线衡量</text>
  <rect class="goodfill" x="892.0" y="364" width="88.0" height="32" rx="6"/>
  <path d="M496 380H1200" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text class="b" x="936.0" y="340" text-anchor="middle">符合预期</text>
  <text class="b" x="694.0" y="340" text-anchor="middle">低于预期</text>
  <text class="b" x="1110.0" y="340" text-anchor="middle">高于预期</text>
  <circle cx="582.2" cy="380" r="9" fill="#B45309"/>
  <text class="mb" x="582.2" y="420" text-anchor="middle" fill="#B45309">实测 29.9%</text>
  <text class="s" x="582.24" y="442" text-anchor="middle">预期 50%</text>
  <text class="s" x="582.24" y="464" text-anchor="middle">第 4 轮　Chunked Prefill</text>
  <circle cx="934.2" cy="380" r="9" fill="#0F766E"/>
  <text class="mb" x="940.2" y="420" text-anchor="end" fill="#0F766E">实测 33.2%</text>
  <text class="s" x="940.24" y="442" text-anchor="end">预期 33.3%</text>
  <text class="s" x="940.24" y="464" text-anchor="end">第 1 轮　Top-K 10 → 6</text>
  <circle cx="1071.5" cy="380" r="9" fill="#1D4ED8"/>
  <text class="mb" x="1065.5" y="420" text-anchor="start" fill="#1D4ED8">实测 15.7%</text>
  <text class="s" x="1065.52" y="442">预期 8%</text>
  <text class="s" x="1065.52" y="464">第 2 轮　Prefix Cache</text>
  <text class="s" x="1200" y="490" text-anchor="end">改善 − 预期（百分点）→</text>
  <rect class="soft" x="476" y="508" width="748" height="78" rx="14"/>
  <text class="s" x="494" y="538">可识别线 = t × √(2/n) × CV，三轮对三轮约 2.3 × 变异系数，不是极差</text>
  <text class="s" x="494" y="564">合成样例：TTFT P50 那条线 2.5%，第 4 轮短请求 ITL 那条线 4.2%</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">可识别线决定了这次实验能说什么；测不出来是一个合法且诚实的结论。</text>
</svg>
