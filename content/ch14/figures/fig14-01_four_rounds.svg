<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 14-1 四轮各看什么，各自的护栏是什么</title><desc id="fig-desc">四轮实验从同一个 Baseline 出发，每行列出改动项、主指标与护栏；第 4 轮的主指标是短请求的 ITL 而不是长请求 TTFT，用加框强调；左下列出 workload、protocol、environment 三组固定件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH14 · 14.4</text><text class="t" x="56" y="86">四轮各看什么，各自的护栏是什么</text><text class="sub" x="56" y="116">每一轮的主指标真的是同一个吗</text>
  <rect class="soft" x="72" y="262" width="168" height="196" rx="14"/>
  <text class="b" x="156" y="300" text-anchor="middle">同一个</text>
  <text class="h" x="156" y="328" text-anchor="middle">Baseline</text>
  <text class="s" x="156" y="362" text-anchor="middle">四轮都从</text>
  <text class="s" x="156" y="384" text-anchor="middle">这里出发</text>
  <text class="s" x="156" y="424" text-anchor="middle">重启后测的</text>
  <text class="b" x="320" y="226">轮次</text>
  <text class="b" x="400" y="226">改动项</text>
  <text class="b" x="700" y="226">主指标</text>
  <text class="b" x="940" y="226">护栏（不是可选项）</text>
  <path class="flow" d="M244 286H300"/>
  <rect class="card" x="300" y="252" width="924" height="74" rx="12"/>
  <text class="h" x="320" y="296">1</text>
  <text class="b" x="400" y="296">Top-K 10 → 6</text>
  <text class="b" x="700" y="296" fill="#1D4ED8">TTFT P50</text>
  <text class="s" x="940" y="296">质量分、TTFT P95</text>
  <path class="flow" d="M244 378H300"/>
  <rect class="card" x="300" y="344" width="924" height="74" rx="12"/>
  <text class="h" x="320" y="388">2</text>
  <text class="b" x="400" y="388">启用 Prefix Cache</text>
  <text class="b" x="700" y="388" fill="#1D4ED8">TTFT P50</text>
  <text class="s" x="940" y="388">显存、并发上限</text>
  <path class="flow" d="M244 470H300"/>
  <rect class="card" x="300" y="436" width="924" height="74" rx="12"/>
  <text class="h" x="320" y="480">3</text>
  <text class="b" x="400" y="480">确认 Attention 实现</text>
  <text class="b" x="700" y="480" fill="#1D4ED8">TTFT P50</text>
  <text class="s" x="940" y="480">输出质量分不变</text>
  <path class="flow" d="M244 562H300"/>
  <rect class="card" x="300" y="528" width="924" height="74" rx="12"/>
  <text class="h" x="320" y="572">4</text>
  <text class="b" x="400" y="572">启用 Chunked Prefill</text>
  <text class="b" x="700" y="572" fill="#B45309">短请求的 ITL</text>
  <text class="s" x="940" y="572">长请求 TTFT（预期变差）</text>
  <rect x="300" y="528" width="924" height="74" rx="12" fill="none" stroke="#B45309" stroke-width="3"/>
  <text class="s" x="700" y="594">不是 TTFT</text>
  <rect class="coolfill" x="72" y="486" width="168" height="124" rx="14"/>
  <text class="b" x="92" y="518">固定件</text>
  <text class="m" x="92" y="544">workload</text>
  <text class="m" x="92" y="568">protocol</text>
  <text class="m" x="92" y="592">environment</text>
  <text class="s" x="300" y="626">第 4 轮若把主指标写成长请求 TTFT，结论会反；第 3 轮的护栏是一个很好的自检点：输出变了说明走的不是同一条路径。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">四轮的主指标不是同一个；护栏那一列不是可选项。</text>
</svg>
