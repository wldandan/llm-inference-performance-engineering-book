    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH13 · 13.3</text><text class="t" x="56" y="86">命中率的三刀乘法：60% 到 7.5%</text><text class="sub" x="56" y="116">可缓存比例高，为什么命中率还是很低</text>
  <rect x="88" y="240.0" width="200" height="160.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text class="mb" x="188.0" y="326.0" text-anchor="middle" fill="#1D4ED8">60%</text>
  <text class="b" x="188.0" y="218" text-anchor="middle">可缓存占比</text>
  <text class="s" x="188.0" y="434" text-anchor="middle">天花板：token 占比</text>
  <path class="flow" d="M294 320.0H326"/>
  <rect x="332" y="240.0" width="200" height="160.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text class="mb" x="432.0" y="326.0" text-anchor="middle" fill="#1D4ED8">× 1</text>
  <text class="b" x="432.0" y="218" text-anchor="middle">× 没被淘汰</text>
  <text class="s" x="432.0" y="434" text-anchor="middle">复用间隔 vs 缓存容量 ÷ 流量</text>
  <path class="flow" d="M538 320.0H570"/>
  <rect x="576" y="310.0" width="200" height="20.0" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text class="mb" x="676.0" y="326.0" text-anchor="middle" fill="#B91C1C">× 12.5%</text>
  <text class="b" x="676.0" y="218" text-anchor="middle">× 路由项</text>
  <text class="s" x="676.0" y="434" text-anchor="middle">会话前缀复用 2 次，四副本</text>
  <path class="flow" d="M782 320.0H814"/>
  <text class="mb" x="828" y="316.0">= 7.5%</text>
  <text class="b" x="828" y="344.0">实际命中率</text>
  <rect class="warnfill" x="88" y="462" width="540" height="148" rx="14"/>
  <text class="h" x="112" y="496">这几刀是乘法，不是减法</text>
  <text class="mb" x="112" y="528">路由项 = 1 − N × (1 − (1 − 1/N)^k) ÷ k</text>
  <text class="s" x="112" y="560">N = 4、k = 2 时 12.5%；N = 1 时 50%，首次写入省不掉。</text>
  <text class="s" x="112" y="586">八倍里两倍是首次写入，四倍是路由打散；第 22 章收回后者。</text>
  <rect class="soft" x="676" y="462" width="548" height="148" rx="14"/>
  <text class="h" x="700" y="496">还有第二层折扣：占比不等于省下的计算</text>
  <text class="m" x="700" y="530">S = 3000   前缀 1800（60%）   实际省 56%</text>
  <text class="m" x="700" y="558">S = 8000   前缀 4800（60%）   实际省 52%</text>
  <text class="m" x="700" y="586">S = 16640  前缀 9984（60%）   实际省 48%</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">这几刀是乘法不是减法，天花板 60% 落到个位数并不稀奇。</text>
</svg>
