<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 13-1 四条路改的不是同一件事</title><desc id="fig-desc">左侧四条路各连向右侧一次 Prefill 中不同的可改动量：上下文裁剪改输入长度并连带减少计算量，Prefix Cache 只减计算量，FlashAttention 只减搬运量，Chunked Prefill 只改调度顺序且改善的是其他请求。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH13 · 13.1</text><text class="t" x="56" y="86">四条路改的不是同一件事</text><text class="sub" x="56" y="116">它们是可以互相替代的选项吗</text>
  <rect class="card" x="450" y="196" width="308" height="372" rx="16"/>
  <text class="b" x="604.0" y="226" text-anchor="middle">一次 Prefill 里可以被改动的四个量</text>
  <rect class="soft" x="470" y="238" width="268" height="54" rx="10"/>
  <text class="h" x="604.0" y="272" text-anchor="middle">输入长度</text>
  <rect class="soft" x="470" y="328" width="268" height="54" rx="10"/>
  <text class="h" x="604.0" y="362" text-anchor="middle">计算量</text>
  <rect class="soft" x="470" y="418" width="268" height="54" rx="10"/>
  <text class="h" x="604.0" y="452" text-anchor="middle">搬运量</text>
  <rect class="soft" x="470" y="508" width="268" height="54" rx="10"/>
  <text class="h" x="604.0" y="542" text-anchor="middle">调度顺序</text>
  <rect x="96" y="238" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text class="b" x="116" y="262" fill="#0F766E">上下文裁剪</text>
  <text class="s" x="116" y="282">改善 本条请求</text>
  <path class="flow" d="M400 265H462"/>
  <path class="flow" d="M400 265C436 265 436 355 462 355"/>
  <rect x="96" y="328" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text class="b" x="116" y="352" fill="#0F766E">Prefix Cache</text>
  <text class="s" x="116" y="372">改善 本条请求</text>
  <path class="flow" d="M400 355H462"/>
  <rect x="96" y="418" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text class="b" x="116" y="442" fill="#1D4ED8">FlashAttention</text>
  <text class="s" x="116" y="462">改善 本条请求</text>
  <path class="flow" d="M400 445H462"/>
  <rect x="96" y="508" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/>
  <text class="b" x="116" y="532" fill="#B45309">Chunked Prefill</text>
  <text class="s" x="116" y="552">改善 其他请求</text>
  <path class="flow" d="M400 535H462"/>
  <rect class="soft" x="822" y="196" width="402" height="180" rx="14"/>
  <text class="h" x="846" y="230">为什么这张图重要</text>
  <text class="s" x="846" y="264">它们改的是四个不同的量，</text>
  <text class="s" x="846" y="290">所以收益不一定叠加，</text>
  <text class="s" x="846" y="316">代价却一定叠加。</text>
  <text class="s" x="846" y="350">四条都标为适用，也要一次只试一条。</text>
  <rect class="warnfill" x="822" y="396" width="402" height="172" rx="14"/>
  <text class="h" x="846" y="430">最后一条和前三条不是一类</text>
  <text class="s" x="846" y="464">Chunked Prefill 不让任何一条</text>
  <text class="s" x="846" y="490">请求变快，它改善的是别人的</text>
  <text class="s" x="846" y="516">指标，代价由本条请求承担。</text>
  <text class="s" x="846" y="550">现象是“单条长请求慢”时它帮不上忙。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">它们改的是四个不同的量，所以收益不叠加，代价一定叠加。</text>
</svg>
