  <title id="fig-title">图 13-4 拆开之后，谁快了谁慢了</title><desc id="fig-desc">上下两条时间线：不拆时长请求的 Prefill 占满一整段，其他请求的 token 流断成虚线；拆开后块与块之间其他请求都能拿到机会，token 流连续，代价是本条长请求的 TTFT 变差。</desc>
