<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">三个状态，一条路径，两条非常规边</title><desc id="fig-desc">左侧是 Waiting、Running、Finished 三个方框，用实线箭头依次相连。两条虚线箭头是非常规边：一条从 Waiting 折回外部，标为准入拒绝；一条从 Running 折回 Waiting，标为抢占。下方列出调度器每一步做的五件事，第 4 步是对整个 Running 集合执行一步前向。右侧三块说明这一步带来的后果：节奏绑定、每步耗时变化、ITL 抖动。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 20 章 · 20.2、20.3</text><text class="t" x="56" y="86">请求在进 GPU 之前只经过三个状态</text><text class="sub" x="56" y="116">真正决定一切的是第 4 步：整个 Running 集合一起算一步</text>
  <rect class="card" x="72" y="176" width="760" height="396" rx="16"/>
  <text class="b" x="96" y="208">调度器眼里只有三个状态</text>
  <rect class="soft" x="120" y="256" width="168" height="84" rx="14"/>
  <text class="h" x="136" y="290">Waiting</text>
  <text class="s" x="136" y="318">已接受但还没开始算</text>
  <rect class="coolfill" x="400" y="256" width="168" height="84" rx="14"/>
  <text class="h" x="416" y="290">Running</text>
  <text class="s" x="416" y="318">正在参与每一步前向</text>
  <rect class="goodfill" x="664" y="256" width="144" height="84" rx="14"/>
  <text class="h" x="680" y="290">Finished</text>
  <text class="s" x="680" y="318">生成完毕或被取消</text>
  <path class="flow" d="M288 298H392"/>
  <path class="flow" d="M568 298H656"/>
  <path class="feedback" d="M204 256Q204 226 240 226H412"/>
  <text class="good" x="424" y="231">拒绝：超出准入限制（第 21 章）</text>
  <path class="feedback" d="M470 340Q470 396 340 396Q204 396 204 352"/>
  <text class="good" x="300" y="422">抢占：KV 被释放，退回队列（第 16 章）</text>
  <text class="b" x="96" y="448">每一步做的事</text>
  <text class="m" x="120" y="470">1  看 Running 还能不能再加（受槽位上限、KV 余量和 token 预算限制）</text>
  <text class="m" x="120" y="491">2  能加就从 Waiting 队首取出来，分配 KV 块，放进 Running</text>
  <text class="m" x="120" y="512">3  Running 里的请求要长新 KV 块而显存不够时，抢占一条（默认挑最晚进来的）</text>
  <text class="m" x="120" y="533">4  对整个 Running 集合执行一步前向</text>
  <text class="m" x="120" y="554">5  完成的移出，循环</text>
  <rect class="card" x="856" y="176" width="352" height="396" rx="16"/>
  <text class="b" x="880" y="208">第 4 步是所有副作用的来源</text>
  <rect class="coolfill" x="872" y="228" width="320" height="104" rx="14"/>
  <text class="s" x="890" y="258">整个 Running 集合一起算一步</text>
  <text class="s" x="890" y="284">一条请求进 Running 之后，</text>
  <text class="s" x="890" y="310">它的节奏就和同批的其他请求绑在一起</text>
  <rect class="warnfill" x="872" y="346" width="320" height="104" rx="14"/>
  <text class="s" x="890" y="376">批次成员每步都在变</text>
  <text class="s" x="890" y="402">所以每步的耗时也在变</text>
  <text class="s" x="890" y="428">ITL 的抖动来自别的请求何时进出</text>
  <rect class="soft" x="872" y="464" width="320" height="78" rx="14"/>
  <text class="s" x="890" y="494">第 15 章案例二那个现象就在这里：</text>
  <text class="s" x="890" y="520">平均 TPOT 没变，P99 ITL 从 40 涨到 210</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">队列长度为零不代表系统空闲：请求一到就被吸进 Running，而 Running 可能已经满载。这是 20.7 要换一组指标的理由。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">进了 Running，这条请求的节奏就和同批其他请求绑在一起，ITL 抖动由此而来</text>
</svg>
