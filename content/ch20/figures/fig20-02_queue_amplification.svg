<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">接近饱和时排队时间对负载的敏感度急剧上升</title><desc id="fig-desc">两条曲线，横轴是负载率从 0 到 0.95，纵轴是平均排队时间相当于几个 S。实线是单服务台，在 0.5 处是 1 倍，0.8 处是 4 倍，0.9 处是 9 倍，0.95 处是 19 倍，四个点分别用绿、橙、红标出；虚线是同一实例按 64 个槽位算的 Erlang C，低负载时几乎贴着横轴，接近饱和时一样陡起来。0.7 到 0.9 之间用浅色带标出，说明同样加 5% 流量在这一段里后果差别很大。右侧三块列出 LLM 服务与 M/M/1 前提的三处不符。</desc>
  <defs>
