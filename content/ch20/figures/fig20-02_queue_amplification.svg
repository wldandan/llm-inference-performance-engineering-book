  <text class="cool" x="222" y="340">单服务台（按服务台个数的上界）</text>
  <path d="M176 361H212" stroke="#0F766E" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="good" x="222" y="366">同一实例按 64 个槽位算（Erlang C，下界）</text>
  <rect x="582" y="240" width="123" height="256" fill="#B45309" opacity="0.07"/>
  <text class="warn" x="588.1030927835052" y="482">0.7–0.9</text>
  <text class="warn" x="176" y="280">浅色那一段是同样加 5% 流量后果差最远的地方</text>
  <text class="s" x="176" y="306">在 0.7 那头排队涨约两成，到 0.9 那头接近翻倍</text>
  <circle cx="459.2" cy="483.2" r="6.5" fill="#0F766E"/>
  <text class="b" x="471.21649484536084" y="473.2">1 倍</text>
  <circle cx="643.5" cy="444.8" r="6.5" fill="#B45309"/>
  <text class="b" x="655.5463917525774" y="434.8">4 倍</text>
  <circle cx="705.0" cy="380.8" r="6.5" fill="#B91C1C"/>
  <text class="b" x="716.9896907216495" y="370.8">9 倍</text>
  <circle cx="735.7" cy="252.8" r="6.5" fill="#B91C1C"/>
  <text class="b" x="723.7113402061856" y="242.8" text-anchor="end">19 倍</text>
  <path d="M274.9 496V503" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="274.88659793814435" y="524" text-anchor="middle">0.2</text>
  <path d="M397.8 496V503" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="397.7731958762887" y="524" text-anchor="middle">0.4</text>
  <path d="M520.7 496V503" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="520.659793814433" y="524" text-anchor="middle">0.6</text>
  <path d="M643.5 496V503" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="643.5463917525774" y="524" text-anchor="middle">0.8</text>
  <path d="M735.7 496V503" stroke="#94A3B8" stroke-width="1.6"/>
  <text class="s" x="735.7113402061856" y="524" text-anchor="middle">0.95</text>
  <text class="s" x="96" y="524">负载率 ρ</text>
  <text class="s" x="96" y="550">负载率是到达速率占整个实例满载吞吐的比例，不是监控面板上的 GPU 利用率</text>
  <rect class="card" x="824" y="176" width="384" height="396" rx="16"/>
  <text class="b" x="848" y="208">用它之前要知道差在哪</text>
  <rect class="soft" x="840" y="228" width="352" height="104" rx="14"/>
  <text class="s" x="858" y="258">服务台不止一个</text>
  <text class="s" x="858" y="284">按服务台个数，单服务台是上界，64 个槽位低得多，</text>
  <text class="s" x="858" y="310">但接近饱和时陡增这个形状不变</text>
  <rect class="soft" x="840" y="336" width="352" height="104" rx="14"/>
  <text class="s" x="858" y="366">服务时长不服从指数分布</text>
  <text class="s" x="858" y="392">长尾输出把等待乘上 (Ca² + Cs²)/2，</text>
  <text class="s" x="858" y="418">式子给的是平均，P99 要另算</text>
  <rect class="warnfill" x="840" y="444" width="352" height="104" rx="14"/>
  <text class="s" x="858" y="474">容量本身会缩</text>
  <text class="s" x="858" y="500">抢占要重算 Prefill，等效于 ρ 自己往上走，</text>
  <text class="s" x="858" y="526">式子里没有这一项</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">正确用法是回答“再加 10% 流量会怎样”，不是算出一个毫秒数写进报告。ρ 到 1 时队列没有上界地增长，这时要看的是队列增长速度，不是等待时间。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">70% 负载率下加 5% 流量排队涨约两成，90% 下加同样的 5% 接近翻倍</text>
</svg>
