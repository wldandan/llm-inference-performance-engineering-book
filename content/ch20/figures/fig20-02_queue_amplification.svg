  <text class="k" x="56" y="46">第 20 章 · 20.6</text><text class="t" x="56" y="86">“负载没变，P99 为什么跳”的答案在这条曲线的形状里</text><text class="sub" x="56" y="116">ρ/(1−ρ) 在 0.5、0.8、0.9、0.95 上分别是 1、4、9、19</text>
  <rect class="card" x="72" y="176" width="728" height="396" rx="16"/>
  <text class="b" x="96" y="208">平均排队是几个 S：W_q ≈ S × ρ/(1−ρ)，S = 1/满载吞吐</text>
