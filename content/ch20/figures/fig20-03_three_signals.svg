<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">三个调度信号的先后顺序，以及它们之间的预警时间</title><desc id="fig-desc">三条并列的时间轴泳道，横轴是 0 到 60 秒。第一条是槽位占用率，在第 15 秒开始持续接近 1；第二条是 Waiting 队列长度，在第 25 秒开始持续大于 0；第三条是抢占计数，在第 40 秒开始上涨。第一条和第二条之间用括号标出 lead_time 等于 10 秒。下方两块分别说明 lead_time 大于零和小于等于零时的不同结论。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 20 章 · 20.7、20.8</text><text class="t" x="56" y="86">第一个信号最早动，第三个最晚但最严重</text><text class="sub" x="56" y="116">告警配在第一个上；等第二、三个动起来，用户已经在投诉了</text>
  <rect class="card" x="72" y="176" width="1136" height="328" rx="16"/>
  <text class="b" x="96" y="208">同一段阶梯式增压里，三个信号先后动起来（合成 trace）</text>
  <rect x="272" y="244" width="792" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text class="b" x="96" y="272">槽位占用率</text>
  <rect x="470" y="244" width="594" height="44" rx="10" fill="#1D4ED8" opacity="0.14"/>
  <path d="M470 244V288" stroke="#1D4ED8" stroke-width="3"/>
  <text class="b" x="482.0" y="272">15 秒  running_ratio 持续 ≥ 0.95</text>
  <rect x="272" y="312" width="792" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text class="b" x="96" y="340">Waiting 队列长度</text>
  <rect x="602" y="312" width="462" height="44" rx="10" fill="#B45309" opacity="0.14"/>
  <path d="M602 312V356" stroke="#B45309" stroke-width="3"/>
  <text class="b" x="614.0" y="340">25 秒  waiting 持续 &gt; 0</text>
  <rect x="272" y="380" width="792" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text class="b" x="96" y="408">抢占计数</text>
  <rect x="800" y="380" width="264" height="44" rx="10" fill="#B91C1C" opacity="0.14"/>
  <path d="M800 380V424" stroke="#B91C1C" stroke-width="3"/>
  <text class="b" x="812.0" y="408">40 秒  preemption_total 上涨</text>
  <path class="bracket" d="M470 438V452H602V438"/>
  <text class="b" x="536.0" y="474" text-anchor="middle">lead_time = 10 秒</text>
  <text class="s" x="618.0" y="474">这段就是你能拿到的预警时间，告警该配在第一个信号上</text>
  <text class="s" x="272.0" y="228" text-anchor="middle">0s</text>
  <text class="s" x="404.0" y="228" text-anchor="middle">10s</text>
  <text class="s" x="536.0" y="228" text-anchor="middle">20s</text>
  <text class="s" x="668.0" y="228" text-anchor="middle">30s</text>
  <text class="s" x="800.0" y="228" text-anchor="middle">40s</text>
  <text class="s" x="932.0" y="228" text-anchor="middle">50s</text>
  <text class="s" x="1064.0" y="228" text-anchor="middle">60s</text>
  <rect class="goodfill" x="72" y="520" width="552" height="108" rx="14"/>
  <text class="b" x="92" y="552">lead_time 大于零</text>
  <text class="s" x="92" y="580">饱和到排队之间有余地，告警配在 running_ratio 上来得及</text>
  <text class="s" x="92" y="606">这段 trace 判的是 KV 不足，窗口内抢占 16 次</text>
  <rect class="badfill" x="656" y="520" width="552" height="108" rx="14"/>
  <text class="b" x="676" y="552">lead_time 小于或等于零</text>
  <text class="s" x="676" y="580">排队不晚于饱和，说明 max_num_seqs 不是当前的约束</text>
  <text class="s" x="676" y="606">这时把告警配在 running_ratio 上会完全失灵</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">lead_time 量化了饱和到排队之间的预警时间，它直接决定告警配在哪个指标上</text>
</svg>
