  <text class="s" x="980" y="420">分位数</text>
  <text class="s" x="980" y="448">阈值</text>
  <path class="flowb" d="M492 492V528"/>
  <rect class="coolfill" x="368" y="532" width="248" height="62" rx="14"/>
  <text class="mb" x="492" y="558" text-anchor="middle">steps</text>
  <text class="s" x="492" y="582" text-anchor="middle">类型是 agent 时必填</text>
  <rect class="soft" x="648" y="532" width="220" height="62" rx="14"/>
  <text class="b" x="758" y="558" text-anchor="middle">描述侧</text>
