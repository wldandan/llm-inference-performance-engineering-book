  <text class="s" x="388" y="420">output P50 / P90 / P99 / max</text>
  <text class="s" x="388" y="448">两侧分开写</text>
  <path class="flow" d="M640 252L788 316"/>
  <rect class="card" x="664" y="320" width="248" height="172" rx="16"/>
  <text class="mb" x="788" y="356" text-anchor="middle">arrival</text>
