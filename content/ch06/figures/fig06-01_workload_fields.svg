  <text class="s" x="684" y="420">速率或并发数</text>
  <text class="s" x="684" y="448">持续时间与随机种子</text>
  <path class="flow" d="M640 252L1084 316"/>
  <rect class="card" x="960" y="320" width="248" height="172" rx="16"/>
  <text class="mb" x="1084" y="356" text-anchor="middle">slo</text>
