  <path class="rule" fill="none" d="M888 528L888 598"/>
  <rect class="soft" x="908" y="532" width="300" height="62" rx="14"/>
  <text class="b" x="1058" y="558" text-anchor="middle">结果侧</text>
  <text class="s" x="1058" y="582" text-anchor="middle">本章不产生任何性能数字</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">负载不是一个形容词，是四组能写下来的字段。</text>
