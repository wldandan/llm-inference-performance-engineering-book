  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">WORKLOAD FIELDS · 06</text><text class="t" x="56" y="86">负载要拆成四组字段</text><text class="sub" x="56" y="116">说“我们的负载是 Chat”只说清了应用形态，四组字段才是能被复现的东西</text>
  <rect class="dark" x="514" y="176" width="252" height="76" rx="18"/>
  <text class="hw" x="640" y="212" text-anchor="middle">负载</text>
  <text class="sw" x="640" y="238" text-anchor="middle">一个没有定义的词</text>
  <path class="flow" d="M640 252L196 316"/>
  <rect class="card" x="72" y="320" width="248" height="172" rx="16"/>
  <text class="mb" x="196" y="356" text-anchor="middle">identity</text>
  <text class="s" x="92" y="392">名称</text>
  <text class="s" x="92" y="420">类型 chat / rag / agent</text>
  <text class="s" x="92" y="448">数据来源</text>
  <path class="flow" d="M640 252L492 316"/>
  <rect class="card" x="368" y="320" width="248" height="172" rx="16"/>
