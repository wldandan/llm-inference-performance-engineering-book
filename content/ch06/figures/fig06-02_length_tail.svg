<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 6-2 长度分布的尾巴决定了什么</title><desc id="fig-desc">右偏的 prompt 长度分布上标出 P50 180、P90 640、P99 7200、max 12000，平均值落在 P50 右边，显存峰值与 TTFT 尾部都由 P99 那一段决定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">LENGTH TAIL · 06</text><text class="t" x="56" y="86">长度分布的尾巴决定了什么</text><text class="sub" x="56" y="116">长度至少要写四个数：P50、P90、P99 和最大值</text>
  <text class="b" x="72" y="186">prompt token 长度分布</text>
  <path d="M104 512H1004" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M104 512 C 196 512 236 250 320 250 C 404 250 452 400 556 452 C 660 500 780 504 1004 508" fill="none" stroke="#1D4ED8" stroke-width="2.6"/>
  <path class="rule" fill="none" d="M320 250L320 512"/>
  <text class="b" x="320" y="538" text-anchor="middle">P50</text>
  <text class="m" x="320" y="562" text-anchor="middle">180</text>
  <path class="rule" fill="none" d="M556 300L556 512"/>
  <text class="b" x="556" y="538" text-anchor="middle">P90</text>
  <text class="m" x="556" y="562" text-anchor="middle">640</text>
  <path class="rule" fill="none" d="M836 300L836 512"/>
  <text class="b" x="836" y="538" text-anchor="middle">P99</text>
  <text class="m" x="836" y="562" text-anchor="middle">7200</text>
  <path class="rule" fill="none" d="M972 300L972 512"/>
  <text class="b" x="972" y="538" text-anchor="middle">max</text>
  <text class="m" x="972" y="562" text-anchor="middle">12000</text>
  <circle cx="404" cy="512" r="7" fill="#B45309"/>
  <text class="warn" x="404" y="466" text-anchor="middle">平均值</text>
  <text class="warn" x="404" y="488" text-anchor="middle">落在 P50 右边</text>
  <path class="flow" d="M880 300L1040 250"/>
  <rect class="badfill" x="1040" y="214" width="168" height="72" rx="14"/>
  <text class="b" x="1124" y="246" text-anchor="middle">显存峰值</text>
  <text class="s" x="1124" y="270" text-anchor="middle">由这一段决定</text>
  <path class="flow" d="M880 340L1040 380"/>
  <rect class="badfill" x="1040" y="344" width="168" height="72" rx="14"/>
  <text class="b" x="1124" y="376" text-anchor="middle">TTFT 尾部</text>
  <text class="s" x="1124" y="400" text-anchor="middle">也由这一段决定</text>
  <rect class="soft" x="72" y="574" width="700" height="52" rx="14"/>
  <text class="s" x="90" y="604">只报 P50=180 会得出“上下文很短、没什么压力”；让服务在早高峰 OOM 的是那 1% 的 7200 token</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">决定显存峰值和尾延迟的是 P99，不是平均值。</text>
</svg>
