<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 6-3 闭环与开环压的不是同一件事</title><desc id="fig-desc">同一个服务、同一份长度分布，闭环 64 并发测出 TTFT P99 约 300 ms，开环每秒 40 个五分钟内升到约 9 秒；闭环有一条从响应返回指回发送的反馈，开环没有。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CLOSED VS OPEN · 06</text><text class="t" x="56" y="86">闭环与开环压的不是同一件事</text><text class="sub" x="56" y="116">两组数字都没错，只是回答了不同的问题（合成设定）；真实用户按自己的节奏提问，对应下面那一行</text>
  <rect class="soft" x="72" y="168" width="1136" height="196" rx="14"/>
  <text class="b" x="90" y="194">闭环　64 个并发循环发送</text>
  <rect class="card" x="104" y="214" width="168" height="66" rx="14"/>
  <text class="b" x="188" y="244" text-anchor="middle">客户端</text>
  <text class="s" x="188" y="268" text-anchor="middle">并发固定 64</text>
  <path class="flow" d="M272 247H344"/>
  <rect class="soft" x="344" y="214" width="150" height="66" rx="14"/>
  <text class="b" x="419" y="252" text-anchor="middle">队列 稳定</text>
  <path class="flow" d="M494 247H566"/>
  <rect class="card" x="566" y="214" width="150" height="66" rx="14"/>
  <text class="b" x="641" y="252" text-anchor="middle">服务端</text>
  <path class="feedback" d="M641 288Q414.5 344.0 188 288"/>
  <text class="s" x="415" y="344" text-anchor="middle">响应返回后才发下一个：服务变慢时压力自动变小</text>
  <rect class="goodfill" x="792" y="206" width="384" height="84" rx="14"/>
  <text class="mb" x="816" y="240">TTFT P99 约 300 ms</text>
  <text class="s" x="816" y="268">五分钟内稳定</text>
  <rect class="soft" x="72" y="392" width="1136" height="218" rx="14"/>
  <text class="b" x="90" y="418">开环　固定每秒 40 个</text>
  <rect class="card" x="104" y="440" width="168" height="66" rx="14"/>
  <text class="b" x="188" y="470" text-anchor="middle">客户端</text>
  <text class="s" x="188" y="494" text-anchor="middle">速率固定 40/s</text>
  <path class="flow" d="M272 473H344"/>
  <rect class="badfill" x="344" y="472" width="34" height="34" rx="6"/>
  <rect class="badfill" x="388" y="454" width="34" height="52" rx="6"/>
  <rect class="badfill" x="432" y="436" width="34" height="70" rx="6"/>
  <rect class="badfill" x="476" y="418" width="34" height="88" rx="6"/>
  <text class="s" x="432" y="534" text-anchor="middle">队列越堆越长</text>
  <path class="flow" d="M528 473H566"/>
  <rect class="card" x="566" y="440" width="150" height="66" rx="14"/>
  <text class="b" x="641" y="478" text-anchor="middle">服务端</text>
  <text class="s" x="641" y="572" text-anchor="middle">没有反馈：请求继续以原速率涌入</text>
  <rect class="badfill" x="792" y="432" width="384" height="84" rx="14"/>
  <text class="mb" x="816" y="466">TTFT P99 约 9 s</text>
  <text class="s" x="816" y="494">五分钟内升到这里，而且还在涨</text>
  <text class="s" x="984" y="556" text-anchor="middle">漏掉的是最慢的那批：协调遗漏</text>
  <path class="bracket" d="M1196 290V432"/>
  <path class="bracket" d="M1188 290H1196"/>
  <path class="bracket" d="M1188 432H1196"/>
  <text class="b" x="1204" y="366" transform="rotate(90 1204 366)" text-anchor="middle">约 30 倍</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">真实用户是开环的，闭环测不出排队崩溃。</text>
</svg>
