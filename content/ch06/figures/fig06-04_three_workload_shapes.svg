</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">WORKLOAD SHAPES · 06</text><text class="t" x="56" y="86">Chat、RAG、Agent 是三种形状</text><text class="sub" x="56" y="116">前面几节的字段适用于任何负载，但填进去之后三类应用的形状很不一样</text>
  <rect class="card" x="72" y="172" width="1136" height="124" rx="16"/>
  <text class="h" x="96" y="212">Chat</text>
  <text class="s" x="96" y="242">一次任务 1 次</text>
  <text class="s" x="96" y="268">LLM 调用</text>
  <rect class="coolfill" x="272" y="214" width="110" height="40" rx="6"/>
  <text class="s" x="327.0" y="240" text-anchor="middle">用户输入</text>
  <rect class="coolfill" x="396" y="214" width="118" height="40" rx="6"/>
  <text class="s" x="455.0" y="240" text-anchor="middle">→ LLM 调用</text>
  <text class="s" x="800" y="210">输入长度由什么决定</text>
  <text class="b" x="800" y="238">对话历史轮次</text>
  <text class="s" x="800" y="270">特有字段　平均轮次、每轮增量</text>
  <rect class="card" x="72" y="322" width="1136" height="124" rx="16"/>
  <text class="h" x="96" y="362">RAG</text>
  <text class="s" x="96" y="392">一次任务 1 次</text>
  <text class="s" x="96" y="418">LLM 调用</text>
  <rect class="coolfill" x="272" y="364" width="110" height="40" rx="6"/>
  <text class="s" x="327.0" y="390" text-anchor="middle">用户问题</text>
  <rect class="coolfill" x="396" y="364" width="100" height="40" rx="6"/>
  <text class="s" x="446.0" y="390" text-anchor="middle">→ 检索</text>
  <rect class="coolfill" x="510" y="364" width="118" height="40" rx="6"/>
  <text class="s" x="569.0" y="390" text-anchor="middle">→ LLM 调用</text>
  <text class="s" x="800" y="360">输入长度由什么决定</text>
  <text class="b" x="800" y="388">Top-K × 每段长度</text>
  <text class="s" x="800" y="420">特有字段　Top-K、片段长度、是否重排</text>
  <rect class="card" x="72" y="472" width="1136" height="124" rx="16"/>
  <text class="h" x="96" y="512">Agent</text>
  <text class="s" x="96" y="542">一次任务 多次，不固定</text>
  <text class="s" x="96" y="568">LLM 调用</text>
  <rect class="coolfill" x="272" y="514" width="88" height="40" rx="6"/>
  <text class="s" x="316.0" y="540" text-anchor="middle">任务</text>
  <rect class="coolfill" x="374" y="514" width="104" height="40" rx="6"/>
  <text class="s" x="426.0" y="540" text-anchor="middle">→ 调用 1</text>
  <rect class="coolfill" x="492" y="514" width="120" height="40" rx="6"/>
  <text class="s" x="552.0" y="540" text-anchor="middle">→ 调用 2</text>
  <rect class="coolfill" x="626" y="514" width="136" height="40" rx="6"/>
  <text class="s" x="694.0" y="540" text-anchor="middle">→ …</text>
  <text class="s" x="800" y="510">输入长度由什么决定</text>
  <text class="b" x="800" y="538">累积的工具结果</text>
  <text class="s" x="800" y="570">特有字段　步数分布、工具调用比例、重试率</text>
  <text class="s" x="640" y="618" text-anchor="middle">Agent 那一行的方块逐级变宽，表示上下文在累积</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">Agent 必须在任务层描述，否则连调用数都说不清。</text>
</svg>
