</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">OBSERVER EFFECT · 09</text><text class="t" x="56" y="86">采集开销是偏差，不是波动</text><text class="sub" x="56" y="116">可识别线管的是随机波动；采集开销每一轮都在，不会被多跑几轮平均掉</text>
  <rect class="soft" x="110" y="389.8714285714286" width="720" height="34.542857142857116" rx="0"/>
  <rect class="soft" x="110" y="172" width="28" height="18" rx="0"/>
  <text class="warn" x="150" y="187">灰带：假如照搬第 7.3 节 TTFT P95 那条 13% 的线</text>
  <rect class="soft" x="150" y="407.1428571428571" width="130" height="132.85714285714286" rx="6"/>
  <text class="mb" x="215" y="393.1428571428571" text-anchor="middle">620 ms</text>
  <text class="s" x="215" y="570" text-anchor="middle">不采集</text>
  <text class="b" x="215" y="596" text-anchor="middle">基线</text>
  <rect class="goodfill" x="320" y="400.7142857142857" width="130" height="139.28571428571428" rx="6"/>
  <text class="mb" x="385" y="386.7142857142857" text-anchor="middle">650 ms</text>
  <text class="s" x="385" y="570" text-anchor="middle">采样 profiler</text>
  <text class="b" x="385" y="596" text-anchor="middle">+4.8%</text>
  <rect class="warnfill" x="490" y="387.8571428571429" width="130" height="152.14285714285714" rx="6"/>
  <text class="mb" x="555" y="373.8571428571429" text-anchor="middle">710 ms</text>
  <text class="s" x="555" y="570" text-anchor="middle">框架 trace</text>
  <text class="b" x="555" y="596" text-anchor="middle">+14.5%</text>
  <rect class="badfill" x="660" y="252.85714285714283" width="130" height="287.14285714285717" rx="6"/>
  <text class="mb" x="725" y="238.85714285714283" text-anchor="middle">1340 ms</text>
  <text class="s" x="725" y="570" text-anchor="middle">kernel 分析器</text>
  <text class="b" x="725" y="596" text-anchor="middle">+116%</text>
  <rect class="card" x="870" y="176" width="338" height="396" rx="16"/>
  <text class="b" x="894" y="214">这三份开销怎么处理</text>
  <text class="mb" x="894" y="262">+4.8%</text>
  <text class="good" x="990" y="262">两边都开着测</text>
  <text class="s" x="894" y="290">偏差在差值里抵消，可以比</text>
  <text class="mb" x="894" y="354">+14.5%</text>
  <text class="warn" x="990" y="354">条件相同才可比</text>
  <text class="s" x="894" y="382">调度结论仍然可用</text>
  <text class="mb" x="894" y="446">+116%</text>
  <text class="bad" x="990" y="446">另一个系统</text>
  <text class="s" x="894" y="474">任何延迟数字都不要拿去比</text>
  <text class="s" x="894" y="528">或者先测出开销，再从数字里扣掉</text>
  <text class="s" x="894" y="556">图中四个数是合成设定，不是实测</text>
  <text class="s" x="110" y="632">+4.8% 落在波动带里，但它每一轮都在，多跑几轮也平均不掉</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">偏差靠对齐采集条件或扣除来处理，不靠和可识别线比大小。</text>
</svg>
