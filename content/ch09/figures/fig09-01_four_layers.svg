  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">FOUR LAYERS · 09</text><text class="t" x="56" y="86">四层从便宜到昂贵</text><text class="sub" x="56" y="116">上一层能解释清楚的现象，不需要下一层的数据</text>
  <rect class="goodfill" x="96" y="176" width="856" height="92" rx="14"/>
  <text class="h" x="120" y="214">请求级</text>
  <text class="s" x="120" y="246">排队、首 token、生成各占多久</text>
  <text class="s" x="430" y="214">引擎请求级指标、日志、Trace</text>
  <text class="s" x="430" y="246">开销　极低，可以常开</text>
  <rect class="goodfill" x="122" y="284" width="830" height="92" rx="14"/>
  <text class="h" x="146" y="322">进程级</text>
  <text class="s" x="146" y="354">CPU 忙在哪、有没有阻塞</text>
  <text class="s" x="430" y="322">采样式 profiler、py-spy 一类</text>
  <text class="s" x="430" y="354">开销　低</text>
  <rect class="warnfill" x="148" y="392" width="804" height="92" rx="14"/>
  <text class="h" x="172" y="430">框架级</text>
  <text class="s" x="172" y="462">调度批次怎么形成、有没有抢占</text>
  <text class="s" x="430" y="430">框架自带 profiler、engine trace</text>
  <text class="s" x="430" y="462">开销　中</text>
  <rect class="badfill" x="174" y="500" width="778" height="92" rx="14"/>
  <text class="h" x="198" y="538">设备级</text>
  <text class="s" x="198" y="570">kernel 执行、空隙、显存带宽</text>
  <text class="s" x="430" y="538">GPU 时间线、kernel 分析器</text>
  <text class="s" x="430" y="570">开销　中到高</text>
  <path class="flow" d="M76 196V580"/>
  <text class="s" x="46" transform="rotate(-90 46 392)" y="392" text-anchor="middle">从便宜到昂贵</text>
  <rect class="card" x="988" y="176" width="220" height="200" rx="14"/>
  <text class="b" x="1098" y="214" text-anchor="middle">往下走的判据</text>
  <text class="s" x="1012" y="254">上一层的数据里，</text>
  <text class="s" x="1012" y="282">还有没有解释不了</text>
  <text class="s" x="1012" y="310">的部分？</text>
  <text class="b" x="1012" y="350">没有就不要往下</text>
  <rect class="badfill" x="988" y="400" width="220" height="176" rx="14"/>
  <text class="b" x="1098" y="438" text-anchor="middle">跳级</text>
  <text class="s" x="1012" y="478">请求级还没看就</text>
  <text class="s" x="1012" y="506">去抓 kernel：</text>
  <text class="s" x="1012" y="534">花半天得到的结论</text>
  <text class="s" x="1012" y="562">可能只是“在排队”</text>
  <path d="M952 222 Q 992 384 952 546" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-dasharray="7 5"/>
  <path d="M962 368L986 400" stroke="#B91C1C" stroke-width="3.4"/>
  <path d="M986 368L962 400" stroke="#B91C1C" stroke-width="3.4"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">判断该不该往下走，只看上一层还有没有解释不了的部分。</text>
</svg>
