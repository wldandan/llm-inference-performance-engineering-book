    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CRITICAL PATH · 09</text><text class="t" x="56" y="86">排序表与关键路径不是一回事</text><text class="sub" x="56" y="116">占比最高的那一项，未必是缩短它就能让请求变快的那一项</text>
  <text class="b" x="72" y="186">按耗时排序的表</text>
  <rect class="card" x="72" y="204" width="360" height="228" rx="14"/>
  <text class="b" x="96" y="248">生成</text>
  <rect class="coolfill" x="200" y="232" width="140" height="20" rx="4"/>
  <text class="m" x="352" y="248">800 ms</text>
  <text class="b" x="96" y="298">向量检索</text>
  <rect class="coolfill" x="200" y="282" width="60" height="20" rx="4"/>
  <text class="m" x="352" y="298">120 ms</text>
  <text class="b" x="96" y="348">关键词检索</text>
  <rect class="coolfill" x="200" y="332" width="40" height="20" rx="4"/>
  <text class="m" x="352" y="348">70 ms</text>
  <text class="b" x="96" y="398">重排</text>
  <rect class="coolfill" x="200" y="382" width="26" height="20" rx="4"/>
  <text class="m" x="352" y="398">40 ms</text>
  <text class="bad" x="72" y="462">排序表看不出下面这件事</text>
  <text class="b" x="470" y="186">同一次 RAG 请求的两种时间线</text>
  <text class="b" x="470" y="238">串行</text>
  <rect class="coolfill" x="570" y="216" width="120" height="34" rx="6"/>
  <text class="s" x="630.0" y="238" text-anchor="middle">向量 120</text>
  <rect class="warnfill" x="690" y="216" width="70" height="34" rx="6"/>
  <text class="s" x="725.0" y="238" text-anchor="middle">关键词 70</text>
  <rect class="coolfill" x="760" y="216" width="40" height="34" rx="6"/>
  <rect class="coolfill" x="800" y="216" width="250" height="34" rx="6"/>
  <text class="s" x="925.0" y="238" text-anchor="middle">生成 800</text>
  <text class="s" x="780" y="276" text-anchor="middle">↑ 重排 40</text>
  <text class="s" x="1020" y="238" text-anchor="middle">≈</text>
  <text class="b" x="1064" y="238">关键路径 1030 ms</text>
  <text class="b" x="470" y="334">并行</text>
  <rect class="coolfill" x="570" y="300" width="120" height="28" rx="6"/>
  <text class="s" x="630" y="319" text-anchor="middle">向量 120</text>
  <rect class="warnfill" x="570" y="334" width="70" height="28" rx="6"/>
  <text class="s" x="605" y="353" text-anchor="middle">关键词 70</text>
  <rect class="coolfill" x="690" y="300" width="40" height="62" rx="6"/>
  <text class="s" x="710" y="384" text-anchor="middle">重排 40</text>
  <rect class="coolfill" x="730" y="300" width="250" height="62" rx="6"/>
  <text class="s" x="855.0" y="336" text-anchor="middle">生成 800</text>
  <text class="s" x="950" y="336" text-anchor="middle">≈</text>
  <text class="b" x="994" y="336">关键路径 960 ms</text>
  <rect class="card" x="470" y="404" width="738" height="128" rx="14"/>
  <text class="b" x="494" y="440">把关键词检索从 70 ms 优化到 20 ms</text>
  <text class="b" x="494" y="476">串行</text>
  <text class="good" x="560" y="476">端到端省 50 ms</text>
  <text class="b" x="494" y="510">并行</text>
  <text class="bad" x="560" y="510">端到端省 0，它本来就躲在向量检索的 120 ms 里</text>
  <rect class="soft" x="72" y="552" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="582">重排要等两路候选集都回来，在两种结构里都在链上；能不能藏起来，看的是依赖关系，不是耗时排序</text>
  <text class="s" x="1208" y="394" text-anchor="end">生成段按比例缩短画出</text>
  <path class="flow" d="M444 300H462"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">只有缩短关键路径上的段，端到端才会变快。</text>
</svg>
