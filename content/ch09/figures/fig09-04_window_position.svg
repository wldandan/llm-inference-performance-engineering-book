  <title id="fig-title">图 9-4 采集窗口的位置比长度重要</title><desc id="fig-desc">一条时间轴上，现象发生在 9:02 到 9:07；采集窗口 A 落在 10:00 到 10:05，与现象零重叠；采集窗口 B 落在同一段，完全覆盖。两个窗口长度相同。</desc>
