  <text class="s" x="792" y="502" text-anchor="middle">不适用</text>
  <text class="s" x="910" y="502" text-anchor="middle">不适用</text>
  <text class="b" x="1090" y="502" text-anchor="middle" fill="#1D4ED8">不可分辨  收益在容量</text>
  <text class="b" x="120" y="540">第 2 轮能比的三个维度全部改善，只有质量越界，判失败：记分卡不是投票</text>
  <rect class="badfill" x="72" y="572" width="552" height="56" rx="14"/>
  <text class="s" x="92" y="606">质量是否决项。抢占计数接近否决项，它意味着系统在不稳定区运行</text>
  <rect class="coolfill" x="656" y="572" width="552" height="56" rx="14"/>
  <text class="s" x="676" y="606">第 4 轮主指标测不出来，收益写在 capacity 那一列，不往主指标上凑</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">质量是否决项不是投票项：四个维度改善抵不过一个越界</text>
</svg>
