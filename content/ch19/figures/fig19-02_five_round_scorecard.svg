</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 19 章 · 19.1、19.4</text><text class="t" x="56" y="86">五个维度缺一个，结论就不完整</text><text class="sub" x="56" y="116">没有一项手段是单向的，所以只看一个指标必然误判</text>
  <rect class="card" x="72" y="176" width="1136" height="380" rx="16"/>
