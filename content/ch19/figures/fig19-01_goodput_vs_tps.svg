  <path d="M158 534H540" stroke="#0F766E" stroke-width="3"/>
  <text class="good" x="348.79999999999995" y="552" text-anchor="middle">可行档位：达标率 ≥ 95%</text>
  <rect class="card" x="816" y="176" width="392" height="396" rx="16"/>
  <text class="b" x="840" y="210">为什么用 Goodput 当主指标</text>
  <rect class="goodfill" x="832" y="230" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="260">SLO 把取舍变成两步规则</text>
  <text class="s" x="850" y="286">先筛：达标率不低于 95% 的档位</text>
  <text class="s" x="850" y="312">再选：其中 Goodput 最大的那档</text>
  <rect class="coolfill" x="832" y="348" width="344" height="104" rx="14"/>
  <text class="s" x="850" y="378">达标 = TTFT ≤ 1500 ms，且这条</text>
  <text class="s" x="850" y="404">请求自己的 P95 ITL ≤ 80 ms</text>
  <text class="s" x="850" y="430">Goodput 只在可行档位里比大小</text>
  <rect class="soft" x="832" y="466" width="344" height="78" rx="14"/>
  <text class="s" x="850" y="496">前沿上的候选都留着</text>
  <text class="s" x="850" y="522">SLO 一变最优点就换一个，而前沿不变</text>
  <rect class="soft" x="72" y="588" width="1136" height="52" rx="14"/>
  <text class="s" x="90" y="618">数据出自 content/ch19/evidence/decode-experiment-sample.json，是合成样例，不是真机结果。要看的是两个峰值不在一处这件事，不是这几个具体数字。</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">批量扫描要找 Goodput 的峰值，不是 TPS 的峰值；两者不在一处是常态</text>
</svg>
