  <circle cx="522" cy="296" r="9" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text class="good" x="505.5999999999999" y="300.86008888888887" text-anchor="end">可行集里的 Goodput 峰值 1560</text>
  <text class="good" x="742.0" y="365.60355555555554" text-anchor="end">批量 128 只剩 666</text>
  <text class="warn" x="636.8" y="267.70893333333333" text-anchor="middle">全表最高 1807，达标率 74%</text>
  <text class="b" x="96" y="384">整轮的 P95 ITL（ms）与单条请求 ITL 的那条 80 ms 线</text>
