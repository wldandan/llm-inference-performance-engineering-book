</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">第 19 章 · 19.3、19.7</text><text class="t" x="56" y="86">TPS 峰值和 Goodput 峰值不在同一处，这是常态</text><text class="sub" x="56" y="116">批量 64 的 Goodput 全表最高却不可行，批量 128 的吞吐是靠让八成请求超时换来的</text>
  <rect class="card" x="72" y="176" width="720" height="396" rx="16"/>
  <text class="b" x="96" y="206">吞吐（token/s）：名义 TPS 与达标的 Goodput</text>
