</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH11 · 11.4</text><text class="t" x="56" y="86">算术强度数轴上的两个点</text><text class="sub" x="56" y="116">Prefill 和 Decode 为什么不能互相照搬优化经验</text>
  <rect class="soft" x="72" y="176" width="1152" height="96" rx="14"/>
  <text class="mb" x="96" y="210">只算权重：(2 × 参数量 × S) ÷ (2 × 参数量) = S</text>
  <text class="mb" x="96" y="248">算上激活读写：1 ÷ (1/S + 1/k + 1/n)，S 长到和矩阵宽度相当时封顶</text>
  <path d="M132 390H1160" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path class="bracket" d="M132.0 383V397"/>
  <text class="m" x="132.0" y="418" text-anchor="middle">1</text>
  <path class="bracket" d="M371.01251584768363 383V397"/>
  <text class="m" x="371.01251584768363" y="418" text-anchor="middle">10</text>
  <path class="bracket" d="M610.0250316953673 383V397"/>
  <text class="m" x="610.0250316953673" y="418" text-anchor="middle">100</text>
  <path class="bracket" d="M849.0375475430509 383V397"/>
  <text class="m" x="849.0375475430509" y="418" text-anchor="middle">1000</text>
  <path class="bracket" d="M1088.0500633907345 383V397"/>
  <text class="m" x="1088.0500633907345" y="418" text-anchor="middle">10⁴</text>
  <text class="s" x="1160" y="442" text-anchor="end">FLOP / byte</text>
  <rect class="soft" x="652.1130465410519" y="320" width="101.81185837284636" height="40" rx="8"/>
  <text class="b" x="703.018975727475" y="346" text-anchor="middle">分界点</text>
  <text class="s" x="703.018975727475" y="304" text-anchor="middle">硬件分界点：一两百到几百，随卡而变</text>
  <text class="b" x="632.1130465410519" y="346" text-anchor="end">← 带宽受限</text>
  <text class="b" x="900" y="330">算力受限 →</text>
  <circle cx="132.0" cy="390" r="10" fill="#B91C1C"/>
  <text class="mb" x="152.0" y="368" fill="#B91C1C">Decode ≈ 1</text>
  <text class="s" x="152.0" y="446">每步只有一个 token</text>
  <circle cx="1064.9" cy="390" r="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.4" stroke-dasharray="4 3"/>
  <text class="s" x="1064.8873573708474" y="368" text-anchor="middle">只算权重 8000</text>
  <circle cx="796.4" cy="390" r="10" fill="#0F766E"/>
  <text class="mb" x="788.4" y="368" fill="#0F766E">Prefill ≈ 602</text>
  <text class="s" x="796.3583504169266" y="446" text-anchor="middle">8000 token，算上激活读写</text>
  <path class="flow" d="M1056.9 406Q970.6 468 808.4 406"/>
  <path d="M132.0 466V478H796.4V466" fill="none" stroke="#64748B" stroke-width="2"/>
  <text class="mb" x="464.1791752084633" y="502" text-anchor="middle">相差约 600 倍</text>
  <rect class="goodfill" x="72" y="526" width="552" height="100" rx="14"/>
  <text class="b" x="96" y="558">增大 batch：Decode 有收益</text>
  <text class="m" x="96" y="584">强度变成批量大小，1 → 64</text>
  <text class="s" x="96" y="610">仍在分界点左边，往右推就有空间可拿</text>
  <rect class="badfill" x="672" y="526" width="552" height="100" rx="14"/>
  <text class="b" x="696" y="558">增大 batch：Prefill 没有意义</text>
  <text class="m" x="696" y="584">本来就在几百，已在分界点右边</text>
  <text class="s" x="696" y="610">往右推不会变快，只会互相争抢算力</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">Prefill 在分界点右侧几百，Decode 在左侧约 1；两侧相差几百倍，优化手段没有重合。</text>
</svg>
