  <text class="s" x="112" y="210" text-anchor="end">相对计算量</text>
  <text class="s" x="72" y="604">交叉点 = 2 × hidden + 2 × KV 维度 + 3 × MLP 中间维度 = 2×896 + 2×128 + 3×4864，与层数无关；MLP 中间维度最大，宽 MLP 的模型交叉点更靠后</text>
  <rect class="soft" x="788" y="182" width="436" height="196" rx="14"/>
