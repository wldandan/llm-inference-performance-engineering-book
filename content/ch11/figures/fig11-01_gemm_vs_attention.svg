  <text class="m" x="1200" y="304" text-anchor="end">32%</text>
  <text class="m" x="812" y="330">16640 token</text>
  <text class="mb" x="1200" y="330" text-anchor="end">50%</text>
  <text class="m" x="812" y="356">32768 token</text>
  <text class="m" x="1200" y="356" text-anchor="end">66%</text>
  <rect class="soft" x="788" y="394" width="436" height="176" rx="14"/>
  <text class="h" x="812" y="426">长度翻倍，计算量涨几倍</text>
  <text class="m" x="812" y="460">1000 → 2000</text>
  <text class="m" x="1200" y="460" text-anchor="end">2.11</text>
  <text class="m" x="812" y="486">2000 → 4000</text>
  <text class="m" x="1200" y="486" text-anchor="end">2.21</text>
  <text class="m" x="812" y="512">8000 → 16000</text>
  <text class="m" x="1200" y="512" text-anchor="end">2.65</text>
  <text class="m" x="812" y="538">16640 → 33280</text>
  <text class="mb" x="1200" y="538" text-anchor="end">3.00</text>
  <text class="m" x="812" y="564">再往长</text>
  <text class="m" x="1200" y="564" text-anchor="end">趋近 4，取不到</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">Attention 占多少由长度决定，交叉点由模型形状决定；上下文窗口内翻倍最多涨到约三倍。</text>
