  <text class="b" x="590.3" y="309.2" text-anchor="end" fill="#B45309">Attention  S²（抛物线）</text>
  <text class="b" x="310.5" y="417.5" fill="#1D4ED8">GEMM  16640 × S（直线）</text>
  <text class="m" x="128.0" y="534" text-anchor="middle">0</text>
  <text class="m" x="322.66666666666663" y="534" text-anchor="middle">8000</text>
  <text class="m" x="532.9066666666668" y="534" text-anchor="middle">16640</text>
