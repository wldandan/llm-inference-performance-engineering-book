    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH11 · 11.3</text><text class="t" x="56" y="86">KV Cache 往两个方向长</text><text class="sub" x="56" y="116">显存的压力和计算的压力不在同一个地方</text>
  <rect class="soft" x="72" y="190" width="300" height="196" rx="14"/>
  <text class="h" x="92" y="222">一个 token 要写多少</text>
  <text class="m" x="92" y="256">2 × 2 × 64 × 2 B = 512 B</text>
  <text class="s" x="92" y="280">K 和 V   KV 头   head_dim   FP16</text>
  <text class="mb" x="92" y="318">512 B × 24 层 = 12 KiB</text>
  <text class="s" x="92" y="352">GQA 只有 2 个 KV 头，</text>
  <text class="s" x="92" y="374">标准 MHA 是 14 个，大七倍</text>
  <path d="M470 206V546H900" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text class="b" x="900" y="576" text-anchor="end">序列长度（线性）</text>
  <text class="b" x="456" y="194">并发数（线性）</text>
  <path class="rule" fill="none" d="M470 478L900 478"/>
  <path class="rule" fill="none" d="M556 206L556 546"/>
  <path class="rule" fill="none" d="M470 410L900 410"/>
  <path class="rule" fill="none" d="M642 206L642 546"/>
  <path class="rule" fill="none" d="M470 342L900 342"/>
  <path class="rule" fill="none" d="M728 206L728 546"/>
  <path class="rule" fill="none" d="M470 274L900 274"/>
  <path class="rule" fill="none" d="M814 206L814 546"/>
  <circle cx="556" cy="478" r="9" fill="#0F766E"/>
  <text class="mb" x="574" y="476" fill="#0F766E">94 MiB</text>
  <text class="s" x="574" y="500">8000 token，单条</text>
  <circle cx="556" cy="274" r="9" fill="#B91C1C"/>
  <text class="mb" x="574" y="272" fill="#B91C1C">4.58 GiB</text>
  <text class="s" x="574" y="296">同样长度，50 并发</text>
  <circle cx="728" cy="274" r="9" fill="#B91C1C"/>
  <text class="mb" x="746" y="272" fill="#B91C1C">13.7 GiB</text>
  <text class="s" x="746" y="296">24000 token，50 并发</text>
  <path class="rule" fill="none" d="M556 468L556 284"/>
  <path class="rule" fill="none" d="M566 274L718 274"/>
  <rect class="coolfill" x="948" y="190" width="276" height="152" rx="14"/>
  <text class="h" x="968" y="224">显存</text>
  <text class="b" x="968" y="256">两个方向都线性</text>
  <text class="m" x="968" y="288">长度 × 2 → 显存 × 2</text>
  <text class="m" x="968" y="316">并发 × 2 → 显存 × 2</text>
  <rect class="warnfill" x="948" y="362" width="276" height="152" rx="14"/>
  <text class="h" x="968" y="396">计算</text>
  <text class="b" x="968" y="428">长度方向超线性</text>
  <text class="m" x="968" y="460">长度 × 2 → 计算 × 2.2</text>
  <text class="m" x="968" y="488">有 S² 项，显存没有</text>
  <rect class="soft" x="72" y="410" width="300" height="138" rx="14"/>
  <text class="s" x="90" y="440">单位一律用二进制：KiB / MiB / GiB</text>
  <text class="s" x="90" y="466">与框架日志和显存分配器同口径</text>
  <text class="s" x="90" y="492">若是标准 MHA（14 个 KV 头），</text>
  <text class="s" x="90" y="518">上面每个数都要乘以 7</text>
  <text class="b" x="948" y="546">所以两者的拐点不在同一个地方</text>
  <text class="s" x="948" y="572">权重、激活值那部分在第 16 章</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">显存是严格线性的两个方向，计算是超线性的一个方向，别把两张账混着算。</text>
</svg>
