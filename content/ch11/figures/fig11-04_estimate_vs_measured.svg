<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="part02-v1" fill="#0F172A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig-title">图 11-4 实测落在下限的哪一侧</title><desc id="fig-desc">左侧给出 8.5 TFLOPs 的完整算式，分别除以峰值 153 TFLOP/s 和有效 30 TFLOP/s，得到下限约 55 ms 与估计约 283 ms；右侧一条不按比例的时间轴，标出 2400、300、150、40 ms 四个实测值相对估计线与下限线的位置及各自的解读，只有下限以下画成阴影区。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0F766E"/></marker>
    <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}
    .t{font-size:30px;font-weight:750}
    .sub{font-size:16px;fill:#64748B}
    .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}
    .soft{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}
    .dark{fill:#0F172A}
    .h{font-size:20px;font-weight:750}
    .hw{font-size:20px;font-weight:750;fill:#FFFFFF}
    .s{font-size:15px;fill:#64748B}
    .sw{font-size:15px;fill:#CBD5E1}
    .b{font-size:17px;font-weight:700}
    .m{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .mb{font-size:17px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    .flowb{fill:none;stroke:#1D4ED8;stroke-width:2.5;marker-end:url(#arrowb)}
    .feedback{fill:none;stroke:#0F766E;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowg)}
    .bracket{fill:none;stroke:#64748B;stroke-width:2}
    .divider{stroke:#E2E8F0;stroke-width:1.5}
    .rule{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 5}
    .take{fill:#0F172A}
    .tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}
    .tv{font-size:18px;font-weight:650;fill:#FFFFFF}
    .good{fill:#0F766E}
    .warn{fill:#B45309}
    .bad{fill:#B91C1C}
    .cool{fill:#1D4ED8}
    .goodfill{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.6}
    .warnfill{fill:#FFFBEB;stroke:#B45309;stroke-width:1.6}
    .badfill{fill:#FEF2F2;stroke:#B91C1C;stroke-width:1.6}
    .coolfill{fill:#EFF6FF;stroke:#1D4ED8;stroke-width:1.6}
</style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CH11 · 11.5</text><text class="t" x="56" y="86">实测落在下限的哪一侧</text><text class="sub" x="56" y="116">下限用峰值算，估计用有效值算，两条线回答两个问题</text>
  <rect class="soft" x="72" y="186" width="400" height="288" rx="14"/>
  <text class="h" x="94" y="220">下限与估计是怎么来的</text>
  <text class="b" x="94" y="254">GEMM</text>
  <text class="mb" x="452" y="254" text-anchor="end">5.7 TFLOPs</text>
  <text class="m" x="94" y="278">2 × 3.58 亿 × 8000</text>
  <text class="b" x="94" y="314">Attention</text>
  <text class="mb" x="452" y="314" text-anchor="end">2.75 TFLOPs</text>
  <text class="m" x="94" y="338">2 × 896 × 24 × 8000²</text>
  <path class="rule" fill="none" d="M92 380L452 380"/>
  <text class="b" x="94" y="406">合计</text>
  <text class="mb" x="452" y="406" text-anchor="end">8.5 TFLOPs</text>
  <text class="m" x="94" y="436">÷ 峰值 153 TFLOP/s　→ 下限约 55 ms</text>
  <text class="m" x="94" y="462">÷ 有效 30 TFLOP/s　→ 估计约 283 ms</text>
  <rect class="soft" x="72" y="500" width="400" height="112" rx="14"/>
  <text class="s" x="90" y="530">参数量用非嵌入参数量 3.58 亿。</text>
  <text class="s" x="90" y="556">词表嵌入 1.36 亿是查表不是 GEMM，</text>
  <text class="s" x="90" y="582">照总参数量 4.94 亿算会高估 38%。</text>
  <path d="M556 196V612" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect class="soft" x="546" y="500" width="678" height="112" rx="0"/>
  <path d="M546 300H1224" stroke="#64748B" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="s" x="1216" y="290" text-anchor="end">估计 283 ms · 有效算力是假设值，不是规格峰值</text>
  <path d="M546 500H1224" stroke="#0F172A" stroke-width="3"/>
  <text class="mb" x="1216" y="490" text-anchor="end">下限 55 ms · 硬件满载也快不过它</text>
  <circle cx="556" cy="232" r="9" fill="#B91C1C"/>
  <text class="mb" x="580" y="228" fill="#B91C1C">实测 2400 ms</text>
  <text class="b" x="580" y="254">高出估计 8.5 倍：有额外开销要查</text>
  <circle cx="556" cy="346" r="9" fill="#0F766E"/>
  <text class="mb" x="580" y="342" fill="#0F766E">实测 300 ms</text>
  <text class="b" x="580" y="368">与估计同一量级：没有明显异常</text>
  <circle cx="556" cy="436" r="9" fill="#0F766E"/>
  <text class="mb" x="580" y="432" fill="#0F766E">实测 150 ms</text>
  <text class="b" x="580" y="458">在下限与估计之间：实现比假设高效，不是缓存信号</text>
  <circle cx="556" cy="560" r="9" fill="#B45309"/>
  <text class="mb" x="580" y="556" fill="#B45309">实测 40 ms</text>
  <text class="b" x="580" y="582">低于下限：有一段计算没有发生，先查 Prefix Cache</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675">关键结论</text><text class="tv" x="184" y="676">比下限快才说明计算没有发生；比估计快只说明实现比假设高效。</text>
</svg>
